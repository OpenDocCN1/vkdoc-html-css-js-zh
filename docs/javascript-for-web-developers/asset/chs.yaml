- "# 1. 使用 JavaScript 工作\n\n如果你是完全的 JavaScript 新手，或者编程新手，那么你需要了解一些基本概念。其中许多概念是其他编程语言共有的，但每种语言都有其独特之处。\n\
  \n在本章中，我们将初步了解以下概念：\n\n- 如何编写 JavaScript 语句\n- 使用变量\n- 使用不同类型的基本数据\n- 函数\n- 为代码添加注释\n\
  - 特殊值\n\n即使你从其他语言中熟悉了这些概念，也值得浏览一下本章，以防与你自己的经验有显著不同。\n\n接着，你将了解如何为你的网页添加 JavaScript\
  \ 的基本框架。\n\n当然，在后面的章节中，我们将研究更高级的概念，例如：\n\n- 在第 2 章及后续章节中使用 JavaScript 控制结构\n- 在第\
  \ 3 和第 4 章中使用 HTML 元素\n- 在第 5 和第 6 章中使用表单和数据\n- 在第 7、8 和 9 章中与用户交互并操作样式\n- 在第 10\
  \ 章中使用 Ajax\n\n但首先，我们先来看一下 JavaScript 是如何工作的。\n\n## 使用开发者工具\n\n本章将具有很强的交互性，因此你需要一个交互性很强的\
  \ JavaScript 工具。幸运的是，大多数现代浏览器的开发者工具中都提供了你所需的工具。\n\n你会发现开发者工具不仅对本章有帮助，对调试 JavaScript\
  \ 乃至 CSS 和 HTML 也很有用。你可以通过某个菜单访问开发者工具，也可以使用以下快捷键之一：\n\n| 操作系统 | 快捷键图示 | 按键组合 |\n\
  | --- | --- | --- |\n| MacOS | ![](img/609513_1_En_1_Figa_HTML.gif) 用于在 Mac O S\
  \ 中访问开发者工具的 option + command + I 组合键图示。 | `option-command-I` |\n| Windows | ![](img/609513_1_En_1_Figb_HTML.gif)\
  \ 用于在 Windows 中访问开发者工具的 control + shift + I 组合键图示。 | `control-shift-I` |\n\n你会看到类似图\
  \ 1-1 的内容。\n\n![](img/609513_1_En_1_Fig1_HTML.png)\n\n一个 JavaScript 101 窗口的截图。控制台选项已被选中。\n\
  \n**图 1-1**\n\n开发者工具\n\n在图中，开发者工具箱已停靠在右侧。\n\n你不需要打开这个特定的页面：任何页面都可以。但稍后，你将使用控制台来处理特定的页面。\n\
  \n使用控制台时，你会注意到一些特殊之处：\n\n- 每当你按下回车键时，所有表达式和值都会自动输出。也就是说，你不会换行，但会得到一个值。\n- 如果你想要新的一行代码，你需要按下\
  \ `shift-enter`。\n\n虽然我们将交互式地使用控制台，但你也可以从 JavaScript 代码中向控制台写入内容。当然，你通常看不到这些输出，但可以在排查问题时打开控制台。\n\
  \n在控制台窗口中，你会看到一个简单的提示符：`»`。我们将在后续的代码示例中包含这个提示符，但你当然不需要自己输入。例如：\n\n```\n»   3+5\n\
  ```\n\n如果你按下回车键，你会看到经过求值的结果，前面有一个类似左箭头的符号：\n\n```\n»   3+5\n←   8\n```\n\n控制台会始终显示你刚刚输入的表达式或语句的值。\n\
  \n现在，这里有一个容易混淆的地方。有时，你会使用一个特殊的语句，例如 `console.log()`。按下回车键后，你会看到类似下面的内容：\n\n```\n\
  »   console.log('Hello');\nHello\n←   undefined\n```\n\n你实际上看到了*两个*结果。第一个是 `console.log()`\
  \ 命令的*输出*：如你所料，是 `Hello`。第二个是这条语句的*值*，由于技术原因，它是一个名为 `undefined` 的特殊值。如果你觉得这很令人困惑，嗯，确实如此。好消息是你可以忽略它。\n\
  \n在示例中，有时你会在双斜杠 (`//`) 后面看到一些额外的文本：\n\n```\n»   console.log('Hello');   //  向控制台打印\
  \ Hello\n```\n\n我们稍后会详细说明，但这部分文本被称为**注释**，会被 JavaScript 忽略。它只是为了给阅读代码的人提供帮助。\n\n\
  本书其余的大部分内容涉及真正的代码，你将编写这些代码并将其保存在自己的文档中。然而，我们偶尔会再次需要控制台来试验一些想法。作为提醒，我们会在那时显示提示符。\n\
  \n在本章的其余部分，除非特别要求，你可以在每个示例后按下回车键。在某些情况下，我们会告诉你输出应该是什么样子，但大多数情况下，我们会留给你自己去尝试。\n\n\
  ## 上手 JavaScript\n\n尽管 JavaScript 旨在被编写为脚本，并在之后随网页一起运行，但控制台将让你有机会以更交互的方式使用 JavaScript。这意味着我们可以进行实验并尝试新的想法。\n\
  \n但是，在此之前，我们需要了解一些基本概念。\n\n\n\n### 基本概念\n\nJavaScript 以文本文件形式编写，由浏览器负责读取、解释并运行代码。将文本代码转换为可执行代码有若干种方式。\n\
  \n- **编译**是指解释代码并将其转换为二进制代码，该代码可直接在计算机上原生运行。编译后的代码一旦保存，即可随时执行。编译器还会借此机会检查错误，并寻找更高效的代码执行方式，这个过程称为优化。有时，这也被称为\
  \ AOT（预先）编译。\n- **解释**是指在运行代码时逐行解释代码。这种方式通常速度较慢，因为它需要在运行时解释所有内容，并且经常需要重新解释相同的代码。解释器没有机会进行大量优化。解释相比于编译的主要优势在于，我们可以轻松地即时编写和测试代码，因为每次修改后无需等待代码重新编译。\n\
  \n如今，JavaScript 采用了一种介于两者之间的方法，称为 JIT（即时）编译。代码在运行时由浏览器编译，通常是在代码执行到特定部分时分段进行。这种方式既保留了代码的文本形式，又能快速高效地运行。\n\
  \n所有编程语言都遵循一些核心原则。这些原则包括：\n\n- 编写 JavaScript 语句\n- 计算\n- 数据与变量\n- 函数\n- 控制结构，如测试和循环\n\
  - JavaScript 对象\n\n在本章中，我们将介绍前几个概念。随着后续章节中我们开始编写更多代码，将再继续学习其他概念。\n\n在开始之前，我们需要先厘清一些术语。JavaScript\
  \ 与大多数其他编程语言一样，对你输入的内容非常严格，因此为了避免歧义，我们需要了解一些字符的正确名称：\n\n| 字符 | 名称 | 部分用途 |\n| ---\
  \ | --- | --- |\n| `;` | 分号 | 语句结束 |\n| `( )` | 圆括号 | 算术运算 / 组合值 |\n| `{ }` | 花括号\
  \ | 代码块 / 定义对象（见后文） |\n| `[ ]` | 方括号 | 定义数组（见后文）/ 选取集合中的成员 |\n| `` ` ` `` | 反引号\
  \ | 在 JavaScript 中用于特殊字符串（见后文） |\n| `&#124;` | 竖线，也称“管道符” | 用于逻辑表达式 |\n| `&` | 与号\
  \ | 用于逻辑表达式 |\n\n你将在后续学习中了解这些字符的更多用法。此处仅为了确保我们知道它们如何称呼。\n\n#### 语句\n\nJavaScript\
  \ 由许多**语句**和语句块构成。语句有不同类型。\n\n最简单的 JavaScript 语句只是调用某个预定义的代码块：\n\n```\n»   console.log('Hello');\n\
  ```\n\n`console.log` 命令实际上是对一个预定义代码块（称为 `console.log()` **函数**）的调用。在此例中，`console.log()`\
  \ 函数向控制台输出一个值。在后续编写实际代码时，你可以使用这个函数来打印值以进行故障排查。\n\n函数是 JavaScript 开发的基础，我们将在整个课程中使用和创建函数。\n\
  \n#### 语句块\n\n有时需要将多条语句放在一个块中。通常是为了让一组语句能够一起被执行或跳过（可能是在某个测试之后）。有时，仅仅是为了将这些语句与其余代码隔离开来。\n\
  \n语句块被包裹在花括号内。例如：\n\n```\n»   {\nconsole.log('Hello');\nconsole.log('Goodbye');\n\
  }\n```\n\n要在控制台日志中获得多行输出，可能需要使用快捷键 `Shift + Enter`。\n\n在这个例子中，将语句分组并没有实际效果。但后续这将是一项重要技术。\n\
  \n你可能已经注意到，在代码示例中，块内的语句都有缩进。JavaScript 不关心代码是否缩进，但缩进能让我们更清晰地看到代码块的结构。本书中的所有代码都会进行明确的缩进，并且*强烈*建议你也这样做，以使你的代码更易于阅读和维护。\n\
  \n#### 表达式\n\n**表达式**是由若干项组合而成、最终得出一个单一值的结果。表达式的示例如下：\n\n```\n1 + 2\n12 / 3\n```\n\
  \n在控制台中，所有表达式一旦按下快捷键 `Enter`，都会自动求值并输出结果，因此你无需特意请求。例如：\n\n```\n»   3 + 5\n←   8\n\
  ```\n\n表达式本身并无实际用途。你通常会将其用作语句的一部分。例如：\n\n```\n»   a = 12/3;\n»   console.log(a +\
  \ 5);\n\n←   undefined\n```\n\n加法、除法等操作被称为**算术运算**，所使用的符号被称为**算术运算符**。\n\n还有其他操作，例如布尔运算、字符串运算以及对象运算。在学习了更多数据类型之后，我们将进一步了解这些运算。\n\
  \n#### 空格\n\n在表达式中通常不必包含空格。例如：\n\n```\n»   console.log(1+2+3);\n»   console.log(1\
  \ + 2 + 3); // 同样效果\n```\n\n然而，有时需要用空格来消除歧义，例如减号的情况：\n\n```\n»   console.log(1--2);\
  \      //  错误\n»   console.log(1 - -2);    //  1 减负 2\n```\n\n#### 分号\n\n在学术圈中，关于分号的使用有很多争论！本书中，我们推荐使用分号。\n\
  \n传统上，JavaScript 语句以分号（`;`）结尾：\n\n```\n»   a = 3;\n»   console.log(a + 4);\n```\n\
  \n如果能够推测出分号的位置，JavaScript 对缺失分号的情况是宽容的：\n\n```\n»   a = 3\n»   console.log(a + 4)\n\
  ```\n\n如果分号本该出现在行末，通常可以推测出来。这种推测机制被称为*自动分号插入*。\n\n如果分号预期出现在一行中间，则*无法*被推测出来：\n\n\
  ```\n»   a = 3 console.log(a + 4)    //  错误\n```\n\n在这种情况下，你只能使用分号将语句分隔开：\n\n```\n\
  »   a = 3; console.log(a + 4)   //  正常运行\n\n关键在于，如果语句的结束位置同时也是行的末尾（通常情况下都是这样），那么行末的分号通常是可选的。\n\
  \n然而，有些人认为，始终用分号标记语句结束是一种良好的做法。\n\n在本书中，所有代码的每条语句末尾都会包含分号。\n\n### 变量与赋值语句\n\n变量是所有编程语言的基石。变量是数据的容器。它们实际上是内存中某处用于存储数据的命名引用。\n\
  \n变量可以有简单的名称，例如 `x` 或 `a`，也可以有更长的名称，例如 `element`。\n\n要将值存入变量，需要使用**赋值语句**：\n\n```\n\
  [变量] = [表达式]\n```\n\n这将等号右侧的值放入左侧命名的变量中。例如：\n\n```\n»   a = 3;\n```\n\n这将值 3 放入名为\
  \ `a` 的变量中。\n\n尽管你可能将其读作“a 等于 3”，但更好的理解是“a 的新值是 3”，或者“a 被赋值为 3”，又或者“a 变成 3”。例如：\n\
  \n```\n»   a = 0;\n»   a = 3;\n```\n\n第一个赋值将 `0` 放入 `a`。第二个语句并不声明 `a` 是 `3`；只是说新值是\
  \ 3。\n\n\n\n### 赋值语句两侧的变量\n\nJavaScript 赋值语句的等号两侧可能包含同一个变量。在这种情况下：\n\n*   右侧的变量是表达式的一部分：将使用其当前（旧）值。\n\
  *   左侧的变量正在被赋予一个新值。\n\n以下语句进一步说明了这一点：\n\n```\n»   a = 3;\n»   a = a + 1;  //  a\
  \ 的新值等于旧值加 1\n»   console.log(a);\n```\n\n这条语句最好解读为“`a` 的新值是 `a` 的旧值加上 `1`”。虽然没人会这么说，但我们至少应该记住这就是它的含义。\n\
  \n### 递增与递减\n\n将变量增加或减少 1 是很常见的操作。JavaScript 使用递增或递减运算符来实现：\n\n```\n++a 或 a++：递增\n\
  --a 或 a--：递减\n```\n\n单独作为一条语句时，使用**前置递增**（`++a`）还是**后置递增**（`a++`）运算符并无区别；递减运算符也是如此。例如：\n\
  \n```\n»   a=3; a++; console.log(a);\n»   a=3; ++a; console.log(a);\n```\n\n会得到相同的结果。\n\
  \n然而，你也可以将这些运算符用在表达式中间。在这种情况下，前置运算符会在值被使用之前生效，而后置运算符会在值被使用之后生效。例如：\n\n```\n»   a=3;\
  \ console.log(++a); console.log(a);  //  前置递增\n\n»   a=3; console.log(a++); console.log(a);\
  \  //  后置递增\n```\n\n在第一种情况下，变量 `a` 会在*被显示之前*递增为 `4`。在第二种情况下，变量 `a` 会在被显示之后递增，因此\
  \ `console.log()` 会显示旧值 `3`。在这两种情况下，第二个 `console.log()` 都会显示新值 `4`。\n\n请注意，如果只是单独使用这条语句，通常会更倾向于使用后置递增运算符，但并无特殊理由。\n\
  \n### 链式赋值\n\n你可以将多个赋值操作链接到一条语句中。像下面这样的语句很常见：\n\n```\n»   a = b = c = 0;\n»   console.log(a);\n\
  »   console.log(b); // 等等\n```\n\n从*右侧*开始解读，这会将 `0` 赋给 `c`，然后赋给 `b`，最后赋给 `a`。\n\n\
  ### 赋值运算符\n\nJavaScript 也有组合算术**赋值运算符**。它们允许你对变量的旧值执行运算，并将结果作为新值赋给它。实际上，它们仅仅是独立运算符的简写形式。\n\
  \n例如：\n\n```\n»   value = 2;\n»   value = value + 3;\n```\n\n可以写成：\n\n```\n»   value\
  \ = 2;\n»   value += 3;\n```\n\n这看起来可能改进不大，但 JavaScript 程序员通常更喜欢第二种格式，我们在这里也会使用它：\n\
  \n```\n»   a = 5;\n»   a += 10;\n»   console.log(a);\n```\n\n赋值运算符包括以下内容：\n\n| 运算符\
  \ | 含义 |\n| --- | --- |\n| `+=` | 加上旧值 |\n| `-=` | 减去旧值 |\n| `*=` | 乘以旧值 |\n| `/=`\
  \ | 除以旧值 |\n| `%=` | 旧值取余…… |\n| `+=` | 拼接至旧值 |\n\n最后一种拼接操作是指连接字符串，这在 JavaScript\
  \ 程序员中非常常见。本章后面会介绍拼接操作。\n\n现在我们有三种方法让变量递增 1。它们分别是：\n\n```\n»   a = a + 1;\n»   a\
  \ += 1;\n»   a++;\n```\n\n按推荐程度递增排列。\n\n### 变量的命名\n\n纯粹出于懒惰，我们一直使用单字母变量 `a`。如前所述，变量名可以（更）长。JavaScript\
  \ 变量必须遵循一系列规则。主要规则如下：\n\n1.  变量名必须是单个词（不能有空格）。如果需要使用多个词，可以用**驼峰命名法**（将每个新词的首字母大写来连接它们）。\n\
  \n    例如：`familyName`\n\n2.  变量名必须以字母开头，但可以包含数字，只要不是以数字开头即可。大多数 JavaScript 程序员以首字母小写开头。\n\
  \n    例如：`big2small`\n\n3.  变量名不应包含特殊字符，但下划线（`_`）除外。你也可以使用一两个其他特殊字符，但这并不常见。\n\n\
  \    例如：`part_one`（然而，大多数 JavaScript 程序员会更倾向于使用 `partOne`。）\n\n命名 JavaScript 变量的另一个主要规则是，不应使用\
  \ JavaScript 语言中保留的名称。但这并不排除使用已有的函数或变量名，你有权替换它们（有时需自担风险）。\n\n### 大小写敏感性\n\nJavaScript\
  \ 变量以及 JavaScript 语言的其余部分都是**区分大小写**的。这意味着你不能用一种大小写形式定义它们，而用另一种形式使用。例如：\n\n```\n\
  »   thing = 'Hello';\n»   console.log(Thing); //  哎呀\n```\n\n`console.log()` 函数会尝试显示\
  \ `Thing` 变量的内容。然而，这个变量在前一条语句中并未定义，那条语句只是将值赋给了 `thing`（小写）变量。因此，如果你愿意，你可以有 32（`2`⁵）个拼写与\
  \ `thing` 相同但大小写不同的变量。如果不小心，这可能会引起混乱。\n\n### 声明变量\n\n使用和赋值变量是一回事，但 JavaScript 首先需要知道你要使用哪些变量，以便为它们准备存储空间。当你为变量做准备时，就是在**声明**变量。\n\
  \n在 JavaScript 中，有*四种*方式可以声明变量：\n\n*   传统上，你可以通过 `var` 语句声明它们。\n\n这里的控制台输出可能有点令人困惑。`var`\
  \ 语句的输出是 `undefined`。这并不意味着它没有生效，只是没有输出值。另一方面，*赋值*语句的输出是刚赋的值。这就是为什么你可以进行链式赋值。\n\n\
  现代 JavaScript 为 `var` 提供了两种替代方案：\n\n*   `let` 语句与 `var` 类似，但有一些重要区别，我们稍后会讨论。\n\n\
  \    ```\n    »   let a;\n    »   a = 3;\n    ```\n\n*   `const` 语句允许你声明一个常量。常量只能设置一次，因此更稳定。\n\
  \n    ```\n    »   const a = 3;\n    »   a = 4;  //  错误\n    ```\n\n注意，`const` 语句在声明的同时就赋值了。你必须这样做，因为\
  \ `const` 之后无法再赋值。\n\n你也可以对 `var` 和 `let` 这样做：\n\n```\n»   var a = 3;\n»   let a\
  \ = 3;\n```\n\n第四种方法是一种遗留方法：\n\n*   当你给一个新变量赋值时，该变量可能会自动声明。例如：\n\n    ```\n    »\
  \   b = 3;    // 创建一个新变量\n    ```\n\n这最后一种方法正是我们目前一直在使用的，但现在必须停止了。我们稍后会解释原因。\n\n\
  你可以用一条语句声明多个变量。例如：\n\n```\n»   var a = 3, b = 4;\n```\n\n从 JavaScript 的角度来看，使用单条语句还是多条语句没有区别。然而，如果你试图在视觉上对新变量进行分组，使用单条语句可能会更方便。\n\
  \n特别是在 Firefox 控制台中，你无法重新声明使用 `let` 或 `const` 定义的任何变量，这可能会影响你的操作。如果需要重新声明它们，你应该重新加载页面并重新开始。\n\
  \n请记住，在实际的 JavaScript 中，你同样无法重新声明 `let` 或 `const` 变量。\n\n\n\n## 变量声明类型的区别\n\n现代\
  \ JavaScript 更倾向于使用 `let` 和 `const` 而非 `var`。\n\n*   `let` 声明更适用于普通变量，因为它的行为更符合你的预期。\n\
  \n    `var` 的问题在于，你可以多次声明同一个变量，并且可以在*首次*赋值*之后*才声明它。`let` 语句不允许你做这些操作。\n\n    除此之外，`let`\
  \ 变量的作用域被限制在其所在的代码块内。我们稍后会详细讨论作用域，但它主要关乎变量在多大范围内仍然有效。\n\n*   如果你希望确保变量的值不会（意外地）改变，`const`\
  \ 声明是更好的选择。事实上，它们根本不是变量，而是被称为**常量**，原因显而易见。\n\n    较旧的 JavaScript 没有这样的功能，所以你只能使用变量并小心操作。\n\
  \n当我们更认真地编写 JavaScript 时，我们会根据需要选择使用 `let` 或 `const`。\n\n## 控制台中的变量\n\n在本章中，所有操作都在控制台中进行，我们会稍微改变一下做法。\n\
  \n首先，作为对变量的温和介绍，我们之前没有事先声明它们。从现在开始，我们会进行声明。在下一节“严格模式”中，我们将了解如何禁止未声明就赋值变量，以及为什么要这样做。\n\
  \n其次，`let` 语句不能对一个变量使用两次。在某些示例中，我们会从头开始，并像第一次使用那样重新声明变量。因此，我们会使用 `var` 语句，这允许我们这样做。在后续的项目中，我们会优先使用\
  \ `let` 语句。\n\n在编写函数时，使用声明语句至关重要，因为可以声明同名但不同数据的变量。然而，*始终*以这种方式声明变量是一个好习惯，这也是我们将在整个过程中遵循的做法。\n\
  \n## 严格模式\n\n现代版本的 JavaScript 支持一个可选的**严格模式**，它有助于减少代码中的错误。最重要的变化是，它将禁止在未事先声明的情况下创建新变量。\n\
  \n这为什么有用呢？JavaScript 对声明变量的宽松态度可能会让你陷入麻烦。例如：\n\n```\n»   value = 5;\n»   Value =\
  \ value + 2;\n»   console.log(value);\n```\n\n在这个例子中，第二个变量与第一个不同，因为它以大写字母开头。然而，它会被自动创建。这种简单的输入错误可能导致一些难以追踪的错误。\n\
  \n要启用严格模式，脚本必须将以下字符串作为第一条语句：\n\n```\n'use strict';\n```\n\n这条语句可以出现在空白行或注释行之后，但如果放在其他\
  \ JavaScript 语句之后，则不会生效。\n\n> JavaScript 控制台可能会忽略 `use strict` 语句，因此我们在此处不会使用它。稍后，在编写真实代码时，我们肯定会使用它。\n\
  \n### 注释\n\nJavaScript 允许你在文本中插入注释。注释是不会被 JavaScript 解释器解释的文本。\n\n注释用于以下目的：\n\n\
  *   添加可能对开发者（或任何阅读代码的人）有用的信息\n\n*   在不实际删除代码行的情况下禁用它们\n\n第二个原因在开发过程中非常有用，当你想要临时禁用代码时。\n\
  \nJavaScript 支持两种类型的注释：\n\n*   `// 单行注释`\n\n    `//` 表示该行的剩余部分将被视为注释。你可以将其用于整行，或一行的最后部分。\n\
  \n*   `/* 块注释 */`\n\n    这允许你将多行标记为注释块。或者，你也可以将一行中的一部分标记为注释。\n\n例如：\n\n```\n/* \
  \ 以下代码执行某些操作。\n它是由我编写的。祝你愉快 ... */\nconsole.log('你好');   //  打印出一条消息\n//  以下代码执行更多操作：\n\
  console.log('再见');\n//  以下行已被禁用：\n//  console.log('你好');\n```\n\n请注意，JavaScript\
  \ 字符串*内部*的注释只会被当作文本的一部分处理：\n\n```\n»   console.log('这不是/*不是*/注释！');\n```\n\n注释可以用于任何目的。之前你看到了三种非常常见的用途：\n\
  \n*   注释可以用来解释某些内容。\n\n*   你可以通过注释（临时）禁用一行代码。这被称为**注释掉代码**。\n\n*   注释块通常用作标题或引出代码。\n\
  \n在 JavaScript 文件的开头包含一个注释块来解释文件内容也是一个好主意。\n\n### 嵌套注释\n\n你不能嵌套块注释；也就是说，不能将一个块注释放在另一个块注释内部。这是因为第二个块注释的开始标记会被忽略，而第一个块注释的结束标记会终止整个注释。\n\
  \n例如：\n\n```\n/*  这不能正常工作：\n/*  这不是真正的嵌套块 */\n这一行将不会被忽略！ */\n```\n\n但是，在块注释或其他单行注释内部包含单行注释是完全可以的。\n\
  \n## 数据类型\n\n部分出于历史原因，部分出于效率原因，还有其他一些原因，编程语言通常会对数据类型进行区分。在 JavaScript 中，有三种基本类型：\n\
  \n*   数字。\n\n*   字符串，即字符序列。包括文本。\n\n*   布尔值，它是两个值之一：`true` 和 `false`，用于逻辑计算。\n\n\
  JavaScript 将这些称为**基本**类型，不是因为它们已存在很长时间，而是因为它们是最基础的。这些数据类型有时也被称为标量。关键在于它们代表单一值。\n\
  \n除此之外，还有一些特殊的数据值，我们稍后会介绍。\n\n其余的类型，也就是你在 JavaScript 中会大量接触到的，是**对象**形式。对象是一个包。同样，我们稍后会详细介绍。\n\
  \n现在，我们先看看基本类型。\n\n### 数字\n\n**数字**是 JavaScript 中的基本数据类型之一。许多语言区分不同类型的数字，例如整数和浮点数（小数），但\
  \ JavaScript 忽略了这种区别，将所有数字统一对待。\n\n这确实导致了一个著名的怪异现象：\n\n```\n»   console.log(0.1\
  \ + 0.2);\n0.30000000000000004\n```\n\n这是由于内部的舍入误差造成的。这种舍入误差在所有计算机语言中都会出现，但大多数其他语言会尽力隐藏这个误差，或提供处理小数的替代方法。\n\
  \n#### 编写数字\n\n数字可以带小数或不带小数书写：\n\n```\n»   3\n»   3.0\n»   25.4\n```\n\n它们也可以用一种科学计数法形式书写：\n\
  \n```\n»   1.2345e2    //  =1.2345 × 102\n←   123.45\n```\n\n如果你愿意，也可以使用其他进制下的整数：\n\
  \n*   二进制数（基数为 2）以 `0b` 开头书写，例如 `0b101010`。\n\n*   八进制数（基数为 8）以 `0o`（数字零后跟字母 `o`）开头书写，例如\
  \ `0o52`。历史上，它们只以零开头书写（`052`），但这种方式不推荐，因为它存在歧义。\n\n*   十六进制数（基数为 16）以 `0x` 开头书写，例如\
  \ `0x2a`。\n\n以下是表示同一个数字的不同方式：\n\n```\n»   console.log(42, 0x2a, 0o52, 0b101010);\n\
  42 42 42 42\n```\n\n即使你以其他进制输入了一个数字，JavaScript 通常也会将其恢复为标准十进制形式。\n\n\n\n##### 算术运算\n\
  \nJavaScript 会按照标准规则执行算术运算。通常涉及数值和运算符。主要的算术运算符如下：\n\n| 符号 | 运算 |\n| --- | --- |\n\
  | `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 (×) |\n| `/` | 除法 (÷) |\n| `%` | 取余 |\n\n\
  JavaScript 遵循标准的算术运算规则。你在学校应该学过这些规则，但为了避免有人已经遗忘，我们还是再复习一遍。\n\n##### 结合性\n\n考虑以下表达式：\n\
  \n```\n»   12 - 3 + 4\n```\n\n如果你倾向于先执行第二个运算，得出 `12 - 7` 即 `5`，那你就错了。JavaScript\
  \ 会从左到右计算这个表达式，得出 `9 + 4` 即 `13`。\n\n不过，结合性规则只在运算符优先级相同时适用。\n\n##### 优先级\n\n考虑以下表达式：\n\
  \n```\n»   1 + 2 * 3\n```\n\n这个表达式的结果是 7，因为 JavaScript 遵循先乘后加的惯例。如果你希望先做加法，就需要用括号将表达式的那部分括起来：`(1\
  \ + 2) * 3`。这样结果就会是 9。\n\n通常情况下，JavaScript 遵循以下优先级顺序：\n\n1. `(...)`\n2. `*` 或 `/`\n\
  3. `+` 或 `-`\n\n如果有多个同级优先级的运算，则从左到右依次执行。很多人对这条规则的理解并不全面。不要被下面的例子迷惑：\n\n```\n»  \
  \ 12 / 2 * 3\n```\n\n在这个例子中，两个运算（`/` 和 `*`）处于同一优先级，所以你会先做除法再做乘法，结果是 18，而不是 2（如果错误地先做乘法就会得到\
  \ 2）。\n\n##### 取余 (%)\n\n有时，当你对两个整数进行除法运算时，你并不想要完整的商。有时你想要的是余数。这个运算符写作百分号 (`%`)。例如：\n\
  \n```\n»   100 % 7;\n```\n\n会得到 `100` 除以 `7` 后的余数（`2`）。\n\n现在，这看起来可能是一种相当奇怪的运算需求，但在处理涉及循环模式的数据时，它非常有用。\n\
  \n例如，在 100 天后，星期几会比今天提前 2 天，因为其中包含多少个完整的星期（除以 7）并不重要，重要的是在完整星期之后还剩多少天。\n\n循环值非常常见。例如，从现在起\
  \ 100 小时后是几点？\n\n```\n»   h = 14  // 24 小时制下午 2 点\n»   h = (h + 100) % 24;\n»  \
  \ console.log(h);\n```\n\n因为除法后的余数总是介于 0 到比除数小 1 之间的数字，所以你可能需要将数值从零开始计数。例如，虽然月份通常从\
  \ 1 到 12 编号，但在进行取模运算时，你应该将其从 0 到 11 编号。之后可以在结果上加 1。\n\n注意，我们把表达式 `h + 100` 放在了括号里。这是因为取余运算与乘除法优先级相同，高于加法。\n\
  \n你常常会看到这个运算符被称为**取模运算符**。严格来说这并不准确，因为涉及到负数时，取模（modulus）和取余（remainder）之间存在着细微的差别。我们这里坚持使用更准确的“取余”。\n\
  \n### 字符串\n\n字符串是文本和其他字符的容器。也就是说，它们是字符序列。JavaScript 提供了一些简单的字符串操作，以及丰富的函数集合，用于处理字符串。还有一些函数用于处理字符串和数字之间的转换。\n\
  \n字符串对读者来说可能有意义，也可能没有：\n\n```\n'qwerty'\n'Hello'\n'23'\n```\n\n注意最后一个表达式。它*看起来*像数字，但实际上不是：它以不同的方式存储，在需要时也会被区别对待。不过，如果情况需要，JavaScript\
  \ 也可能会将其转换为数字。\n\n##### 字符串字面量\n\n**字符串字面量** 是代码中定义字符串的部分。这个区别可能很微妙，但很重要。\n\n假设有以下代码：\n\
  \n```\n»   message = 'Hello';\n```\n\n字符串字面量 `'Hello'` 定义了存储在变量 `message` 中的字符串\
  \ `Hello`。字符串本身不包含用于定义它的引号。然而，之所以写出引号，是为了让 JavaScript 不会将字符串字面量与其他代码混淆。\n\nJavaScript\
  \ 允许你在字符串字面量中使用单引号或双引号，只要保持开头和结尾一致即可：\n\n```\n'Hello'\n\"Hello\"\n```\n\n有时，选择哪种引号会受字符串内容的影响：\n\
  \n```\n»   console.log('');\n```\n\n这里，使用单引号是为了在字符串中允许包含双引号。\n\n有些用户使用双引号是为了允许在字符串中使用单引号作为撇号：\n\
  \n```\n»   console.log(\"Don't Worry\");\n```\n\n如果可能的话，最好使用规范的印刷体撇号，这样就不会与代码引号冲突：\n\
  \n```\n»   console.log(\"Don't Worry\");\n»   console.log('Don't Worry');\n```\n\
  \n你可以使用快捷键输入印刷体撇号：在 Macintosh 上使用 ![](img/609513_1_En_1_Figf_HTML.gif) 快捷键，shift\
  \ + option + 右方括号；在 Windows 上使用 ![](img/609513_1_En_1_Figg_HTML.gif) 快捷键，alt + 0146。\n\
  \n本书偏好使用单引号，因为这样可以简化与 HTML 的交互，而 HTML 的属性偏向使用双引号。\n\n需要注意的是，JavaScript *不会* 使用任何形式的印刷体单引号或双引号来定义字符串：\n\
  \n```\n»   var a = \"hello\";    --  绝对不行\n```\n\n这使得在字符串内部使用印刷体引号完全安全。\n\nJavaScript\
  \ 控制台似乎偏好双引号。每当它需要向你展示一个字符串时，它会用双引号将字符串括起来。例如：\n\n```\n»   'hello'\n←   \"hello\"\
  \n```\n\n尽管如此，我们仍会使用单引号。\n\n##### 空字符串\n\n空字符串是一个长度为零、不含任何字符的字符串：\n\n```\n»   var\
  \ a = '';\n»   var a = \"\";\n```\n\n空字符串可用于初始化一个稍后会添加内容的变量。\n\n请注意，空字符串字面量在视觉上可能造成混淆，尤其是在非等宽字体的情况下。\n\
  \n##### Unicode\n\nJavaScript 字符串内部采用 Unicode 编码，具体来说是 UTF-16。\n\n从实际角度来看，这意味着 JavaScript\
  \ 字符串可以包含世界上任何语言的任何字符。这也意味着一个字符通常占用 2 字节，不过有些字符会占用更多。但这都不会影响我们正常使用字符串。\n\n#####\
  \ 字符串不可变\n\n虽然你可以更改字符串变量的值，但你不能更改字符串本身。对字符串的任何更改都需要创建一个新字符串并丢弃旧字符串。例如：\n\n```\n\
  »   var a = 'Wilma';\n»   a = 'Betty';\n```\n\n这需要为变量 `a` 创建一个新字符串，并丢弃旧字符串。这个过程是自动发生的，所以我们通常无需担心。但这确实意味着字符串操作在后台做了大量工作，因此被认为是开销较大的操作。\n\
  \n\n\n### 转义字符\n\n有时，字符串字面量需要包含一些不便直接输入的字符，例如引号或特殊字符。为了允许输入这些特殊字符，反斜杠字符（`\\`）被用作所谓的转义字符。例如：\n\
  \n```\n»   console.log('He said \"Don\\'t Worry\"');\n```\n\n这里，转义序列 `\\'` 用于嵌入一个单引号，否则该单引号会过早地终止字符串。（当然，使用印刷体撇号也能完全避免这个问题。）\n\
  \n请注意，反斜杠实际上并不是字符串的一部分。它仅仅用于修改下一个字符。如果你真的想要一个反斜杠，也需要对它进行转义：\n\n```\n»   console.log('This\
  \ is a backslash: \\\\');\n```\n\n转义字符也可用于插入一些特殊字符，例如制表符（`\\t`）或换行符（`\\n`）：\n\n\
  ```\n»   console.log('Fruit:\\tApple\\nColour:\\tRed');\n←   Fruit:  Apple\nColour:\
  \ Red\n```\n\n### 模板字面量\n\nJavaScript *字符串* 可以包含任何字符，但 *字符串字面量* 存在限制。特别是，你不能包含换行符。例如，以下代码会报错：\n\
  \n```\n»   var message = 'Hello there.\nEnjoy today';   //  错误\n```\n\n通常，你可以通过包含转义换行符（`\\\
  n`）来解决这个问题：\n\n```\n»   var message = 'Hello there.\\nEnjoy today';\n```\n\n或者，通过一种不太美观的转义字符用法，它允许在不终止语句的情况下换行：\n\
  \n```\n»   message = 'Hello there.\\\n»   Enjoy today';\n```\n\n现代版本的 JavaScript\
  \ 支持**模板字面量**，它比传统的字符串字面量更灵活。\n\n其特点之一是模板字面量允许嵌入换行符：\n\n```\n»   message = `Hello\
  \ there.Enjoy today`;\n```\n\n请注意，模板字面量使用反引号字符（`` ` ``）来引用字符串。\n\n模板字面量的第二个特点是你可以包含表达式：\n\
  \n```\n»   var price = 3;\n»   var quantity = 4;\n»   console.log(`Total: ${price*quantity}`);\n\
  ```\n\n任何在特殊代码 `${ }` 内的表达式都会被求值，就好像它写在字符串外面一样。\n\n### 字符串拼接\n\n在 JavaScript 中，对字符串只有一种直接操作：拼接。此操作会将字符串连接起来。\n\
  \nJavaScript 使用加号（`+`）进行拼接，这可能是错误的潜在来源，我们稍后会看到。\n\n拼接的示例如下：\n\n```\n»   var a =\
  \ 'Hello';\n»   console.log(a + 'Fred');\n```\n\n请注意，拼接不会添加任何额外的空格。如果你需要空格，必须自己添加：\n\
  \n```\n»   a = 'Fred'; b = 'Nurkk';\n»   console.log(a + ' ' + b);\n```\n\n拼接使用与加法相同的符号，这可能导致两种操作结合时产生一些奇怪的结果。例如：\n\
  \n```\n»   console.log('abc' + 1 + 2); //  abc12\n»   console.log(1 + 2 + 'abc');\
  \ //  3abc\n```\n\n这是因为 JavaScript 从左到右读取表达式，并根据情况解释加号。\n\n如果你确实想先进行数字相加，则需要用括号将它们分组：\n\
  \n```\n»   console.log('abc' + (1 + 2));\n```\n\n稍后，我们需要从表单或对话框获取一些数字。由于所有数据都会被当作文本处理，如果我们试图对它们进行加法运算，就可能遇到这个问题。\n\
  \n### 字符串属性和方法\n\nJavaScript 字符串具有许多包含字符串信息的属性。你可以使用点（`.`）表示法访问属性。例如：\n\n```\n»\
  \   var a = 'abcdefghijklmnop';\n»   console.log(a.length);\n```\n\n`length` 属性是字符串中的字符数。有时它并不准确：`length`\
  \ 属性假设每个 Unicode 字符占用 2 个字节，但这并不总是正确的。\n\n你也可以对字符串字面量执行此操作：\n\n```\n»   console.log('abcdefghijklmnop'.length);\n\
  ```\n\n字符串还内置了用于处理字符串的函数，称为方法；更具体地说，它们返回由旧值生成的新值。例如：\n\n```\n»   var a = 'Hello';\n\
  »   console.log(a.toUpperCase());\n←   HELLO\n»   console.log(a.toLowerCase());\n\
  ←   hello\n```\n\n这些方法不会改变原始字符串；它们返回一个新字符串。\n\n## 布尔值\n\n布尔值要么是 `true`，要么是 `false`。（布尔值是以数学家乔治·布尔的名字命名的，他是数理逻辑的先驱。）\n\
  \n你可以直接赋予布尔值：\n\n```\n»   var ok = false;\n```\n\n通常，它会是比较的结果：\n\n```\n»   var a\
  \ = 3, b = 4;\n»   var ok = a > b;\n»   console.log(ok);\n```\n\n你经常在以下几种方式中使用布尔值：\n\
  \n```\n»   var a = 3, b = 4;\n»   var ok = a > b;\n»   if (ok) console.log('bigger');\n\
  ```\n\n当你需要测试一个值来决定下一步做什么时，通常会用到布尔值。`if` 语句和 `while` 语句就是两个这样的例子。你之前看到了一个简单的 `if`\
  \ 语句示例。\n\n`while` 语句是**迭代**的一个例子：重复执行某个过程若干次。`while` 语句的一个简单示例如下：\n\n```\n»   var\
  \ n = 0, finish = 10;\n»   while(n<finish) {\nn++;                    //  递增 n\n\
  console.log(n);\n}\n```\n\n这里，变量 `n` 被初始化为 `0`。然后，在测试条件 `n<finish` 成立时，它被递增并打印出来。你会看到数字\
  \ `1` 到 `10` 被打印出来，每行一个。\n\n我们稍后会用到 `while` 语句。\n\n### 使用布尔值\n\n通常，我们在没有意识到的情况下使用布尔值。例如：\n\
  \n```\n»   var a = 3, b = 5;\n»   if(a>b) console.log('a is bigger');\n```\n\n事实上，`if`\
  \ 语句括号内的表达式，其值必须是布尔值，或者至少可以被解释为布尔值。将结果放入一个布尔变量中同样正确：\n\n```\na = 3; b = 5;\nok =\
  \ a>b;\nif(ok) alert ('a is bigger');\n```\n\n为什么要这样做？如果你稍后需要再次使用相同的测试，这会很有用：\n\n\
  ```\na = 3; b = 5;\nok = a>b;\nif(ok) alert ('a is bigger');\n...\nif(ok) ...;\n\
  ```\n\n我们稍后会进一步研究 `if` 结构。\n\n## 更改数据类型\n\n大体上，JavaScript 会自动执行任何必要的数据类型转换，但前提是它能够转换。例如：\n\
  \n```\n»   var a = '3';\n»   console.log(2 * a);\n←   6\n```\n\n由于你只能对数字进行乘法运算，JavaScript\
  \ 会将字符串 `'3'` 转换为数字。\n\n但这并不总是可行的。如果字符串不能被解释为数字，则无法转换。例如：\n\n```\n»   var a = 'hello';\n\
  »   console.log(2 * a);\nNaN\n```\n\n请注意，严格来说结果*不是*一个错误。它是一个特殊值。我们稍后会再次讨论 `NaN`。\n\
  \n有时，即使可以转换，JavaScript 也不会进行转换。例如：\n\n```\n»   var a = '3';\n»   console.log(2 +\
  \ a);\n←   23\n```\n\n这将给你一个不同的结果。从某种意义上说，JavaScript 可以“相加”字符串，这实际上是在执行拼接。因此，是 `2`\
  \ 被转换为字符串以进行拼接。\n\n如果你想强制转换，可以手动将字符串转换为数字：\n\n```\n»   var a = '3';\n»   console.log(2\
  \ + parseInt(a));\n```\n\n这将强制将 `a` 转换为整数，然后执行加法。\n\n\n\n### `parseInt()` 与 `parseFloat()`\n\
  \n有两个函数用于将字符串转换为数字：`parseInt()` 和 `parseFloat()`。\n\n`parseInt(string)` 函数将字符串转换为整数。该函数具有容错性：它会尽可能地进行转换；如果字符串中还包含无法转换的字符，它会在那里停止。例如：\n\
  \n```\n»   var a = parseInt('123abc456');\n»   console.log(a);\n←   123\n```\n\n\
  结果将是 `123`，忽略其余部分。\n\n如果字符串完全无法转换，你又会得到一个特殊值 `NaN`（非数字）：\n\n```\n»   a = parseInt('ha\
  \ ha');\n»   console.log(a);\n←   NaN\n```\n\n通常，`parseInt()` 会将文本解释为十进制的数字，但这并不总是可靠的。如果你希望将字符串解释为其他进制的数字，可以为其提供可选的进制参数。例如：\n\
  \n```\n»   a = parseInt('10110110', 2);\n»   console.log(a);\n←   182\n```\n\n这将把\
  \ `10110110` 解释为二进制（基数为 2）数字，并返回 `182`。\n\n然而，即使你想要十进制，最可靠的方法是指定进制：\n\n```\n»  \
  \ a = parseInt('0123', 10);\n```\n\n`parseFloat()` 函数也会将字符串转换为数字，但允许小数部分。不过，你不能将其用于其他进制。\n\
  \n如果可以并且必要时，JavaScript 会自动将字符串转换为数字。但是，自动转换的容错性不如 `parseFloat()` 或 `parseInt()`。\n\
  \n### `isNaN()`\n\n如果你需要测试是否可以将某个值转换为数字，可以使用 `isNaN()` 函数，是的，函数名中有两个大写字母 N。该函数实际上测试的是转换的*失败*。例如：\n\
  \n```\n»   var b = '456a';\n»   var a = b*1;\n»   if (isNaN(a)) console.log('oops');\n\
  ```\n\n表达式 `if(...) ...` 被称为条件表达式。它测试某事是否为真，如果为真，则继续执行语句的下一部分。我们将在第 2 章（当我们在一个简单的游戏项目中使用它时）看到更多关于这种结构的内容。\n\
  \n测试是否为数字是一个常见需求，可以使用非（`!`）运算符反转结果：\n\n```\n»   if (!isNaN(a)) console.log('ok');\n\
  ```\n\n`NaN` 的一个令人惊讶的特性是它本身不被认为等于自身。这提供了另一种测试方式：\n\n```\n»   if (a==a) console.log('ok');\n\
  ```\n\n`==` 运算符测试两个值是否相同。这个特性很巧妙，但可能会让其他程序员感到困惑。\n\n## 变量与数据类型\n\n与其他一些编程语言不同，JavaScript\
  \ 变量不限于单一数据类型。在其他一些语言中，你不仅要声明名称，还要声明数据类型，例如整数或字符串。\n\nJavaScript *确实*区分不同的数据类型。然而，数据类型由当前值决定，而不是任何预设的概念。\n\
  \n例如：\n\n```\n»   var a;\n»   a = 3;\n»   console.log(typeof(a));\n\"number\"\n\
  ```\n\n`typeof()` 函数返回当前值的数据类型。\n\n如果你随后将值更改为不同的类型，`typeof()` 函数将返回新的类型：\n\n```\n\
  »   a = 'hello';\n»   console.log(typeof(a));\n\"string\"\n```\n\n在专业领域，我们说 JavaScript\
  \ 是**动态类型**的。数据类型将取决于当前的值。\n\n### 函数\n\n函数是任何编程语言的另一主要支柱，在整个课程中，我们将使用和编写函数。\n\n\
  我们稍后将更深入地研究函数。不过，现在我们将建立对它们是什么以及如何使用它们的基本概念。\n\n函数是一段可以重复使用的代码块。传统上，你可以像这样定义一个函数：\n\
  \n```\n»   function twice(number) {\nvar value = number * 2;\nreturn value\n}\n\
  ←   undefined\n```\n\n如果你发现控制台不允许你输入剩余的代码，你可能需要按下快捷键 shift + enter 来获取额外的行。\n\n\
  就像 `var` 语句（以及 `let` 和 `const`）一样，`function` 声明的输出是 `undefined`。这并不意味着函数未定义 —— 只是说明该定义没有输出值。\n\
  \n这个示例函数当然很简单，但你可以通过以下方式测试它：\n\n*   变量 `number` 被称为**参数**变量。它被赋值为你调用函数时给出的值。\n*\
  \   `twice(a)` 中的值 `a` 被称为**实参**。它是发送给函数的值。\n*   函数末尾的 `return` 语句起到 1.5 个作用。首先，它提供了函数的结果。同时，它也结束了函数代码，在这种场景下并非必要，因为我们已经执行到了末尾；如果你需要在函数块结束前提前结束，第二个作用就更有用了。\n\
  \n```\n»   var a = 3;\n»   var b = twice(a);\n»   console.log(b);\n```\n\n在定义或调用函数时，函数名总是带有一对括号，即使没有参数：\n\
  \n```\n»   function thing() {\n//  ...\n}\n```\n\n代码也总是包裹在花括号中，即使只有一行代码。\n\n## 空函数\n\
  \n首先，JavaScript 没有空函数，因此这可能会有点误导。其他一些语言确实有空函数，有时被称为过程。\n\n如果 JavaScript 确实有空函数，它们将是不返回结果的函数。它们仍然可以做些有用的事情，例如显示一条消息，但它们不会计算任何输出结果。\n\
  \n在 JavaScript 中，*所有*函数都会返回一个结果。然而，除非你另有指定，否则结果是特殊的神奇值 `undefined`。\n\n每当你看到没有值的\
  \ `return`，它始终意味着 `return undefined;`。每当你有一个没有 `return` 语句的函数，其末尾都有一个隐式的 `return\
  \ undefined`。\n\n你已经见过的一个这样做的函数是 `console.log()` 函数。每当你调用它时，控制台会显示输出，即 `undefined`。\n\
  \n\n\n## JavaScript 对话框\n\nJavaScript 提供了三个函数，用于通过对话框与用户进行交互。\n\n`alert()` 函数会显示一条消息，并附带一个“确定”按钮用于关闭。使用方法如下：\n\
  \n```\n»   alert('这是一条消息');\nundefined\n```\n\n根据浏览器的不同，显示效果大致如图 1-2 所示。\n\n![](img/609513_1_En_1_Fig2_HTML.jpg)\n\
  \nJavaScript 警报对话框的截图。\n\n图 1-2\n\nJavaScript 警报\n\n`alert()` 的返回结果是 `undefined`。这是一种所谓的\
  \ void 函数，但其实并非真正的 void 函数。\n\n`confirm()` 函数同样会显示一条消息，但会为用户提供“取消”或“确定”两个按钮以供选择。通常情况下，你会将函数的结果赋值给一个变量，如下所示：\n\
  \n```\n»   var response = confirm('你即将做一件傻事……');\n»   console.log(response);\n```\n\
  \n同样，根据浏览器的不同，显示效果大致如图 1-3 所示。\n\n![](img/609513_1_En_1_Fig3_HTML.jpg)\n\nJavaScript\
  \ 确认对话框的截图。\n\n图 1-3\n\nJavaScript 确认\n\n该函数的返回结果是一个布尔值，即 `true` 或 `false`，具体取决于你选择了“确定”还是“取消”。\n\
  \n请注意，无论是 `alert()` 还是 `confirm()` 函数，你都必须先对对话框作出响应，才能在控制台中看到结果。这是这些对话框函数的一个特性：它们会暂停所有操作，直到用户处理完毕。我们会发现，这既有利也有弊。\n\
  \n`prompt()` 函数同样会显示一条消息，但允许用户在文本框中输入回复。同样，你需要将回复捕获到一个变量中：\n\n```\n»   var response\
  \ = prompt('你叫什么名字？');\n»   console.log(response);\n```\n\n显示效果大致如图 1-4 所示。\n\n\
  ![](img/609513_1_En_1_Fig4_HTML.jpg)\n\n一个 JavaScript 提示对话框的截图。上面显示着如下文本：“你叫什么名字？”\n\
  \n图 1-4\n\nJavaScript 提示\n\n如果你点击“确定”，那么结果将是你输入到文本框中的任何文本。如果没有输入文本，结果将是一个空字符串。另一方面，如果你点击“取消”，结果将是\
  \ `null`，这是一个表示“无”的特殊值。\n\n如你所见，这些函数会暂停一切操作，直到用户作出响应。这对于测试和故障排查来说没问题，但在实际场景中会非常具有破坏性，因此应限制其使用。此外，你还会发现，由于其设计原因，你将无法更改它们的外观或按钮文本。\n\
  \n现代浏览器现在支持 `<dialog>` 元素，它允许你创建更复杂的对话框。不过，其设置和处理的步骤更多，因此我们暂时还是坚持使用传统的对话框。\n\n##\
  \ 数组与对象\n\n你可能已经猜到，JavaScript 也能识别非简单类型的数据。这些被称为对象，本质上是用于存储更多数据和函数的更复杂的容器。\n\n其中一种特定类型的对象是数组。数组是一个带编号的集合。在\
  \ JavaScript 中，创建数组非常简单：\n\n```\n»   var fruit = ['苹果','香蕉','樱桃','枣'];\n```\n\n\
  数组项从零开始编号。在前面的示例中，这些项从 `0` 编号到 `3`。你可以使用 `.length` 属性获取数组中的项数：\n\n```\n»   console.log(fruit.length);\n\
  ```\n\n要获取数组中的某一项，需要使用方括号并指定项编号：\n\n```\n»   console.log(fruit[2]);\n樱桃\n```\n\n\
  (请记住，项编号从 0 开始。) 项编号通常被称为索引。\n\n你也可以使用赋值语句来修改某一项：\n\n```\n»   fruit[2] = '哈密瓜';\n\
  ```\n\n你还可以添加新项或删除项。稍后，我们会更多地使用数组。\n\n正如我们所说，数组是专门化的对象。一般来说，对象是数据和函数的集合。然而，在 JavaScript\
  \ 中，你会发现函数也被当作数据处理，所以你可以简单地说，JavaScript 对象是数据的集合。\n\n这些数据可以是：\n\n* 原始值，例如数字和字符串\n\
  * 函数\n* 其他对象\n\n在 JavaScript 中，一些非常重要的对象将与网页内容相关。\n\n我们稍后会进一步探讨对象。\n\n## 未定义还是未声明？\n\
  \n尽管 JavaScript 可能会主动或被动地自动声明变量，但你不能使用一个没有值的变量。\n\n这里有三种可能性：\n\n1. 变量是**已定义**的。\n\
  \n   这意味着该变量有值。这通常是赋值语句的结果，尽管其他一些 JavaScript 语句也会给变量赋值。\n\n   例如：\n\n   ```\n  \
  \ var x = 3;\n   console.log(x);\n   ```\n\n2. 变量是**未定义**的。\n\n   这种情况可能发生在变量已被声明但尚未赋值时。这样的声明可以通过\
  \ `var` 语句实现：\n\n   ```\n   var x;\n   console.log(x);\n   ```\n\n   这将输出 `undefined`\
  \ 的结果。\n\n3. 变量是**未声明**的。\n\n   请不要与 `undefined`（未定义）混淆，后者描述的是一个存在但没有值的变量。如果你尝试使用一个甚至尚未声明的变量，则会导致错误。例如：\n\
  \n   `console.log(y);`\n\n   将会导致一个错误。\n\n如果你觉得这些术语有些令人困惑，那么，你的感觉很可能是对的。\n\n###\
  \ 未定义并非错误\n\n与其他编程语言不同，`undefined` 是一个特殊的值，而不是一个错误。你甚至可以故意将其赋值给一个变量：\n\n```\n» \
  \  var a = undefined;\n```\n\n当然，如果后续你计划使用这个变量并期望它拥有一个真正的值，那么你*可能*最终会遇到错误。\n\n###\
  \ 特殊值：null\n\n即使一个值已被定义，它也可能指向“无”。这可能是因为还没有（暂时）一个有效的值。在 JavaScript 中，这个特殊值被称为 `null`。\n\
  \n`undefined` 和 `null` 之间的区别是 JavaScript 开发者困惑的一个来源，甚至一些专家对此也有些含糊其辞。有一点是明确的，即使它们都表示某种“无”，但它们并非*完全*相同。\n\
  \n不过，普遍认为 `undefined` 是指一个值*默认*为无，而 `null` 是指一个值被*特意*设置为无。然而，这并非一个硬性规则。\n\n## JavaScript\
  \ 脚本\n\n每个网页都以 HTML 为基础。反过来，HTML 可能包含对图片和其他媒体内容，以及 CSS 和 JavaScript 的引用。\n\n稍后你会看到，CSS\
  \ 在我们的 JavaScript 项目中也扮演着重要角色，但眼下，我们将专注于 JavaScript 是如何添加到网页中的。\n\n\n\n### 加载 JavaScript\n\
  \n将 JavaScript 加载到页面中有两种主要方法。第一种是将 JavaScript 放入 `<script>` 元素中。这通常位于 `<head>` 元素内：\n\
  \n```\n...\n\n//  JavaScript 代码写在这里\n\n...\n```\n\n以这种方式添加到 HTML 中的脚本被称为**内联**脚本。\n\
  \n第二种方法是引用一个外部文件：\n\n```\n如你所见，<script> 元素同时充当了外部文件的链接。在 CSS 中，你会使用 <link> 元素来做同样的事情，如果\
  \ JavaScript 是在更近的年代发明的，那么 JavaScript 文件可能也会采用类似的方式。然而，事实并非如此。\n```\n\n用于链接的 `<script>`\
  \ 元素的特点在于其包含 `src` 属性。该属性包含一个指向外部脚本的 URL（完整或部分），这与使用 `href` 属性来链接 CSS 样式表的方式非常相似。\n\
  \n请注意，如果存在 `src` 属性，那么 `<script>` 元素中任何额外的 JavaScript 代码都将被忽略。你不能在同一个 `<script>`\
  \ 元素中同时使用两者。\n\n### 其他脚本属性\n\n简单的 `<script>` 标签就能完成工作，但还有一些属性可以添加以影响脚本：\n\n- *非常*旧的版本使用过\
  \ `language` 属性，但这已经过时了，因此不应再使用。如果你的浏览器仍然需要它，那么你可以忘记本书其余内容，直到更新到更新的版本。\n- 更近期的版本中，有一个\
  \ `type=\"text/javascript\"` 属性可使 `<script>` 更具体。从技术角度来说，你也不需要它，因为脚本类型默认就是 JavaScript，但它可以用来明确你的意图，并帮助将其与非\
  \ JavaScript 类型区分开来。\n- `defer` 属性使 JavaScript 等待页面其余部分加载完成。你将在下一节中看到更多相关内容。\n-\
  \ `crossorigin` 属性影响如何处理来自不同来源的脚本。你将在后面看到这如何影响错误处理。\n\n如果你不是在 Web 服务器上运行，`crossorigin`\
  \ 属性很可能会导致错误。*如果你在没有服务器的情况下测试脚本，你应该省略该属性*。\n\n还有一些其他属性，但我们的项目中不会用到它们。\n\n通常，我们的\
  \ `script` 标签应该像这样：\n\n```\n<script src=\"...\"></script>\n```\n\n我们所有的编码项目都将包含这一行。\n\
  \n### 内联脚本 vs. 外部脚本\n\n内联脚本具有便利性的优势，因为你可以将所有内容写在一个文件中。\n\n然而，在大多数情况下，最好使用外部脚本：\n\
  \n- 有时，你会在多个页面中使用相同的代码，因此最好将代码分离出来，然后后续再包含进来。\n- 维护混合代码（HTML 和 JavaScript）更困难，并且可能导致额外的错误。\n\
  - 如果为不同的任务使用单独的文件，组织性会更好。\n- 外部脚本允许更精确地控制它们的使用方式。\n\n在我们的所有项目中，都将使用外部脚本。\n\n###\
  \ 延迟加载\n\n在本书中，我们会将 `<script>` 元素放在较早的位置，即 `<head>` 元素内，这是标准做法。你也可以将元素放在更靠后的位置，甚至可能看到它被放在文件的末尾。\n\
  \n浏览器通常在遇到 `<script>` 元素时就会开始加载和处理 JavaScript。在处理 JavaScript 时，它会暂停加载和处理其余的 HTML。这有两个问题：\n\
  \n- 因为你*很可能*并不想立即运行 JavaScript，所以你不必要地延迟了 HTML 内容，用户可能会体验到页面的视觉停顿。\n- 某些 JavaScript\
  \ 代码需要引用页面上的某些元素。由于 JavaScript 在其余 HTML 之前被处理，这些元素当时尚不存在，整个事情将会崩溃。\n\n现代浏览器都支持 `defer`\
  \ 属性：\n\n\n\n这将允许浏览器继续处理 HTML 的其余部分，并且浏览器实际上不会运行 JavaScript，直到 HTML 处理完成之后。\n\n\
  附录 B 描述了 `defer` 属性的旧替代方案。你不再需要那样做了，但你可能在旧代码中遇到过这些技术。\n\n你不能将 `defer` 用于内联脚本（没有\
  \ `src` 属性的脚本）。如果你有内联 JavaScript，你将需要使用一种更旧的技术。\n\n## 错误处理\n\n你很可能会在你的 JavaScript\
  \ 代码中犯一些错误，其中一些错误可能非常难以定位。从历史上看，JavaScript 对某些错误是相当沉默的，理由是访问用户对开发者的错误也无能为力。然而，作为开发者，这种沉默可能令人恼火，所以你希望错误能更明显。\n\
  \n以下代码将使*某些*错误更容易识别：\n\n```javascript\nwindow.onerror=function(message, url, line)\
  \ {\nalert(`Error: ${message}\\n${url}: ${line}`);\n};\n```\n\n每当 JavaScript 遇到一个可报告的错误时，我们不希望\
  \ JavaScript 将其隐藏起来。这个简单的事件监听器监听 `error` 事件，并弹出一个包含错误消息、其位置（哪个文件）以及希望的行号的警报。如果错误发生在附加文件中，行号会存在一些问题，而这正是你将要做的事情。将\
  \ `crossorigin=\"anonymous\"` 添加到脚本链接中应该可以解决这个问题。\n\n请注意，这不会帮助你解决*所有*错误。例如，某些错误会完全阻止\
  \ JavaScript 运行，所以你永远不会收到此消息或任何其他消息。其他一些错误则不会被此代码捕获。但是，有一些帮助总比没有好。\n\n## 严格模式\n\n\
  为了方便起见，JavaScript 对某些规则非常宽松。实际上如此宽松，以至于它让你犯了很多错误却不将其视为错误。现代 JavaScript 允许你对一些规则更加严格。\n\
  \n要将 JavaScript 置于严格模式下，请在你的脚本开头添加：\n\n```javascript\n'use strict';\n```\n\n`'use\
  \ strict';` 语句只是一个 JavaScript 字符串。JavaScript 会允许你将任何字符串或其他表达式作为独立的语句，但大多数这样的语句本身是无用的，因为你没有说明如何处理这些值。然而，只要\
  \ `'use strict';` 语句是你的代码或函数中的第一个*真正*的语句，它就会做一些事情：\n\n-   严格模式将禁止给未声明的变量赋值。这对于发现打字错误非常有用，这也是我们将使用它的主要原因。\n\
  -   严格模式会影响特殊变量 `this` 的行为。我们稍后会看到这到底是怎么回事。\n\n这看起来可能是一种相当奇怪的更改设置的方式，但这样做仅仅是为了使其与旧浏览器兼容。不能期望旧浏览器理解新命令，但它们会愉快地忽略一个独立的字符串，因为它们一直以来都是这样做的。\n\
  \n如果你将别人的代码整合到你自己的代码中，如果他们对代码有点粗心，你可能会与严格模式发生冲突，你感到有些委屈可能是合理的。然而，在编写你自己的代码时，你应该*始终*使用严格模式。\n\
  \n注意，之前提到 `'use strict';` 语句应该是第一行*真正的*代码。从这个意义上说，空白行当然不是真正的代码，但注释也不是。换句话说，你可以在开头有任意多的空白行和注释，但\
  \ `'use strict';` 应该是所有这些之后的第一条语句。\n\n## 一些模板\n\n综上所述，这里为你提供一些推荐的 JavaScript 模板：\n\
  \n### HTML 模板\n\n在 HTML 中，你需要包含或引用 JavaScript。如果脚本要内联包含，你可以添加：\n\n如果脚本是外部的（这是常见情况），你可以像这样引用它：\n\
  \n在本书中，我们将使用外部脚本。在某些情况下，你将加载多个 JavaScript 文件，因此会有多个链接。\n\n如果你在以下练习中没有使用某种 Web 服务器，`crossorigin`\
  \ 属性可能会引起问题。你应该改用以下模板：`<script type=\"text/javascript\" src=\"...\" defer></script>`\n\
  \n### JavaScript 模板\n\n在 JavaScript 文件中，你可以从以下内容开始：\n\n```javascript\n/*  something.js\n\
  ================================================\nDescription ...\n================================================\
  \ */\n'use strict';\nwindow.onerror=function(message,url,line) {\nalert(`Error:\
  \ ${message}\\n${url}: ${line}`);\n};\ninit();\nfunction init() {\n}\n```\n\n这个模板包括以下部分：\n\
  \n-   开头的注释块用作主标题，并允许包含任何额外的注释。\n-   `'use strict'` 语句将脚本的其余部分置于严格模式。\n-   `error`\
  \ 函数将报告一些错误。\n-   代码的主体部分位于一个名为 `init` 的函数内，以便于组织。由于整个脚本是延迟执行的，它将在适当的时候通过 `init();`\
  \ 语句被调用。当然，它不一定非要叫 `init()`。\n\n在接下来的项目中，我们将使用这种模式。\n\n## 总结\n\n-   **语句**：\n  \
  \  一个 JavaScript 程序由许多语句组成。\n    语句通常写在单独的行上，并以单个分号结束。\n\n-   **表达式**：\n    表达式是术语的组合，结果是一个单一的值。\n\
  \n-   **变量和赋值语句**：\n    变量是数据的命名容器。命名变量时：\n    -   仅使用单个单词（或使用 `camelCase` 格式的多个单词）。\n\
  \    -   以字母开头。\n    -   不要使用特殊字符。\n    -   注意大小写敏感。\n    赋值语句将一个新值放入变量中：\n\n  \
  \  ```\n    [variable] = [new value]\n    ```\n\n    如果一个变量在表达式中被使用，那么将使用其当前的（旧的）值。\n\
  \    你不能在等号的左侧放置表达式。\n\n-   **注释**：\n    注释是不会被 JavaScript 解释的文本块。它们通常用于：\n    -\
  \   注释你的代码\n    -   禁用（隐藏）部分你的真实代码\n    有两种编写注释的方式：\n    -   `// 单行注释`\n    -  \
  \ `/* 块状注释 */`\n    你不能嵌套块注释。\n\n-   **函数**：\n    函数是可以在代码中复用的、命名的语句块。JavaScript\
  \ 有许多内置函数，但你也可以创建自己的函数。\n    如果函数计算并返回一个值，那么该函数可以作为表达式的一部分使用。\n\n## 即将到来\n\n现在你已经了解了\
  \ JavaScript 的工作原理，我们将把所有知识付诸实践。\n在接下来的章节中，我们将学习更多关于这门语言以及如何使用它的知识。我们还将学习更多关于如何使用\
  \ JavaScript 与网页交互的内容。\n然而，首先，我们将更深入地研究一些 JavaScript 概念。在下一章中，我们将实现一个简单的猜数字游戏。在这个过程中，我们将学习更多关于条件、循环和函数等主要\
  \ JavaScript 结构的知识。我们还开始学习如何访问网页上的元素。\n\n## 2. 项目：一个简单的猜数字游戏\n\nJavaScript 可以用来编写一些非常复杂的游戏，但这里我们不打算这样做。相反，我们将编写一个非常简单的猜数字游戏。这将帮助我们培养\
  \ JavaScript 语言中一些重要概念的技能。\n\n在本章中，我们将学习：\n\n-   编写一个基本的 JavaScript\n-   与用户交互\n\
  -   基本的 JavaScript 结构\n-   函数\n-   使用 `do ... while` 块进行循环\n-   使用 `if ... then\
  \ ... else` 块进行条件编码\n-   完善脚本\n\n\n```markdown\n\n"
- "# 排版后的文档\n\n本练习的目的*不是*游戏，而是让我们在实际操作中观察一些重要的 JavaScript 原理和结构。\n\n接下来的一些代码示例建议在控制台中尝试。如果是这样，它们会以控制台提示符\
  \ `»` 作为前缀。\n\n## 预备代码\n\n每个网页都从 HTML 开始。反过来，HTML 会加载 JavaScript，并且在大多数情况下，包含各种将与\
  \ JavaScript 交互的 HTML 元素。\n\n在本例中，与 JavaScript 交互的主要元素是一个用于启动游戏的简单按钮：\n\n```html\n\
  <button id=\"startgame\">Start Game</button>\n```\n\n原则上，页面上可能有多个按钮，因此识别出这个特定的按钮非常重要。这可以通过\
  \ `id` 属性（一个唯一标识符）来实现。实际值可以是任何我们喜欢的内容，只要它是唯一的。在第 1 章中，我们开发了一些将 JavaScript 添加到网页的模板。我们将在此处使用它们。\n\
  \nJavaScript 代码本身可以放入 `scripts` 文件夹内的 `game.js` 文件中，这样我们就可以在此处链接它：\n\n```html\n\
  <script src=\"scripts/game.js\" crossorigin=\"anonymous\"></script>\n```\n\n对于这个项目，最好运行某种\
  \ Web 服务器，如引言中所述。如果你直接在 Web 浏览器中加载文件，则应移除 `crossorigin=\"anonymous\"` 部分。\n\n对于\
  \ JavaScript 文件，我们可以从标准模板开始：\n\n```javascript\n/*  game.js\n================================================\n\
  Guessing Game\n================================================ */\n'use strict';\n\
  window.onerror=function(message,url,line) {\nalert(`Error: ${message}\\n${url}:\
  \ ${line}`);\n};\ninit();\nfunction init() {\n}\n```\n\n在本章后面，我们会将一些代码移到另一个文件中。到那时，我们将编写一个生成随机数的函数，这种函数可能你会在其他项目中使用。在\
  \ `scripts` 文件夹中会有一个名为 `library.js` 的空文件。我们现在还用不到它，但先打开它也无妨。\n\n## 开始游戏\n\n游戏本身很简单：\n\
  \n-   游戏会从 1 到 100 中随机选择一个数字。\n-   人类（你）将尝试猜出这个数字。\n-   游戏报告猜测是太高、太低，还是正确。\n-  \
  \ 如果猜测不正确，人类会再次尝试，直到猜对或人类感到厌倦并退出游戏。\n\n交互将通过 JavaScript 弹窗的形式进行，特别是使用 `prompt` 函数，该函数会显示一条简单的消息并等待用户输入。\n\
  \n你将会看到游戏的效果，如图 2-1 所示。\n\n![猜数字游戏窗口截图](img/609513_1_En_2_Fig1_HTML.jpg)\n\n*图 2-1\
  \ 猜数字游戏*\n\n对于游戏，我们将创建另一个名为 `playGame()` 的函数。思路是通过点击按钮来触发此函数。\n\n第一步是识别按钮并将其链接到该函数：\n\
  \n```javascript\n...\ninit();\nfunction init() {\nlet button = document.querySelector('button#startgame');\n\
  button.onclick=playGame;\n}\nfunction playGame() {\n}\n```\n\nJavaScript 有很多方法来定位\
  \ HTML 元素，但如今最有用的是 `document.querySelector()` 函数。此函数接受一个字符串，该字符串与 CSS 用来标识元素的字符串相同。在本例中，我们请求的是\
  \ `id` 为 `startgame` 的 `button`。在 CSS 中，`#` 字符指的是 `id` 属性。这就是为什么在 HTML 中正确标记按钮如此重要。\n\
  \n如前所述，游戏代码将放入 `playGame` 函数中。这里，我们有一个所谓的 **存根**，一个满足 JavaScript 语法但尚未执行任何操作的空函数块。\n\
  \n我们希望点击按钮时运行游戏。为此，我们需要一个 **事件监听器**，它会在事件发生时调用一个函数。在本例中，事件是 `click` 事件，分配事件监听器的最简单方法是使用\
  \ `onclick` 属性。处理该事件的函数当然是 `playGame` 函数，因此将其赋值给 `onclick` 属性。\n\n此时，许多初学者会对括号的使用感到困惑。对于函数，函数名有\
  \ *三种* 用途：\n\n-   当你 **定义** 一个函数时，它总是带有括号。有时，这些括号包含要在函数中使用的附加变量，但有时它们是空的。\n-   当你\
  \ **调用** 一个函数时，你是在运行函数内部的代码。同样，你总是使用括号，可能还包含你想传递给定义中那些变量的值。有些函数会计算结果，因此函数的值就是结果的值。\n\
  -   当你 **引用** 一个函数时，你会 *省略* 括号。这意味着你计划稍后调用该函数，但不是现在。\n\n对于 `onclick` 事件处理程序，你需要使用括号定义函数。然后，你分配一个对该函数的引用，以便稍后调用；也就是说，你赋值\
  \ `playGame` 时 *不带* 括号。该函数将在稍后响应 `click` 事件时被调用。\n\n## 勾勒脚本大纲\n\n游戏本身将在 `playGame()`\
  \ 函数内进行。回顾本章开头的游戏描述，我们将游戏规划为以下步骤：\n\n-   设置游戏数据。\n-   重复：\n    -   用户猜测数字。\n   \
  \ -   检查数字并告知用户。\n-   ……直到猜对为止。\n\n我们会在过程中思考更多的细节，但这是一个好的开始。我们可以用注释的形式来勾勒：\n\n```javascript\n\
  function playGame() {\n//  Set up the data\n//  Initialise\n//  Repeat\n//  User\
  \ guesses\n//  Check and report\n//  ... until correct\n}\n```\n\n使用注释是勾勒计划的好方法。当你编写代码时，它们也可以作为标题。当你实际编写代码时，可能会发现计划需要调整，一些注释会改变或消失。这是开发过程的一部分。\n\
  \n## 初始化数据\n\n现在来填充实际代码。首先，JavaScript 中的所有数据都在变量中，我们需要两个变量：一个用于正确答案，我们称之为 `answer`；另一个用于用户的猜测，我们称之为\
  \ `guess`：\n\n```javascript\nfunction playGame() {\n//  Set up the data\nlet answer,\
  \ guess;\n...\n}\n```\n\n我们将使用较新的 `let` 语句，而不是更传统的 `var` 语句。在这个阶段，这不会有什么区别，但这是一个好习惯，因为\
  \ `let` 更可预测。不过，在控制台中进行的任何操作仍会使用 `var` 语句，以便保持灵活性。\n\n变量名可能听起来不太有创意，但很难误解它们的含义：\n\
  \n-   `answer` 将是用户必须猜出的数字。\n-   `guess` 将是用户的猜测。\n\n作为一个 *独立* 的步骤，我们将初始化 `guess`\
  \ 为一个随机数：\n\n```javascript\nfunction playGame() {\n//  Set up the data\nlet answer,\
  \ guess;\n//  Initialise\nanswer = 57;\n}\n```\n\n```\n\n\n## 随机数与游戏逻辑\n\n`57`可能不够随机，但在现阶段，我们需要使用已知的数值；当然，你可以使用任何想要的数字。在开发过程中，应当使用可预测的数据，以便验证其余代码是否正常运行。一旦确认代码工作正常，就可以改用未知值。后续我们会引入更随机的数字。\n\
  \n## 重复代码\n\n接下来要处理的内容，至少在 JavaScript 中会显得重复。我们需要重复询问用户输入猜测结果，并报告猜测是否正确，直到猜中数字为止。\n\
  \nJavaScript 有多种用于重复代码的语句，其中最通用的是`do ... while`语句：\n\n```\ndo {\n} while( ... );\n\
  ```\n\n有时你会看到重复语句被称为循环。更好的理解方式是把它看作重复操作，或者后续会提到的迭代。这里的语句块会在括号内的条件为`true`时重复执行。\n\
  \n在游戏中，我们希望重复代码*直到*猜对为止。有些语言确实提供了`until`条件语句，但 JavaScript 没有。我们需要将其转换为否定形式：在猜测*不正确*时重复执行：\n\
  \n```\nfunction playGame() {\n...\ndo {\n} while(guess != answer);\n}\n```\n\n运算符`!=`表示“不等于”，JavaScript\
  \ 使用感叹号（`!`）来表示“非”的逻辑。这个符号的灵感来自数学中的≠符号，不过你可能需要发挥一点想象力来理解。这种将条件判断放在代码块末尾的重复结构称为**后置测试**，意味着代码至少会执行一次，然后才决定是否继续重复。\n\
  \n## 主要游戏逻辑\n\n在重复结构内部，我们将获取用户猜测、与正确答案比较，并报告结果。\n\n### 获取用户输入\n\n要获取用户输入，我们使用`prompt`函数：\n\
  \n```\ndo {\nguess = prompt('Guess the number:');\n} while(guess != answer);\n```\n\
  \n`prompt`函数接收一条显示给用户的消息，并等待用户响应。它的实际外观因浏览器和操作系统而异，但大致如图 2-2 所示。\n\n![](img/609513_1_En_2_Fig2_HTML.jpg)\n\
  \nJavaScript 警告对话框的截图，包含以下字段：Guess the number。\n\n**图 2-2** 猜数字游戏的输入提示\n\n这里的消息略显突兀，但你可以自定义任何消息。请注意，你无法控制`prompt`的外观以及按钮的内容，这是为了防止网站伪造系统消息而采取的安全措施。这也意味着你需要设计消息措辞，让“确定”和“取消”按钮的含义清晰易懂。\n\
  \n`prompt`的响应有三种可能：\n\n*   **用户输入的字符串**：当用户点击**确定**按钮时返回。\n*   **空字符串**：用户点击**确定**按钮但未输入任何内容时返回。\n\
  *   **`null`**：表示用户点击了**取消**按钮，此时用户输入将被忽略。\n\n该响应存储在变量`guess`中。\n\n### 测试响应\n\n\
  假设我们已经在`prompt`中输入了有意义的内容，接下来需要将其与正确答案进行比较。可以使用`if`语句实现：\n\n```\ndo {\nguess = prompt('Guess\
  \ the number:');\nif(guess < answer) {        //  太小\n//  方案 A\n}\n} while(guess\
  \ != answer);\n```\n\n`if`语句检查括号内的条件。通常条件结果为`true`或`false`，但后续你会发现 JavaScript 对条件判断的处理更灵活。如果条件满足，则执行花括号（`{\
  \ ... }`）内的代码；否则不执行。\n\n如果条件代码只有一行，可以省略花括号。例如：\n\n\n```javascript\nvar a = 4, b\
  \ = 3;\nif(a > b) {\n    alert('更大');\n}\nif(a > b) alert('更大');  // 效果相同\n```\n\
  \n事实上，如果不使用不必要的结构来堆砌代码，代码会更易于理解和维护。此处的 `if` 子句使用了花括号，是因为稍后会有更多代码。\n\n当然，条件判断的取值情况可能不止一种，因此你可以在\
  \ `if` 后面跟一个 `else if` 子句：\n\n```javascript\ndo {\n    guess = prompt('猜数字：');\n\
  \    if(guess > answer) {   // 太大\n        // B 计划\n    }\n} while(guess != answer);\n\
  ```\n\n只有当最初的 `if` 条件不成立时，才会评估 `else if` 子句；否则，其代码将被忽略。你可以根据需要添加任意多个 `else if` 语句，但务必牢记：\n\
  \n*   它们不能与其他语句交叉。\n*   它们会按顺序依次判断。\n\n本例中，只有另一种取值情况，因此我们可以使用 `else` 子句来捕获剩余的情况：\n\
  \n```javascript\ndo {\n    guess = prompt('猜数字：');\n    if(guess > answer) {   //\
  \ 太大\n        // B 计划\n    }\n    else {                      // 正确\n        //\
  \ Z 计划\n    }\n} while(guess != answer);\n```\n\n这是一个相当完整的 `if` 语句示例。实际上，并非所有 `if`\
  \ 语句都会有 `else if` 子句，也并非都会有 `else` 子句。但如果确实存在，则必须按照正确的顺序排列。\n\n## 报告结果\n\n目前，我们可以简单地使用\
  \ `alert` 函数弹出一条消息，让用户知道测试结果：\n\n```javascript\ndo {\n    guess = prompt('猜数字：');\n\
  \    if(guess > answer) {   // 太大\n        alert('太高了');\n    }\n    else {    \
  \                  // 正确\n        alert('正确');\n    }\n} while(guess != answer);\n\
  ```\n\n`alert` 函数与 `prompt` 类似，它会弹出一条消息并等待用户响应。在这种情况下，只有一个选项，如图 2-3 所示。\n\n![JavaScript\
  \ 提示框对话框的屏幕截图。其中包含以下文本：太小了。](img/609513_1_En_2_Fig3_HTML.jpg)\n\n**图 2-3** 猜数字游戏的提示框\n\
  \n目前，每个条件块只有一个语句（`alert()` 函数），我们通常会去掉花括号。不过，为了将来的改进，我们暂时保留它们。\n\n## 测试你的代码\n\n\
  现在可以测试你的代码了。不过，因为答案最初是硬编码的，所以看到正确答案时不必惊讶。为了正确测试，你应该尝试以下值：\n\n*   输入一个太小的数字。\n* \
  \  输入一个太大的数字。\n*   取消 `prompt` 对话框。\n*   输入 0。\n*   输入一个负数。\n*   输入一个非数字的字符串。\n\
  *   最后，输入正确的答案（57）。\n\n你会注意到一些情况，其中部分情况会开始变得令人困扰：\n\n*   取消操作不会停止游戏，而是被当作另一个数字处理。\n\
  *   输入字符串会被当作数字处理。\n*   你需要点击很多次“确定”：一次用于输入猜测，另一次用于关闭消息对话框。\n\n当我们开始随机生成数字时，你还会看到其他一些问题。\n\
  \n## 整合消息\n\n目前，每次猜测都会出现两个对话框：一个用于 `prompt`，另一个用于显示结果的 `alert`。将结果与下一次猜测的 `prompt`\
  \ 结合起来会方便得多。为此，我们需要另一个变量 `message`。这是因为提示消息会随着每次猜测而改变。\n\n首先，添加新变量并初始化：\n\n```javascript\n\
  function playGame() {\n    // 设置数据\n    let answer, guess;\n    let message;\n \
  \   // 初始化\n    answer = 57;\n    message = '猜数字';\n    ...\n}\n```\n\n现在，你可以在 `prompt`\
  \ 函数中使用 message 变量：\n\n```javascript\nguess = prompt(message);\n```\n\n这样应该能得到完全相同的行为，所以你可能会想我们何必多此一举。即使没有其他改动，将消息文本移到初始化部分，我们已经提高了代码的可维护性。这样一来，所有任意设定的、灵活的值都集中在了一处，而不是散布在代码中。\n\
  \n但真正的好处在于，我们将根据猜测结果来更新消息：\n\n```javascript\ndo {\n    guess = prompt(message);\n\
  \    if(guess > answer) {   // 太大\n        message = '太高了';\n    }\n    else { \
  \                     // 正确\n        alert('正确');\n    }\n} while(guess != answer);\n\
  ```\n\n在这里，我们将消息替换为“太小了”或“太高了”。它不会立即显示，但 `while` 语句会继续循环，因此新的消息会在下一轮显示在 `prompt`\
  \ 中。另一方面，如果猜测正确，就不会有下一轮了，所以“正确”消息会像之前一样立即通过 `alert()` 函数显示。现在测试代码时，就不会那么繁琐了。\n\n\
  ## 随机化数字\n\n现在你可以来真的了。为此，你需要将硬编码的数字替换为随机数。JavaScript 有一个生成随机数的函数，它是 `Math` 包的一部分。要使用这个函数，你需要调用\
  \ `Math.random()`。`Math` 包实际上是一个内置的 JavaScript 对象。其目的是为数学处理提供一系列有用的函数和值。与所有对象一样，你使用所谓的点号表示法来引用其中的一项。在这里，`Math.random()`\
  \ 就是指 `Math` 对象中的 `random()` 函数。出于技术原因，任何作为对象一部分的函数都被称为**方法**。这其实是一回事。`Math` 对象中其他一些有用的方法包括\
  \ `Math.sqrt()` 和 `Math.log10()`。一些有用的值包括 `Math.PI` 和 `Math.E`，它们是数学中重要的常数。\n\n\
  从技术上讲，`Math.random()` 函数生成的是一个**伪随机**数，因为它并非真正随机——这个数字是通过一个极其复杂的过程生成的，以至于我们无法猜测结果。不幸的是，`Math.random()`\
  \ 的结果并不是整数；它是一个 `0–0.999...` 范围内的小数。也就是说，最小值可能是 `0`，而最大值则*小于* `1`。数学上，我们会写作 `0 ≤\
  \ r < 1`。\n\n我们需要做的是将这个数字缩放为 1 到 100 之间的值。这需要以下步骤：\n\n| 步骤 | 操作 | 最小值 | 最大值 |\n\
  | --- | --- | --- | --- |\n| 获取随机数 | `Math.random()` | 0 | 0.999… |\n| 乘以 100 |\
  \ `Math.random()*100` | 0 | 99.99… |\n| 截断结果 | `Math.floor(Math.random()*100)` |\
  \ 0 | 99 |\n| 加 1 | `Math.floor(Math.random()*100)+1` | 1 | 100 |\n\n`Math.floor()`\
  \ 函数会截断小数部分，这种操作也称为截尾；无论小数部分距离下一个整数有多近，都会被截断。\n\n如果你觉得这个过程有些繁琐，你可以将其封装到一个便捷函数中：\n\
  \n```javascript\n/*  game.js\n================================================\n\
  猜数字游戏\n================================================ */\n'use strict';\nfunction\
  \ random(max) {\n    //  返回一个 1 到 max 之间的随机数\n    return Math.floor(Math.random()*max)+1;\n\
  }\n...\n```\n\n你会注意到，我们给函数起的名字*几乎*和原始函数一样。不同之处在于，原始函数是 `Math` 对象的一部分，而我们的函数不是。只要它们在不同的上下文（作用域）中，且哲学上执行相同类型的操作，这样命名函数是没问题的。JavaScript\
  \ 允许你创建一个与另一个函数完全同名的函数，在这种情况下，新函数会替换旧函数。这并不总是一个好主意，但有时会意外发生。\n\n函数是构建代码的重要组成部分。我们已经将游戏代码包装在\
  \ `playGame()` 函数中，现在又添加了另一个函数来支持它。创建函数有很多理由，其中包括：\n\n*   代码可以被重复使用。这里，`random()`\
  \ 函数虽小，却是一段可以重复使用的有用代码。\n\n\n一旦编写了函数代码，程序的其余部分就可以直接使用它，而无需关心函数内部的实现细节。这让你能够一次专注于一个任务。\n\
  \n- 函数帮助你通过更小的步骤来开发更大的程序。实际上，函数成为了构建模块。\n\n对于这个`random()`函数，我们没有硬编码最大值`100`，而是使用了一个参数变量`max`，使函数更具通用性。\n\
  你会注意到，我们将这个新函数放在了最开头（当然，是在`'use strict';`语句之后）。这样做是为了提醒我们，这是一个支持性函数，可能是一个库的一部分。以后，我们甚至可以将此函数移动到一个公共库脚本中，以便在其他项目中使用。\n\
  \n现在，我们可以在游戏中使用这个随机数：\n\n```javascript\nfunction playGame() {\n    //  Setup the\
  \ data\n    let answer, guess;\n    let message;\n    //  Initialise\n    //  answer\
  \ = 57;\n    answer = random(100);\n    message = 'Guess the Number'\n    // ...\n\
  }\n```\n\n如果你想现在测试这个游戏，你必须进行有策略地猜测；否则，你可能要猜很久。最简单的方法是二分法猜测：从`50`开始，然后根据结果向上或向下减半。这被称为**二分查找**，因为你将可能性一分为二。\n\
  从技术上讲，这个数字并不是真正的随机数，但就我们的目的而言，它是不可预测的，这就足够了。\n随机数（或接近随机的数）的一个特点是它们可能是任何值。如果这个数字恰好是`1`或`100`，嗯，那是可能发生的，但这（还）不是怀疑某些功能不正常的理由。在你开始惊慌之前，多试几次。\n\
  \n### 取消游戏\n为了实现接下来的改进，你将不得不进行大量的猜测，只是为了看看你的下一个功能是否正常工作。一旦你确定下一个功能正常工作后，你应该能够取消游戏。\n\
  \n请记住，如果你点击**取消**，`prompt`函数会返回`null`。这会取消提示框，但 JavaScript 目前还不知道你同时也想取消游戏。\n你必须告诉它：\n\
  \n```javascript\ndo {\n    guess = prompt(message);\n    if(guess === null) return;\n\
  \    // ...\n} while(guess != answer);\n```\n\n是的，这是三个`=`字符。你将在下一节中理解原因。\n\n请记住，整个游戏是在一个函数内部进行的。`return`语句完成两项工作：\n\
  \n- 退出函数。\n- 设置一个特定的值作为函数的返回结果。\n\n要设置一个返回值，你可以使用类似`return 'goodbye';`这样的语句。在这个案例中，我们没有设置任何特定的值，但\
  \ JavaScript 仍然会设置一个值；默认的返回值是`undefined`。\n对于这个游戏，我们实际上并不关心返回值。我们只关心函数被退出这一事实。\n\
  请注意`if`条件：`if(guess === null) ...`。这是一个例子，说明简单的单行`if`语句比使用语句块更具表达力。\n\n### 比较相等的值\n\
  这是给新手的一个陷阱。部分困惑来自于我们对“等于”这个词的随意使用。\n\nJavaScript 有**三个**使用`=`字符的运算符。第一个是赋值运算符：\n\
  \n```javascript\nvar a, b;\na = 3; b = 4;                   //  assignment\n```\n\
  \n下一个运算符是**等值**运算符，用于比较两个值：\n\n```javascript\nif(a == b) console.log('yes');  //\
  \  comparison\nelse console.log('no');\n//  ← no\n```\n\n比较运算符使用两个`=`字符：`==`。这里，我们会得到`no`，因为这两个值不相同。\n\
  \n现在，这是陷阱 1。如果你错误地使用了赋值运算符而不是比较运算符，它确实会做一些事情，但你不是在比较值。相反，你是在重新赋值给一个变量：\n\n```javascript\n\
  if(a = b) console.log('yes');   //  assign b to a\nelse console.log('no');\n// \
  \ ← yes\n```\n\n在这个例子中，`a`变成了 4，你会得到`yes`。但这并不是你可能以为的原因。让我们用不同的值再试一次：\n\n```javascript\n\
  var a, b;\na = 3; b = 0;\nif(a = b) console.log('yes');\nelse console.log('no');\n\
  //  ← no\n```\n\n这次，你会得到一个`no`。正如你所见，唯一不同的是`b`现在是`0`。\n在控制台中实验时，你会注意到，像`a = 3`这样的语句会有一个结果，这个结果就是你刚刚赋的值。\n\
  在表达式`if(a = b) ...`中，发生了**两**件事。首先，变量`a`获得了一个新值。其次，这个新值在`if()`中被测试：如果这个值是 truthy（例如非零数字），测试通过；如果这个值是\
  \ falsy（例如零），测试失败。\n有很多开发者会提供各种避免这个陷阱的建议，但这些都是糟糕的建议。习惯它就好。你*会*犯这个错误，并且你最终会变得更擅长识别它。\n\
  \n至于陷阱 2，它没那么严重，但仍然可能让你犯错。让我们将其中一个值改为字符串，并进行一次正确的比较：\n\n```javascript\nvar a, b;\n\
  a = 3; b = '3';\nif(a == b) console.log('yes');\nelse console.log('no');\n//  ←\
  \ yes\n```\n\n数字`3`和字符串`'3'`是相同的值吗？答案取决于你对等值的宽松程度。在 JavaScript 中，其中一个可以轻易地被解释为另一个，所以这已经足够接近了。\n\
  \n如果这还不够好，你可以严格一点：\n\n```javascript\nif(a === b) console.log('yes');\nelse console.log('no');\n\
  //  ← no\n```\n\n第三个运算符是**恒等**运算符，使用**三个**字符：`===`。基本上，它测试值是否相同，而不进行重新解释。\n你不会经常看到恒等运算符，但在比较\
  \ falsy 值时，它可能特别重要。有很多值会被解释为`false`，偶尔你可能需要区分它们。这就是恒等运算符的用武之地。\n\n### 更有意义的返回值\n\
  如前所述，我们并不真正关心函数的返回值，因为它只是为了取消游戏。在更宏大的方案中，你实际上可能会用到这个返回值。以下是它的用法：\n\n首先，将返回值设置为有意义的内容：\n\
  \n```javascript\nguess = prompt(message);\nif(guess === null) return 'game cancelled';\n\
  ```\n\n其次，为函数设置一个备选返回值：\n\n```javascript\nfunction playGame() {\n    // ...\n  \
  \  return 'game over';\n}\n```\n\n我们设置`startgame`按钮的方式使得利用返回值有些困难，但至少我们生成了一些指示游戏结束原因的标志。\n\
  \n### 显示猜测范围\n如果你已经测试了这个游戏几次，你可能会发现自己记不清已经猜过哪些数字。我们现在可以做的是，以猜测范围的形式添加一些反馈。\n一开始，数字在\
  \ 1 到 100 之间。如果第一次猜的数字太高，那么正确数字将在 1 到你猜测的数字减 1 之间；如果第一次猜的数字太低，那么正确数字将在你猜测的数字加 1\
  \ 到 100 之间。\n你可以通过调整猜测范围的最小值和最大值来继续这个过程，直到你锁定正确的值。无论如何你都应该这样做，但现在我们将让 JavaScript\
  \ 帮助我们进行追踪。\n\n首先，我们需要两个新的变量：\n\n```javascript\nfunction playGame() {\n    //  Setup\
  \ the data\n    let min, max;\n    let answer, guess;\n    let message;\n    //\
  \  Initialise\n    [min, max] = [1, 100];  //  or: min=1; max=100;\n    answer =\
  \ random(max);\n    message = 'Guess the Number';\n    // ...\n}\n```\n\n这两个新变量`min`和`max`，首先像通常一样声明，然后分别初始化为`1`和`100`。\n\
  这种写法有几个值得注意的特点：\n\n\n\n- 我们有三条`let`语句用于五个变量。你可以根据需要设置任意多条`let`语句。这里将它们用于在单个语句中对逻辑相关的变量进行分组。\n\
  \n- 新变量`min`和`max`在其他变量之前声明，更重要的是，它们在其他变量之前初始化。这是因为我们将在下一条语句中使用`max`的初始值。\n\n- 我们不再生成最大值为`100`的随机值，而是使用`max`。这样得到的数值相同，并且通过使用已初始化的变量来强调这一点。如果我们决定改用最大值为`1000`，只需要设置一次，这样更安全。\n\
  \n- 我们在单条语句中同时初始化了`min`和`max`变量。\n\n表达式`[min,max] = [1,100]`被称为**解构**赋值，它允许你一次性赋值多个值。方括号`[\
  \ ... ]`定义了一个称为**数组**的集合，我们将在后面详细讨论。其思想是，左侧的每个变量都获取右侧对应的值。解构赋值并非 JavaScript 的原生特性，因此你需要像相关注释中所示那样，在两个单独的语句中完成赋值。将两条语句放在同一行并用分号分隔，这是一种合理的方式。这也是强化“你在赋值两个相关值”这一概念的一种方法。\n\
  \n接下来是在提示信息中使用这些新变量：\n\n```\ndo {\n  guess = prompt(`${message}\\n 从${min}到${max}`);\n\
  \  if(guess === null) return '游戏已取消';\n  ...\n} while(guess != answer);\n```\n\n\
  该消息已嵌入到较新类型的字符串字面量——**模板字面量**中。其最直接的特征是使用反引号（`` `...` ``）而不是通常的单引号或双引号。这告诉 JavaScript\
  \ 它可以查找内部的表达式。字符串内部是表达式和普通文本的混合。表达式被包裹在特殊的代码`${ ... }`中。在这个例子中，表达式只是变量。这是将字符串与值混合的最简单方式。你还会看到字符串中的`\\\
  n`。这在普通字符串中也能工作，它是一个表示换行的代码。\n\n刚开始时，你会看到类似图 2-4 的内容。\n\n![](img/609513_1_En_2_Fig4_HTML.jpg)\n\
  \nJavaScript 提示对话框的截图。其中包含以下文本字段：“从 1 到 100 猜数字”。\n\n图 2-4 带有最小值和最大值的提示框\n\n随着游戏进行，范围会改变。这可以在测试猜测时实现：\n\
  \n```\nif(guess < answer) {\n  message = '太小了';\n  min = guess + 1;\n}\nelse if(guess\
  \ > answer) {\n  message = '太大了';\n  max = guess - 1;\n}\nelse {\n  alert('正确');\n\
  }\n```\n\n这就是为什么我们在`if`语句的每个部分都使用花括号：以便我们可以包含额外的语句。如果猜测太小，你需要下一次猜得更大；新的最小值应该比上一次的猜测大\
  \ 1。如果猜测太大，你下一次应该猜得更小，新的最大值应该比上一次的猜测小 1。\n\n现在测试时，它会工作一会儿，但你会看到另一个问题。你可能会收到类似“从\
  \ 501 到 100”的消息。这里，我们遇到了 JavaScript 的另一个问题。回想一下，JavaScript 使用`+`运算符进行字符串拼接和数字加法，并且优先进行拼接。事实证明，`prompt`的所有输入都是字符串。到目前为止这还没问题，因为像我们使用`<`和`>`比较数字和字符串时，会导致`guess`临时转换为数字以供比较。对于表达式`guess\
  \ - 1`也没问题；你不能对字符串进行减法运算，所以 JavaScript 再次临时将`guess`转换了。\n\n然而，对于`guess + 1`操作，JavaScript\
  \ 会将它们都视为字符串并进行拼接；这就是像`501`这样的结果出现的原因。解决方案是强制将`guess`值转换为数字。最简单的方法是使用`parseInt()`函数，它会将`guess`变量转换为整数：\n\
  \n```\ndo {\n  guess = prompt(`${message}\\n 从${min}到${max}`);\n  if(guess === null)\
  \ return '游戏已取消';\n  guess = parseInt(guess);    // 转换为数字\n  ...\n} while(guess\
  \ != answer);\n```\n\n只要字符串以数字开头，例如`23`、`23.5`或`23etc`，`parseInt()`函数通常就能从字符串中生成一个整数。但是，如果字符串不是以数字开头，例如`hello`，它就会失败；在这种情况下，你会得到`NaN`，即“非数字”。\n\
  \n与其传播这样的错误，我们可以为无效数字替换为`0`：\n\n```\ndo {\n  guess = prompt(`${message}\\n 从${min}到${max}`);\n\
  \  if(guess === null) return '游戏已取消';\n  guess = parseInt(guess) || 0;    // 转换为数字\n\
  \  ...\n} while(guess != answer);\n```\n\n`||`运算符在 JavaScript 中表示**或者**。它通常用于组合多个条件，但在这里用作备选：如果第一个值没有意义，就使用下一个值。出于这个目的，`NaN`以及`undefined`和`null`都没有意义。\n\
  \n## 函数库\n\n在开发代码时，我们添加了一个`random()`函数，作为 JavaScript 内置`Math.random()`函数的便捷封装。它没有与当前项目特别相关的内容，所以我们把它放在开头，以提醒我们可以在任何地方使用它。现在一切正常，我们可以将函数移动到单独的库文件中，从而完成代码的组织。\n\
  \n在`scripts`文件夹中，有一个名为`library.js`的文件。名称本身无关紧要——只要你能记住你叫它什么，可以用任何名称。我们将把`random()`函数移动到该文件中。\n\
  \n1.  打开`scripts/library.js`文件。\n2.  从`game.js`文件中剪切`random()`函数，并粘贴到`library.js`中。\n\
  3.  在`random()`函数上方添加另一个注释块来描述该函数。类似下面这样即可：\n\n```\n    /*  random(max)\n    ================================================\n\
  \    返回一个介于 1 和 max 之间的随机整数\n    ================================================\
  \ */\n```\n\n4.  在你的`game.html`文件中添加一个脚本链接：\n\n注意，这里不需要包含`defer`属性，因为加载该文件不会干扰页面其余部分的加载。我们可以在未来的项目中使用`library.js`文件。\n\
  \n## 最终代码\n\n以下是`playGame`函数的完整实现：\n\n```\nfunction playGame() {\n  //  设置数据\n \
  \ let min, max;\n  let answer, guess;\n  let message;\n  //  初始化\n  [min,max] =\
  \ [1,100];\n  answer = random(100);\n  message = '猜数字';\n  do {\n    guess = prompt(`${message}\\\
  n 从${min}到${max}`);\n    if(guess === null) return '游戏已取消';\n    guess = parseInt(guess)\
  \ || 0;\n    if(guess < answer) {          //  太小\n      message = '太小了';\n    \
  \  min = guess + 1;\n    }\n    else if(guess > answer) {     //  太大\n      message\
  \ = '太大了';\n      max = guess - 1;\n    }\n    else {                        //\
  \  正确\n      alert('正确');\n    }\n  } while(guess != answer);\n  return '游戏结束';\n\
  }\n```\n\n## 总结\n\n在本章中，我们通过一个简单的猜数字游戏项目，探索了一些重要的编程概念。\n\n### 注释\n\n注释可用于解释代码的各个部分，以及勾勒代码的章节。它们还可以用于禁用部分代码以进行测试。\n\
  \n### 组织\n\n当然，最好能够预先规划好所有代码。然而，在构建项目时，我们遵循了一些组织原则：\n\n-   **尽早声明变量。**\n\n    我们使用了多条`let`语句并带有多个变量，以体现变量的分组感。\n\
  \n-   **接下来初始化数据。**\n\n    有时，你可以一步完成变量的声明和初始化。\n\n\n\n# 排版后的文档\n\n## 编写可重用代码\n\n\
  * 寻找编写可重用代码的机会。如果可能，将该代码放入一个库中。\n\n我们使用`random()`函数做到了这一点。\n\n## 重复\n\n`while`语句用于在条件为真时重复执行一个代码块。\n\
  \n## 条件块\n\n`if`语句用于条件性地运行代码——当条件测试为`true`时。\n`if`后面可以跟一个或多个`else if`块，并且可以跟一个`else`块。\n\
  多行代码块用花括号括起来。对于单条语句，花括号不是必需的，但如果认为这样可读性更好，或者认为以后可能需要添加更多语句，也可以使用花括号。\n在测试相等性时，需要使用相等运算符（`a\
  \ == b`）。一个常见的错误是使用赋值运算符（`a = b`），这不会测试相等性，而是改变第一个变量的值。\n\n## 对话框\n\n`prompt()`函数可用于获取用户输入，而`alert()`函数可用于发送消息。\n\
  取消`prompt()`对话框并不会取消所有操作。如果你希望它执行更多操作，例如退出游戏，则必须编写相应的代码。\n从`prompt()`返回的值是字符串，并且永远不会是数字。虽然\
  \ JavaScript 通常会在需要时将字符串重新解释为数字，但如果使用加法运算符（`+`），则不会重新解释；相反，它会进行字符串拼接。有时，你需要使用类似`parseInt()`的方法自行转换字符串。\n\
  \n## 后续内容\n\n这个游戏作为一个 Web 项目来说相当枯燥。网页的唯一参与是通过页面上的一个按钮来启动游戏。\n在下一章中，我们将仔细研究如何与网页进行交互。我们将学习如何定位页面上的元素，以及如何更改它们的内容或其他属性。我们甚至将创建一些元素来添加到页面中。\n\
  在第 4 章中，我们将把所有这些付诸实践。\n\n---\n\n# 第 3 章 操作 HTML 元素\n\n所有网页最初都是用 HTML 编写的，但这些代码最初只是文本。浏览器获取这些\
  \ HTML 代码以及任何关联的 CSS，并使用它们生成页面的可见内容。\n当浏览器加载并实现 HTML 时，它还会为 JavaScript 创建一个文档的内部表示。这被称为**文档对象模型**，简称**DOM**。我们可以使用\
  \ DOM 在 JavaScript 中操作网页的各个部分。\n\n在本章中，我们将探讨：\n\n* 选择页面上的单个和多个元素\n* 访问和添加内容到 HTML\
  \ 元素\n* 创建额外的元素\n* 操作元素属性\n* 操作 HTML 元素的 CSS 样式\n\n要真正掌握这些内容，这里有一个供您实验的示例页面：\n\n\
  * 在浏览器中加载页面`sample-dom.html`。\n* 打开开发者工具控制台。\n* 同时在代码编辑器中加载该页面，以便查看底层的 HTML。\n\n\
  首先，页面看起来类似于图 3-1。\n\n![DOM 页面截图](img/609513_1_En_3_Fig1_HTML.png)\n\n图 3-1 示例 DOM\
  \ 页面\n\n随着本章的深入，您将对页面的内容和外观进行各种更改。\n为了提醒我们是在控制台中进行实验，代码示例将以控制台提示符（`»`）开头。\n\n##\
  \ DOM 树\n\nHTML 文档本质上是层次化的：元素位于其他元素内部。如果您查看示例页面的 HTML，将会看到类似这样的结构：\n\n实际上，还有更多内容。\n\
  \n当页面加载时，DOM 是根据 HTML 创建的。这被表示为一个**树状结构**，其中元素分支到它们内部嵌套的元素，如图 3-2 所示。\n\n![DOM 树示意图](img/609513_1_En_3_Fig2_HTML.jpg)\n\
  \n\n\n## DOM 树结构\n\n一个 DOM 树结构从`html`开始，后面跟着`head`和`body`。`head`包含`title`、`meta`和两个`link`。`body`由`header`、`main\
  \ body`和`footer`组成。\n\n**图 3-2**  \n**DOM 树**\n\n用于描述树结构元素的术语往往混合了多种隐喻：\n\n- 在树结构中，元素被称为**节点（node）**，它们是分支上的连接点。\n\
  - 一个分支到其他元素的元素称为**父（parent）**节点。\n- 父节点分支出的元素称为**子（child）**节点。\n- 具有相同父节点的节点称为**兄弟（sibling）**节点。\n\
  - 树结构的起点称为**根（root）**节点。你会注意到，整个树结构通常被绘制成倒置的，根节点在顶部。\n\n有些术语来自树的隐喻，而另一些则来自家族的隐喻。有时你需要处理特定的节点，而有时你会处理与特定节点相关的节点。\n\
  \n### 查找元素\n\n在 JavaScript 中，你肯定需要做的一件事就是找到你想要处理的元素。过去，你可能会使用以下任意函数：\n\n- `document.getElementsByTagName()`：返回使用特定标签（如`h1`或`li`）的元素集合。\n\
  - `document.getElementsByName()`：返回具有特定`name=\"...\"`属性的元素集合。如今，`name`属性仅限于表单元素。\n\
  - `document.getElementById()`：返回与`id=\"...\"`属性匹配的单个元素。如果有多个匹配项（不应该出现），则只返回第一个匹配项。\n\
  - `document.getElementsByClassName()`：返回具有特定`class`属性的元素集合。\n\n这些函数大致按历史顺序排列。实际上，最后一个函数`document.getElementsByClassName()`并没有得到太多青睐，因为它较晚才出现在当时占主导地位的\
  \ Internet Explorer 中，而那时更好的方法已经出现了。请注意，上述函数中除了一个之外，其名称中都有复数形式的`Elements`，以反映它们返回一个集合的事实。只有`document.getElementById()`在其名称中有单数形式的`Element`，以反映应该只有一个匹配项的事实。\n\
  \n你不再需要这些函数中的任何一个，但你仍然会在旧代码或由年长开发者编写的代码中看到它们。对于`document.getElementById()`来说尤其如此。然而，从现在开始，我们将不再使用它们。\n\
  \n现在有两个函数可以满足你的所有需求：\n\n- `document.querySelector()`：匹配选择器的*第一个*元素。如果没有匹配项，你将得到`null`。\n\
  - `document.querySelectorAll()`：返回匹配选择器的元素*集合*。即使只有一个匹配项，它仍会在集合中返回。如果没有匹配项，你将得到一个空集合。\n\
  \n你将通过下表了解它们的使用方法：\n\n| 方法 | 含义 |\n| :--- | :--- |\n| `document.getElementsByTagName('p')`\
  \ `document.querySelectorAll('p')` | 所有段落 |\n| `document.getElementsByName('amount')`\
  \ `document.querySelectorAll('[name=\"amount\"]')` | 所有具有`name`属性的元素 |\n| `document.getElementsByClassName('special')`\
  \ `document.querySelectorAll('.special')` | 类中的所有元素 |\n| `document.getElementById('separate')`\
  \ `document.querySelector('#separate')` | 通过`id`获取单个元素 |\n\n注意，上述所有示例都以`document.`开头，这意味着我们在整个文档中搜索。但是，你可以从先前定位到的元素开始搜索。\n\
  \n例如：\n\n```\n//  在文档中查找第一个 div\n    var div = document.querySelector('div');\n\
  //  在上述 div 中查找所有段落\n    var p = div.querySelectorAll('p');\n```\n\n这里，在整个文档中搜索第一个匹配`div`的元素。然后在得到的`div`元素中进一步搜索所有`p`（段落）元素。在下一节中，你将看到更多关于使用标签名和其他选择器的内容。\n\
  \n## CSS 选择器\n\nJavaScript 不是 CSS，但它在其`.querySelector()`和`.querySelectorAll()`方法中使用了\
  \ CSS 选择器。CSS 选择器是 CSS 用来标识哪些元素受 CSS 规则影响的表达式。\n\n多年来，CSS 已经变得非常复杂，并且有许多微妙的方式来定位元素。对我们来说，我们主要关心以下几点：\n\
  \n- **标签（tag）** 选择器：引用一个或多个基本元素，如`h1`或`p`。\n- **id** 选择器：引用具有`id=\"...\"`属性的单个元素。\n\
  - **类（class）** 选择器：引用具有`class=\"...\"`属性的任意数量的元素。\n- **属性（attribute）** 选择器：引用各种元素的其他属性，例如`name=\"\
  \"`。\n- 也可以引用作为元素**后代（descendant）**或**子元素（child）**的元素，例如特定列表中的项目或`div`内的段落。\n\n\
  ### 标签选择器\n\n最基本的选择器是**标签**选择器。这是一个简单的 HTML 标签，指的是所有具有该标签的元素。例如：\n\n```\ndocument.querySelectorAll('p');\
  \   //  所有段落 ()\ndocument.querySelector('div');    //  第一个 div\ndocument.querySelector('h1');\
  \     //  第一个（并且大概是唯一的）主标题 h1\ndocument.querySelectorAll('h1');  //  一个可能只有一个 h1\
  \ 的集合\n```\n\n原则上，你应该使用`querySelectorAll()`通过标签选择器获取任何元素。然而，在某些情况下，例如`h1`，该元素被认为是唯一的，因此`querySelector()`可能更合适。通过标签名获取元素的旧方法是`document.getElementsByTagName(...)`，但使用`document.querySelectorAll(...)`更加灵活。除了那些应该是唯一的元素之外，你可能还需要通过使用**id**来进一步限制结果。\n\
  \n### id 选择器\n\n在 HTML 中，通常有一个`id`附加到要定位的元素上。例如，页面上的一个段落具有以下 HTML：\n\n```\n<p id=\"\
  something\" class=\"special\">This is interesting</p>\n```\n\n在 CSS 中，id 用井号（`#`）标识：\n\
  \n```css\np#something {\n  border: thin solid #666;\n  padding: 0.25em 0.5em;\n\
  }\n```\n\n在 JavaScript 中，你可以使用 CSS 选择器引用该元素：\n\n```\nvar p = document.querySelector('p#something');\n\
  var p = document.querySelector('#something');   //  相同\nvar p = document.getElementById('something');\
  \   //  旧方法\n```\n\n由于`id`应该是唯一的，你可以像第二个例子那样单独使用`id`。然而，包含标签会使意图更清晰，所以我们采用这种方式。你会发现许多开发者仍然使用`document.getElementById()`，如最后一个例子所示，但这其实没有必要。较新的`document.querySelector()`做得同样好，而且更加灵活。\n\
  \n### 类选择器\n\n如果你想要匹配多个元素，那么`id`就不适用了。相反，你会看到`class`属性，它描述了一组多个元素。例如，在示例文档中，有几个段落，其中一些具有`class`属性：\n\
  \n```html\n<p>...</p>\n<p class=\"special\">...</p>\n<p>...</p>\n<p>...</p>\n<p\
  \ class=\"special\">...</p>\n<p class=\"special\">...</p>\n<p>...</p>\n```\n\n当然，类组可以小到一个，甚至为零。你通常认为组包含多个项目，但只有一个项目的组也可能有意义。例如，你可能想要描述**状态**的变化，比如当你点击某个东西时。\n\
  \n为了匹配特定的类，CSS 使用点号（`.`）：\n\n```css\np.special {\n  font-style: italic;\n}\n```\n\
  \n与`id`一样，你可以使用`querySelector()`来选择第一个匹配项，但与`id`不同，使用`querySelectorAll()`选择多个匹配项也是合理的。\n\
  \n\n```javascript\n//  第一个匹配\nvar p = document.querySelector('p.special');\n// \
  \ 所有匹配\nvar pp = document.querySelectorAll('p.special');\n//  不那么具体\nvar special\
  \ = document.querySelectorAll('.special');\n//  较旧的方法\nvar special = document.getElementsByClassName('special');\n\
  ```\n\n`p.special`和`.special`之间有一个微妙的区别。许多元素可以拥有相同的类，但它们可能并不都具有相同的标签。第二种形式也会匹配具有相同类的其他元素。\n\
  \n## 子代与后代选择器\n\n有时，您希望定位特定元素*内部*的所有元素。例如：\n\n```html\n<div>\n  <p> ... </p>\n \
  \ <p> ... </p>\n  <p> ... </p>\n</div>\n```\n\n要定位`div`内部的段落，您需要结合使用选择器，一个用于容器，一个用于内容。CSS\
  \ 有两种定位元素内容的方法：\n\n```css\ndiv#separate>p {\n  border: thin solid white;\n}\ndiv#separate\
  \ p {\n  padding: 1em;\n}\n```\n\n大于号（`>`）选择器是一个**子代选择器**：它选择作为`div#separate`*子元素*的段落。空格选择器（它看起来根本不像选择器）是一个**后代选择器**：它选择作为`div#separate`*后代*的段落。\n\
  \n在 JavaScript 中，您可以选择子代或后代段落，如下所示：\n\n```javascript\nvar pp = document.querySelectorAll('div#separate>p');\n\
  console.log(pp);            //  子元素\nvar pp = document.querySelectorAll('div#separate\
  \ p');\nconsole.log(pp);            //  后代元素\n```\n\n在此例中，它们是相同的，因为示例中没有其他容器。但是，如果从`div#content`开始，您会看到一个区别：\n\
  \n```javascript\nvar pp = document.querySelectorAll('div#content>p');\nconsole.log(pp);\
  \            //  子元素\nvar pp = document.querySelectorAll('div#content p');\nconsole.log(pp);\
  \            //  后代元素\n```\n\n这是因为`div#separate`位于`div#content`内部。`div#separate`中的段落是`div#content`的后代，但不是其子元素。\n\
  \n当您有一个嵌套列表时，这一点也很明显：\n\n```html\n<ul id=\"children\">\n  <li>Animals</li>\n  <li>Instruments</li>\n\
  \  <li>Fruit</li>\n  <li>\n    <ul>\n      <li>Apple</li>\n      <li>Banana</li>\n\
  \      <li>Cherry</li>\n    </ul>\n  </li>\n</ul>\n```\n\n它看起来像这样：\n\n-   Animals\n\
  -   Instruments\n-   Fruit\n-   Apple\n-   Banana\n-   Cherry\n\n您可以使用以下方法选择列表的不同部分：\n\
  \n```javascript\nvar children = document.querySelectorAll('ul#children>li');\nconsole.log(children);\n\
  var grandchildren = document.querySelectorAll('ul#children>li>ul>li');\nconsole.log(grandchildren);\n\
  var descendants = document.querySelectorAll('ul#children li');\nconsole.log(descendants);\n\
  ```\n\n在所有这些示例中，选择器的第一部分是`ul#main`，它选择主列表。从那里，我们选择列表的各种子元素和后代元素。在第一个示例中，子代选择器（`>`）只会选择直接子元素，即第一级的元素。第三个带有后代选择器（空格）的示例会选择*所有*列表项，包括子元素和孙元素。如果您想专门选择*仅*孙元素，则需要像第二个示例那样使用多个子代选择器。这些是我们将使用的主要选择器，尽管当我们开始在第\
  \ 5 章和第 6 章中处理表单时，我们会看到一些属性选择器的示例。\n\n## 处理多个元素\n\n使用`querySelectorAll()`的结果是一个元素集合，技术上称为**节点列表**。节点列表类似于数组，因为它是一个编号的集合，您可以对其进行迭代。\n\
  \n例如，您可以像之前一样获取该集合：\n\n```javascript\nvar children = document.querySelectorAll('ul#children>li');\n\
  ```\n\n这将集合获取到`children`变量中，与之前一样。有两种主要方法可以遍历编号集合。首先，您可以使用`for()`循环来计数遍历集合。\n\n\
  `for()`循环将使用一个变量来计数集合中的成员，并对每个成员执行操作：\n\n```javascript\nvar children = document.querySelectorAll('ul#children>li');\n\
  for(let i=0; i<children.length; i++) {\n  children[i].textContent = children[i].textContent.toUpperCase();\n\
  \  //  其他处理\n}\n```\n\n`textContent`属性顾名思义，它是元素作为文本的内容。稍后您会看到更多关于`textContent`的内容。`for`结构设置一个计数器（`let\
  \ i=0`），并通过索引`i`引用每个成员来遍历`children`集合。`.toUpperCase()`方法返回原始文本的大写版本。请注意，替换`textContent`会产生一个副作用：将嵌套列表替换为纯文本，不再是一个列表。\n\
  \n第二种方法是较新的方法，使用`.forEach()`方法。要尝试此示例，您可能需要重新加载页面。\n\n```javascript\nvar children\
  \ = document.querySelectorAll('ul#children>li');\nchildren.forEach(child => {\n\
  \  child.textContent = child.textContent.toLowerCase();\n  //  其他处理\n});\n```\n\n\
  使用`.forEach()`，您不需要使用计数器变量。相反，`child`变量直接从集合的每个成员中赋值。这是我们稍后将使用的技术。`.forEach()`方法包含一个函数。该示例使用了所谓的**箭头函数表达式**，这是一种紧凑的形式，适用于定义一次性函数。\n\
  \n## 相关元素\n\n处理 DOM 时，您有时会对附近的元素感兴趣。您之前看到了不同节点之间的关系。以下是您可以访问它们的一些方法列表：\n\n| 节点(s)\
  \ | 任何内容 | 仅元素 |\n| --- | --- | --- |\n| 子节点 | `childNodes` | `children` |\n| 第一个子节点\
  \ | `firstChild` | `firstElementChild` |\n| 最后一个子节点 | `lastChild` | `lastElementChild`\
  \ |\n| 相邻节点 | `nextSibling` `previousSibling` | `nextElementSibling` `previousElementSibling`\
  \ |\n| 父节点 | `parentNode` | `parentElement` |\n\n例如（您可能希望先重新加载页面）：\n\n```javascript\n\
  var list = document.querySelector('ul#children');\nvar item = list.firstElementChild;\
  \  //  获取第一个子元素\nconsole.log(item.textContent);\nitem = item.nextElementSibling;\
  \     //  下一个子元素\nconsole.log(item.textContent);\n```\n\n这些名称清楚地说明了这些方法的作用。前两个方法（`childNodes`和`children`）返回一个集合，而其他方法返回单个结果。上表中前三个方法从父节点开始操作。在这种情况下，它是`ul`无序列表，您将引用其中的`li`项。最后两个方法从子节点开始操作。在这种情况下，它们是`li`列表项，您将引用相邻的同级列表项或父级`ul`列表。\n\
  \n您会注意到有两个版本，这是由于 HTML 工作方式的一个特性所致。从技术上讲，HTML 中元素之间的所有空白，甚至注释，都是 DOM 的一部分。例如，假设您有一个列表和项目：\n\
  \n```html\n<ul>\n  <li>Child</li>\n  <li>Child</li>\n</ul>\n```\n\n缩进、换行和注释都被视为\
  \ DOM 节点。大多数时候，您并不关心这些，只对列表和项目感兴趣，而不必处理额外的空格或注释。额外的空格和注释当然不会出现在渲染的页面中，因此只有查看源代码时才能看到。或者，如果您使用\
  \ JavaScript，也可能看到。在是否应该使用前面第一列属性来包含这些内容方面，浏览器之间存在差异，这在过去造成了麻烦。第二列属性只处理真正的元素，从而解决了这个问题。\n\
  \n例如：\n\n```javascript\nvar ul = document.querySelector('ul#children');\nconsole.log(ul.children);\
  \   //  仅列表项\nconsole.log(ul.childNodes); //  可能包含其他代码\n```\n\n\n## 创建和操作元素\n\n\
  有时，你需要通过操作 DOM 本身的内容来对文档进行更改。例如，你可能要做的第一件事就是创建一个元素：\n\n```\nvar p = document.createElement('p');\n\
  ```\n\n参数是一个字符串，它就是一个简单的 HTML 标签，不带尖括号。你甚至可以自己编造一个：\n\n```\nvar p = document.createElement('thing');\n\
  ```\n\n但不要指望浏览器会知道如何正确显示它。默认情况下，一个编造出来的元素会被显示为内联元素，除非你通过 CSS 更改它。这种技巧曾在尝试让**旧版浏览器**接受更新的\
  \ HTML5 元素时使用过。\n\n此时，新创建的元素没有内容，也没有属性，甚至尚未存在于文档中：它只是漂浮在内存中。稍后，你将看到如何将新元素添加到实际文档中。\n\
  \n### 向元素添加内容\n\n你可以使用多种方法向元素添加内容，无论这个元素是你找到的，还是刚刚创建的。\n\n添加内容最简单的方法是设置其 `textContent`\
  \ 属性：\n\n```\nvar p = document.createElement('p');\np.textContent = '此位招租……';\n\
  ```\n\n还有一个可供选择的属性叫 `innerHTML`，在这种情况下，它会给你相同的结果。然而，区别在于 `innerHTML` 会将内容解释为 HTML。\n\
  \n例如，你可以像下面这样更改主标题的内容：\n\n```\nvar h1 = document.querySelector('h1');\nh1.textContent\
  \ = 'Hello<br/>Goodbye';\n```\n\n在前面的示例中，该标题现在会显示 `Hello<br/>Goodbye`。但是，如果你使用 `innerHTML`：\n\
  \n```\nvar h1 = document.querySelector('h1');\nh1.innerHTML = 'Hello<br/>Goodbye';\n\
  ```\n\n字符串中的 `<br/>` 会被解释为 HTML 换行符，你将看到两行文本。\n\n通常，除非你真的需要额外的 HTML，否则使用 `textContent`\
  \ 更安全。\n\n还有一个名为 `innerText` 的属性，它有一段复杂的演变史。最初，它是一个只有 Internet Explorer 支持的非官方属性，而其他浏览器只支持官方的\
  \ `textContent` 属性。如今，所有现代浏览器都支持这两个属性。但是，两者之间有一个细微的差别，这使得 `textContent` 是更受青睐的属性。\n\
  \n### 添加其他属性\n\n你还可以将属性作为 JavaScript 属性来添加。例如，你可以像下面这样创建一个图像元素：\n\n```\nvar img\
  \ = document.createElement('img');    //  创建图像\nimg.src = 'https://pure-javascript.net/random.jpg';\
  \ //  src=\"...\"\nimg.alt = '随机图像';                   //  alt=\"...\"\n```\n\n\
  记住，你还不能真正看到这个图像。它稍后需要被添加到文档中。\n\n有两个你可能特意添加的属性，特别是为了 CSS 的便利：\n\n```\nimg.id = 'something';\
  \           //  id=\"...\"\nimg.classList.add('whatever');  //  class=\"...\"\n\
  img.className = 'whatever';     //  较旧的替代方法\n```\n\n请注意，在大多数情况下，JavaScript 的属性名称与\
  \ HTML 属性相同，但 `class` 属性并不完全匹配，因为 `class` 这个词是 JavaScript 中的保留字。\n\n有两种方法可以向元素添加类：\n\
  \n* 较旧的 `className` 属性会用单个类替换任何现有的类，因此它仅适用于非常简单的情况。\n* 较新的 `classList` 方法操作的是一个类集合，你可以对其添加、移除，甚至切换（根据类是否已存在来决定添加或移除）。\n\
  \n所有上述内容也适用于你通过 `querySelector()` 或 `querySelectorAll()` 找到的现有元素。\n\n### 将元素放入文档\n\
  \n如果你不把图像放到文档的某个位置，那么之前所做的一切都是徒劳。传统方法涉及 JavaScript 节点函数，例如 `insertBefore()` 和 `appendChild()`。现在有一些函数可以简化和统一这个过程。\n\
  \n首先，你需要找到一个现有的元素，新元素将放置在它附近。然后，相对于该现有元素，你有四个位置可选：\n\n* `existingElement.before(newElement)`：外部，在现有元素之前\n\
  * `existingElement.prepend(newElement)`：内部，在现有元素的开头\n* `existingElement.append(newElement)`：内部，在现有元素的末尾\n\
  * `existingElement.after(newElement)`：外部，在现有元素之后\n\n图 3-3 展示了这些函数的具体含义。\n\n![](img/609513_1_En_3_Fig3_HTML.jpg)\n\
  \n一个矩形说明了元素的放置方式。外部矩形分别在顶部和底部包括了“之前”和“之后”。内部矩形在顶部和底部则分别有“开头插入”和“末尾追加”。\n\n**图 3-3**\
  \ 放置元素\n\n函数 `before()` 和 `after()` 的语法在英语中听起来有些别扭。表达式 `apple.before(banana)` 被解读为“对于\
  \ `apple`，将 `banana` 放在它之前”，这与初看时的理解可能正好相反。所有这四个提到的函数都以现有元素开头。\n\n如果你查看现有代码，可能会经常看到\
  \ `appendChild()` 函数。它几乎与较新的 `append()` 函数相同。两者有一些区别，但大多数情况下，你可以任选其一使用。\n\n例如，要在现有标题之后添加一个新图像，你可以这样写：\n\
  \n```\nvar h1 = document.querySelector('h1');\nvar img = document.createElement('img');\n\
  img.src = 'https://pure-javascript.net/random.jpg';\nimg.alt = '随机图像';\nh1.after(img);\n\
  ```\n\n还有一个可选的单一函数，它可以通过一个包含位置的额外参数来实现上述所有四个函数的功能：`existingElement.insertAdjacentElement(position,\
  \ newElement)`。位置是以下值之一：\n\n* `'beforebegin'`：外部，在容器之前\n* `'afterbegin'`：内部，在容器的开头\n\
  * `'beforeend'`：内部，在容器的末尾\n* `'afterend'`：外部，在容器之后\n\n图 3-4 展示了这些位置。\n\n![](img/609513_1_En_3_Fig4_HTML.jpg)\n\
  \n一个矩形代表了元素的相邻位置。外部矩形分别在顶部和底部包括了“开始之前”和“结束之后”。内部矩形的顶部和底部则分别是“开始之后”和“结束之前”。\n\n**图\
  \ 3-4** 插入相邻元素\n\n使用这个函数，你可以这样写：\n\n```\nvar h1 = document.querySelector('h1');\n\
  var img = document.createElement('img');\nimg.src = 'https://pure-javascript.net/random.jpg';\n\
  img.alt = '随机图像';\nh1.insertAdjacentElement('afterend', img);\n```\n\n这当然不算更方便，但它可能符合你对模式感的追求。\n\
  \n### 直接添加 HTML\n\n如果你创建一个元素只是为了直接将其添加到 DOM 中，你可以使用 `insertAdjacentHTML(position,\
  \ html)` 这个快捷方式。该函数接受与 `insertAdjacentElement` 相同的位置值，但允许你使用 HTML 字符串来创建元素。对于以下示例，你可以使用相同的\
  \ `src` 和 `alt` 值：\n\n```\nvar h1 = document.querySelector('h1');\nvar html = '<img\
  \ src=\"https://pure-javascript.net/random.jpg\" alt=\"随机图像\">';\nh1.insertAdjacentHTML('afterend',\
  \ html);\n```\n\n当然，你不需要 `html` 这个变量：\n\n```\nvar h1 = document.querySelector('h1');\n\
  h1.insertAdjacentHTML('afterend', '<img src=\"https://pure-javascript.net/random.jpg\"\
  \ alt=\"随机图像\">');\n```\n\n……甚至在这种情况下，连 `h1` 变量也不需要：\n\n```\ndocument.querySelector('h1')\n\
  .insertAdjacentHTML('afterend', '<img src=\"https://pure-javascript.net/random.jpg\"\
  \ alt=\"随机图像\">');\n```\n\n\n\n### 但这开始变得难以管理了。\n\n请注意，只有在后续的 JavaScript 代码中无需引用新元素时，使用`insertAdjacentHTML()`才有用，因为你没有获得新元素的引用。\n\
  \n### 添加更复杂的内容\n\n到目前为止，我们一直在讨论创建一两个元素。使用`innerHTML`或`insertAdjacentHTML()`，你可以同样轻松地插入多个元素，例如这个包含多个条目的列表：\n\
  \n```\nvar h1 = document.querySelector('h1');\nvar ul = 'onezweitrois';\nh1.insertAdjacentHTML('afterend',\
  \ ul);\n```\n\n如你所知，JavaScript 有一种新的字符串字面量类型，即**模板字面量**。我们主要用它通过`${...}`符号来插值。然而，它的另一个特性是这种字符串字面量可以跨越多行编写：\n\
  \n```\nvar h1 = document.querySelector('h1');\nvar ul =\n`\none\nzwei\ntrois\n`;\n\
  h1.insertAdjacentHTML('afterend', ul);\n```\n\n由于该字符串被视作 HTML，额外的间距和换行符在 HTML 中会被忽略，因此这些间距不会对结果产生任何影响。不过，它可能会让代码更易于阅读，而在其他情况下，间距和换行符则意义重大。\n\
  \n和之前一样，如果你只想添加元素，HTML 字符串就足够了，但你无法获得对它们的引用。另一方面，如果你需要在后续的 JavaScript 中引用它们，就必须逐个创建元素：\n\
  \n```\nvar h1 = document.querySelector('h1');\nvar heading = document.createElement('h2');\n\
  var message = document.createElement('p');\nh1.insertAdjacentElement('afterend',\
  \ message);\nh1.insertAdjacentElement('afterend', heading);\nheading.textContent\
  \ = 'Message';\nmessage.textContent = `The Time is ${new Date()}`;\n```\n\n在示例代码中，给标题和段落赋予更有意义的名称是合理的，因为代码稍后会在脚本中为它们分配内容。请注意，元素是按相反顺序添加的，因为它们是在`h1`元素之后立即插入的。在下一章\
  \ 4 的幻灯片项目中，我们就会做这类事情。\n\n## 总结\n\n在本章中，我们研究了操作网页的一些技术。\n\n### 文档对象模型\n\n浏览器获取页面的\
  \ HTML 并将其渲染成文档。同时，它会生成一个名为文档对象模型的内部模型。DOM 以树状结构表示，以反映 HTML 的层级性质。JavaScript 包含许多用于导航和操作\
  \ DOM 的函数。可以通过添加或移除元素，以及更改单个元素来修改 DOM。\n\n### 查找元素\n\n有许多函数可用于在 DOM 中查找现有元素。其中一些函数已经存在了一段时间。现代浏览器都支持较新的函数`querySelector()`和`querySelectorAll()`，这极大地简化了定位元素的过程。这些函数使用\
  \ CSS 选择器来描述你要查找的元素。一旦定位到元素，就有函数用于引用 DOM 树中其他附近的元素：父元素、兄弟元素和子元素。\n\n### 多个元素\n\n\
  有些函数，特别是`querySelectorAll()`，会返回一个元素集合，即使该集合为空或只有一个成员。要处理一个集合，你可以使用经典的`for( ...\
  \ ; ... ; ... )`循环，或者使用更现代的`forEach()`函数来遍历这些元素。\n\n### 创建元素\n\nJavaScript 也可以创建新元素。你甚至可以创建在\
  \ HTML 中没有意义的元素，只要你不期望浏览器知道下一步该做什么。对于新创建的元素，你可以添加内容和属性，这些属性与 HTML 属性相匹配。使用相同的方法，你也可以对之前找到的现有元素执行此操作。新元素需要使用众多函数之一添加到\
  \ DOM 中。这些函数会将一个元素放置在另一个现有元素附近。你也可以直接添加 HTML，要么使用`innerHTML`添加到现有元素，要么使用`insertAdjacentHTML()`在创建新元素时添加。\n\
  \n### 接下来\n\n我们已经了解了如何使用 JavaScript 来更改网页。在下一章中，我们将应用这些知识来创建图像幻灯片。在下一个项目中，我们将研究如何向页面添加额外的元素、更改现有元素的行为以及与\
  \ CSS 样式交互。我们还将学习如何处理 JavaScript 数组和对象。最后，我们将学习 JavaScript 如何响应键盘和鼠标事件。\n\n## 4.\
  \ 创建幻灯片\n\n在这个项目中，我们将构建一个简单的图像幻灯片。该幻灯片将以预定义的速率循环播放一组预定义的图像。你可以通过鼠标和键盘来启动和停止它。在 `images`\
  \ 文件夹中有一个 `slides` 文件夹，`slides` 文件夹中包含一组图像文件，它们都已准备好用于幻灯片展示。\n\n幻灯片页面将类似于图 4-1。\n\
  \n![](img/609513_1_En_4_Fig1_HTML.jpg)\n\n幻灯片页面的屏幕截图。\n\n图 4-1 图像幻灯片\n\n幻灯片通过定期更改主图像的\
  \ `src` 属性来工作。\n\n在这个项目中，我们将掌握以下技术：\n\n*   定位元素\n*   数组\n*   拆分字符串以创建数组\n*   预加载图像\n\
  *   取模运算\n*   更改 HTML 元素的属性\n*   响应用户事件\n*   使用定时器函数\n\n稍后你将看到的一件事是使用 CSS 实现某些动画效果。CSS\
  \ 是定义 HTML 元素*外观*的编码语言，你可以使用 JavaScript 创建并应用额外的 CSS。如果你熟悉 CSS，那会很有帮助，但并非必需；你只需要一点信心就好。只需知道现代\
  \ CSS 可用于各种动画技巧，而这些技巧曾经依赖于额外的 JavaScript。这让你可以自由地专注于实现项目的逻辑，让 CSS 处理视觉方面。\n\n##\
  \ 幻灯片概述\n\nHTML 的 `img` 元素定义了要显示的图像。通常，它采用以下形式：\n\n```\n`src` 属性是实际图像的 URL。\n```\n\
  \nHTML 实际上并不包含图像，而是告诉浏览器从哪里获取它。通常，图像位于网站本地，但如果 URL 包含 `http://` 或 `https://` 协议，则它可以是远程图像。当浏览器遇到\
  \ `img` 标签时，它会发出一个请求，请求 `src` 属性中引用的图像。通常获取图像需要一些时间，因此浏览器会继续处理其余的 HTML。当图像从服务器到达时，浏览器会将其显示在为其保留的空间中。如果图像无法显示——例如原始图像丢失、加载时间过长，或者用户有视觉障碍并依赖文本——那么浏览器将改用\
  \ `alt` 文本。\n\n还有另外三个常见属性：\n\n\n\n# Markdown 排版后的内容\n\n`title`是当鼠标悬停在图片上时可能显示的附加文本；它也有助于搜索引擎描述图片。`width`和`height`属性有助于浏览器在等待图片加载时为其创建合适的空间。它们也可以用于调整图片大小。\n\
  \n我们的幻灯片将通过更改`src`属性的值来循环显示一组图片，从而使浏览器重新加载新图片。\n\n整个幻灯片将包含在以下结构中：\n\n`div`元素是一个通用的块级容器。它通常用于布局。使用\
  \ CSS，使`div`看起来像一个图片容器。\n\n## 准备 HTML\n\n对于脚本编写，需要两个 JavaScript 链接：\n\n```\nSlide\
  \ Show\n...\n```\n\n与其他项目一样，`slideshow.js`文件将包含主要代码。然而，实际运行幻灯片的代码是你可能希望在其它项目中使用的代码；你在本书后面的幻灯片变体中也肯定会用到它。因此，这段代码将被放在`library.js`文件中以便重用。\n\
  \n另请注意，`library`文件不需要`defer`属性，因为它不会在页面加载时干扰或依赖于页面。\n\n对于这个项目，你最好像引言中讨论的那样运行某种网络服务器。如果你直接在网页浏览器中加载文件，你应该移除`crossorigin=\"\
  anonymous\"`部分。\n\n## JavaScript 大纲\n\n为了方便起见，已经有一个名为`slideshow.js`的文件。它目前只包含标题块注释。\n\
  \n在此基础上，我们从主要的 JavaScript 大纲开始：\n\n```\n/*  Slide Show\n================================================\n\
  ================================================ */\n'use strict';\nwindow.onerror\
  \ = function(message, url, line) {\nalert(`Error: ${message}\\n${url}: ${line}`);\n\
  };\ninit();\nfunction init() {\n}\n```\n\n在`library`文件中，我们可以添加一个函数来完成所有繁重的工作。这个函数需要被赋予图片集合以及放置它们的位置：\n\
  \n```\n/*  doSlides(images, containerSelector)\n================================================\n\
  Turns a container element into an slide show\nwith a collection of images.\n================================================\
  \ */\nfunction doSlides(images, containerSelector) {\n}\n```\n\n`images`参数将是一个图片集合，而`containerSelector`参数将是图片*容器*的选择器字符串；在这种情况下，容器是`div`元素。\n\
  \n## 图片数组\n\n当我们谈论集合时，通常指的是**数组**，它是一个带编号的集合。数组的一个例子是：\n\n```\n»   var fruit = ['apple',\
  \ 'banana', 'cherry', 'date'];\n```\n\n每个项目的编号被称为其**索引**。在 JavaScript 中，索引从`0`开始，因此上面显示的索引是`0`、`1`、`2`和`3`。\n\
  \n你需要知道的一件事是有多少项目。在 JavaScript 中，这是数组的`length`属性：\n\n```\n»   console.log(fruit.length);\n\
  ```\n\n请注意，由于索引从`0`开始，所以长度*比*最后一个索引*大一*。\n\n对于我们的项目，我们将使用一个图片名称的数组。我们将把它放到`slideshow.js`文件中的`init()`函数里。然后，我们将该变量发送给`doSlides()`函数。\n\
  \n```\nfunction init() {\nlet images = [\n'bamboo.jpg', 'bird.jpg', 'bromeliad.jpg',\n\
  'bush-panorama.jpg', 'canal.jpg', 'church.jpg',\n'cityscape.jpg', 'emu.jpg', 'gum-nuts.jpg',\n\
  'hanging-rock.jpg', 'hut.jpg', 'koala.jpg',\n'kookaburra.jpg', 'lake.jpg', 'lantern.jpg',\n\
  'light-house.jpg', 'lorikeet.jpg', 'mountain-panorama.jpg',\n'rocks.jpg', 'rose.jpg',\
  \ 'steps.jpg',\n'sunset.jpg', 'tall-trees.jpg', 'tea-leaf.jpg',\n'train.jpg','waterfall.jpg'\n\
  ];\n}\n```\n\n图片很多，我们不得不将列表写成多行。在某些情况下，每行写一个项目可能更有意义。如果你不想手动输入，这个数组有一个代码片段。\n\n\
  当然，这并不是真正的图片集合。它是一个文件名的集合，我们需要在后面的代码中通过将`images/slides/`文件夹添加到文件名中，并将其放入`src`属性中，将其转换为实际的图片。\n\
  \n你可能会认为让 JavaScript 管理如此大的集合风险太大或不便。稍后，我们将学习 JavaScript 如何使用 Ajax 从外部文件读取此列表。\n\
  \n使用这个集合，你将在`library`中调用`doSlides()`函数，为其提供图片集合和对容器的引用：\n\n```\n//  slideshow.js\n\
  function init() {\nlet images = [...];\ndoSlides(images, 'div#slides');\n}\n```\n\
  \n`div#slides`字符串与 CSS 选择器相同，意思是“`id`为`slides`的`div`”。然后，JavaScript 将使用此字符串在`document.querySelector()`函数中定位实际的元素。\n\
  \n## 填充图片\n\n目前，`img`元素是空的，因为没有有效的`src`值。我们将在代码中更改这一点。\n\n首先，你需要实际获取容器元素以及内部的`img`元素：\n\
  \n```\n//  library.js\nfunction doSlides(images, containerSelector) {\n//  Elements\n\
  let container = document.querySelector(containerSelector);\nlet img = container.querySelector('img');\n\
  }\n```\n\n`container`变量将引用包含`div`元素，这对于幻灯片更复杂的部分很重要。`img`变量将引用实际的`img`元素，我们将设置其`src`属性。\n\
  \n通常，你会使用`document.querySelector()`来定位元素，就像我们对`container`元素所做的那样。这会在整个文档中搜索第一个匹配项。但是，你也可以将搜索限制在特定元素内部，就像我们对`img`元素所做的那样：`container.querySelector()`将只在`container`元素内部搜索。这不仅稍微快一些，因为\
  \ JavaScript 不必在错误的位置查找，而且还会忽略我们不感兴趣的其他`img`元素。\n\n填充图片就是设置`img`元素的`src`属性。我们可以用一个特定的图片来尝试：\n\
  \n```\nfunction doSlides(images, containerSelector) {\n//  Elements\nlet container\
  \ = document.querySelector(containerSelector);\nlet img = container.querySelector('img');\n\
  img.src = 'images/slides/bamboo.jpg';\n}\n```\n\n由于`images`数组只有文件名，我们添加了这些图片相对于网站根目录的路径。这使得代码更加灵活，因为我们可以轻松更改图片的位置，而无需更改集合本身。\n\
  \n如果你重新加载页面，你应该能看到图片。\n\n因为我们有整个图片集合，所以应该使用数组中的其中一个：\n\n```\nfunction doSlides(images,\
  \ containerSelector) {\n//  Elements\nlet container = document.querySelector(containerSelector);\n\
  let img = container.querySelector('img');\nimg.src = `images/slides/${images[0]}`;\
  \ //  ← backticks\n}\n```\n\n注意不同的引号（`` ` ... ` ``），即所谓的反引号。这种字符串类型被称为**模板字面量**。对于普通文本，其效果与单引号或双引号相同，但模板字面量允许你在`${...}`语法中嵌入值和计算。\n\
  \n这里，我们硬编码了路径，但插入了实际的图片文件名。\n\n如果你重新加载页面，你应该能看到相同的图片。至少你会看到它是有效的。\n\n当然，你会希望为每个新图片重复设置`img.src`，所以最好将其放在一个函数内。\n\
  \n\n\n```javascript\nfunction doSlides(images, containerSelector) {\n  //  元素\n\
  \  let container = document.querySelector(containerSelector);\n  let img = container.querySelector('img');\n\
  \  next();\n  function next() {\n    //  填充图片\n    img.src = `images/slides/${images[0]}`;\n\
  \  }\n}\n```\n\n将其放入函数后，你就可以重复调用这段代码。你还可以延迟一小段时间再调用它：\n\n```javascript\nfunction\
  \ doSlides(images, containerSelector) {\n  ...\n  setTimeout(next, 3000);\n  //\
  \  next();\n  ...\n}\n```\n\n`setTimeout()` 函数接收一个要调用的函数引用（`next`）和等待的毫秒数（`3000`）。你有时也可能会看到它写作\
  \ `windows.setTimeout()`。这里，我们等待了三秒才调用该函数。现在，如果你重新加载页面，图片将在三秒后出现。请注意，函数的*引用*是 `next`，不带括号。如果你想要函数的*结果*，则需要使用括号（`next()`）。在这里，我们不需要结果，只需要函数本身。\n\
  \n当然，`next()` 函数仍然是硬编码显示第一张图片（索引 `0`）。要遍历图片集合，你需要：\n\n- 设置一个索引变量。我们将使用变量 `slideNumber`，并在一个新的“变量”部分中设置它。\n\
  - 使用该变量。这将替换 `images` 数组中的索引 `0`。\n- 递增变量的值。我们可以使用递增运算符来实现：`slideNumber++`。\n- 重复调用该函数。`setTimeout()`\
  \ 函数在延迟后*仅*调用 `next` 函数*一次*。这就是为什么你访问网站后一小段时间会弹出恼人对话框的原因。要重复调用该函数，你需要将其替换为 `setInterval()`。\n\
  \n```javascript\nfunction doSlides(images, containerSelector) {\n  //  元素\n  let\
  \ container = document.querySelector(containerSelector);\n  let img = container.querySelector('img');\n\
  \  //  变量\n  let slideNumber = 0;\n  //  setTimeout(next, 3000);\n  setInterval(next,\
  \ 3000);\n  //  next()\n  function next() {\n    //  填充图片\n    img.src = `images/slides/${images[slideNumber]}`;\n\
  \    slideNumber++;\n  }\n}\n```\n\n表达式 `slideNumber++` 比使用 `slideNumber = slideNumber\
  \ + 1` 更方便，如果将其与前一个表达式结合使用，则*更加*方便：\n\n```javascript\nfunction next() {\n  //  填充图片\n\
  \  img.src = `images/slides/${images[slideNumber++]}`;\n}\n```\n\n在这个表达式中，`slideNumber++`\
  \ 被称为**后递增**运算符，因为变量是在其值被使用*之后*才递增的。**前递增**运算符 `++slideNumber` 则会在变量值被使用之前就递增它。还有**递减**运算符（`--`）。如果你运行这个版本，它可以工作，但你最终会看到一个新问题。（如果“最终”等待时间太长，你可以将延迟缩短到，比如\
  \ 1000，以便更快地看到问题。）代码会一直执行到超出数组末尾。`slideNumber` 的值会不断递增，超过数组的上限，因此从那里开始你会得到 `undefined`。你实际上看不到\
  \ `undefined`，但你会看到图片现在缺失了。\n\n这需要在到达末尾时重置 `slideNumber`：\n\n```javascript\nfunction\
  \ next() {\n  //  填充图片\n  img.src = `images/slides/${images[slideNumber++]}`;\n\
  \  //  循环播放\n  if (slideNumber >= images.length) slideNumber = 0;\n}\n```\n\n请记住，数组的\
  \ `length` 比最后一个索引*大*1，因此当你达到该值（`slideNumber == images.length`）时，你已经越界了。作为一种策略，你应该始终检查是否已经越界得更远（`slideNumber\
  \ >= images.length`），以防你之前错过了它。例如，你已经知道，重复添加 `0.1` 并不总能得到一个简单的结果。这可以实现功能，但有两个改进你可以轻松做到。首先，在第一张图片显示之前有一个延迟；其次，幻灯片之间的延迟应该更具可配置性。\n\
  \n## 显示第一张幻灯片\n\n`setInterval()` 函数会等到延迟结束后才调用 `next()` 函数。你可以通过在开始时调用 `next()`\
  \ 函数来立即显示第一张幻灯片：\n\n```javascript\nfunction doSlides(images, containerSelector)\
  \ {\n  ...\n  setInterval(next, 3000);\n  next();\n  ...\n}\n```\n\n现在，这将从第一张幻灯片开始，后续幻灯片循环播放。\n\
  \n## 更改延迟\n\n作为一项原则，你不应该在代码中间硬编码任意值。最好尽早在一个变量中设置该值。在这种情况下，延迟的实际值对代码逻辑并不重要，因此我们将其放在一个函数参数中，让调用代码来决定它应该是什么。\n\
  \n在主代码中，将延迟作为附加参数包含在内：\n\n```javascript\n//  slideshow.js\nfunction init() {\n \
  \ let images = [...];\n  doSlides(images, 'div#slides', 3000);\n}\n```\n\n在 JavaScript\
  \ 中，包含函数未期望的额外函数参数并不是错误。这与其他大多数编程语言不同。这意味着，如果你在不做任何其他更改的情况下尝试这段代码，它可以工作：`doSlides()`\
  \ 函数将简单地忽略这个额外值。\n\n当然，额外的值不是用来被忽略的，因此在库函数中，包含一个额外的参数变量：\n\n```javascript\n//  library.js\n\
  function doSlides(images, containerSelector, delay=3000) {\n  ...\n}\n```\n\n第三个参数包含一个默认值：如果调用函数省略了第三个参数，则使用此值。这确保了旧行为仍然不变，因为最初第三个参数不是必需的。当对函数进行改进时，你应该始终尝试保持与早期版本的行为兼容性。在这里，我们包含了默认值，这样即使没有添加额外的参数，它的工作方式仍与以前相同。显然，在这种情况下，`slideShow()`\
  \ 函数仍在开发中，所以无需担心兼容性问题。不过，我们还是走了一遍这个过程以阐明这一点。\n\n最后，在 `setInterval()` 函数中使用变量而不是硬编码的值：\n\
  \n```javascript\nfunction doSlides(images, containerSelector, delay=3000) {\n  ...\n\
  \  setInterval(next, delay);\n  next();\n  ...\n}\n```\n\n为了测试目的，你可以通过使用较短的延迟值来加快幻灯片播放，例如使用\
  \ `doSlides(images, 'div#slides', 1000);` 或更短。\n\n## 停止和启动幻灯片播放\n\n你可能已经对幻灯片播放开始感到厌烦了。如果你让用户忍受不可停止的动画，就像过去的动态\
  \ `gif` 那样，这肯定会惹恼用户。你至少可以做到的是让用户有机会暂停幻灯片播放，这比强迫用户前往其他网站要好得多。虽然你可以编写代码在鼠标悬停在图片上时暂停幻灯片播放，但这并不是最自然的方法。最好提供一个按钮来暂停。同一个按钮也将恢复幻灯片播放。一个在两种状态（运行和暂停）之间切换的按钮通常被称为**切换开关**。稍后，我们将使用\
  \ JavaScript 添加一个真正的按钮。现在，我们可以使用图片本身作为一个按钮。\n\n要实现一个切换开关，我们将采取以下步骤：\n\n- 创建一个变量来保存当前状态。\n\
  - 创建一个函数，根据当前状态暂停或恢复幻灯片播放。\n\n\n\n# 排版后的文本\n\n设置函数以响应图片的点击事件。\n\n## 状态变量\n\n首先，我们将添加一个新变量\
  \ `running`：\n\n```\nfunction doSlides(images, containerSelector, delay=3000) {\n\
  //  元素\n...\n//  变量\nlet slideNumber = 0;\nlet running;    //  未定义\n...\n}\n```\n\
  \nJavaScript 中的所有变量在诞生之初都会被赋予一个特殊值 `undefined`。这个词语容易让人困惑，因为它并不意味着该变量是*未定义的*。`undefined`\
  \ 是一个特殊值，用于表示你尚未给变量赋值。其他编程语言没有这个特殊值，如果你在变量被赋予实际值之前尝试使用它，这些语言会报错。\n\n要设置状态变量，请将 `setInterval()`\
  \ 函数的返回值赋值给它：\n\n```\nfunction doSlides(images, containerSelector, delay=3000) {\n\
  ...\nrunning = setInterval(next, delay);\nnext();\n...\n}\n```\n\n在 JavaScript 中，所有函数都会返回一个值。如果没有特定的\
  \ `return` 语句，函数将返回 `undefined`。你可以使用这个返回值（例如将其赋值给一个变量），也可以像我们之前做的那样完全忽略返回值。`setInterval()`\
  \ 原则上可用于多个函数。每次调用都会创建一个所谓的“定时器”。`setInterval()` 的返回值是 `intervalID`，即对新创建定时器的引用。这是为了让你在需要时能够清除该定时器——这正是我们暂停幻灯片播放的方式。我们之前使用的\
  \ `setTimeout()` 函数也以相同方式工作，你可以使用其返回值来取消一个延迟的函数调用。\n\n## 切换函数\n\n由于我们预计会多次停止和启动幻灯片播放，因此不再适合在开始时立即启动一次。相反，我们应该将这个流程封装在另一个函数中，并在需要时调用该函数。在本例中，我们将其命名为\
  \ `toggle()` 函数：\n\n```\nfunction doSlides(images, containerSelector, delay=3000)\
  \ {\n...\n//  setInterval 已被移动到 toggle() 内部：\nnext();\nfunction toggle() {\nrunning\
  \ = setInterval(next, delay);\nnext();\n}\nfunction next() {\n...\n}\n}\n```\n\n\
  从技术上讲，并不需要在 `next()` 函数*之前*定义 `toggle()` 函数；JavaScript 会在实际运行代码之前处理所有函数定义。即使你决定*在之后*定义它，这也没有影响。但在控制台中编写代码时情况并非如此。由于控制台无法预知你接下来要输入什么，你需要先定义所有将要引用的内容。\n\
  \n`toggle()` 函数的作用是：如果幻灯片尚未播放则启动它，如果正在播放则停止它。这需要使用 `if ... else` 语句：\n\n```\nfunction\
  \ toggle() {\nif(!running) {\nrunning = setInterval(next, delay);\nnext();\n}\n\
  else {\n}\n}\n```\n\n请记住，`if()` 不仅会测试`true`值，还会测试“有值”的情况，例如非零数字或非空字符串。特殊的 `undefined`\
  \ 值绝对算作“无值”，因此 `!running` 会测试 `running` 是否为 `undefined`。\n\n要停止幻灯片播放，你可以使用 `clearInterval()`\
  \ 函数，该函数将之前保存的定时器 ID 作为参数。你还必须重置 `running` 的值以供下次使用。\n\n```\nfunction toggle() {\n\
  if(!running) {\n...\n}\nelse {\nclearInterval(running);\nrunning = undefined;\n\
  }\n}\n```\n\n事实证明，`clearInterval()` 函数会返回 `undefined`。我们可以利用这一点，将其返回值直接赋值给 `running`\
  \ 变量：\n\n```\nfunction toggle() {\nif(!running) {\n...\n}\nelse {\nrunning = clearInterval(running);\n\
  }\n}\n```\n\n此时，如果你测试代码，会发现点击图片不会产生任何效果。\n\n## 点击图片\n\n现在，我们将让点击图片来暂停或继续幻灯片播放，实际上就是将图片变成一个大的按钮。用户的动作，例如鼠标点击或键入字符，被称为**事件**。响应事件的代码被称为**事件监听器**。事件监听器总是一个函数。在这里，我们将\
  \ `toggle` 函数作为 `img` 元素的事件监听器。\n\n设置事件监听器通常有两种方法。经典方法是直接设置某个事件监听属性：\n\n```\nfunction\
  \ doSlides(images, containerSelector, delay=3000) {\n...\nimg.onclick = toggle;\n\
  next();\n...\n}\n```\n\n如果你尝试这样做，幻灯片播放将不会立即开始，因为它现在正在等待你点击图片。`onclick` 事件监听器属性会在你点击该元素（或在触摸屏上触摸该元素）时触发。再次提醒，使用\
  \ `toggle` 函数时不要加括号，因为你是在引用该函数，而（尚）未调用它。请克制住将属性拼写为 `onClick` 的冲动。JavaScript 会接受这个赋值，但由于名称是区分大小写的，它不会对\
  \ `click` 事件做出反应。同样的情况也适用于 `onlick`，这是一个极其常见的拼写错误。还有许多其他可用的事件监听属性，例如 `.onmouseover`\
  \ 用于检测鼠标悬停在元素上，或 `.onkeyup` 用于检测键盘活动。\n\n以这种方式添加事件监听器很简单，但它有一些缺点：\n\n*   这种方式只能添加一个事件监听器。\n\
  *   如果该元素位于另一个带有事件监听器的元素内部，你无法控制哪个事件先触发。\n*   某些（较新的）事件类型没有像 `onclick` 这样简单的事件监听属性。\n\
  \n一种更新、更全面的方法是使用 `addEventListener()` 函数：\n\n```\nfunction doSlides(images, containerSelector,\
  \ delay=3000) {\n...\nimg.addEventListener('click', toggle);\nnext();\n...\n}\n\
  ```\n\n在这种情况下，使用 `.onclick` 属性并没有什么特别的缺点，许多 JavaScript 开发者可能更喜欢 `.onclick` 方法。但在这里，我们将使用更新的方法，以备将来需要其灵活性。`addEventListener()`\
  \ 函数还可以带有额外的选项来控制其行为。这里还有另一个关于拼写的要点。实际的事件类型叫做 `click`，这就是你在 `addEventListener()`\
  \ 函数中输入的内容。而事件监听器*属性*则叫做 `.onclick`。再次强调，你不能搞错拼写。\n\n此时，幻灯片播放会通过调用 `next()` 函数加载第一张图片。然后它将等待用户点击图片来启动播放。如果你希望它立即开始，可以将\
  \ `next()` 函数调用替换为 `toggle()`：\n\n```\nfunction doSlides(images, containerSelector,\
  \ delay=3000) {\n...\nimg.addEventListener('click', toggle);\n//  next();     //\
  \  等待用户启动\ntoggle();       //  立即启动\n...\n}\n```\n\n在这里，`next()` 函数调用被注释掉了，而不是删除掉。这样，就可以很容易地在两种行为之间进行选择。\n\
  \n### 预加载图片\n\n你可能正在自己的电脑上测试所有这些功能，因此不会感受到通过互联网加载时的任何延迟。在实际应用中，用户最初会因浏览器获取下一张图片而经历一次额外的暂停。不过，这种暂停在第一轮之后就消失了。\n\
  \n造成这种行为的原因如下：\n\n*   首先，图片通过互联网传输需要一点时间。\n*   为了消除后续等待，浏览器会将图片的副本保存在一个称为**缓存**的本地区域。*下一次*需要同一张图片时，它将从缓存中获取，因此你不会再遇到同样的暂停。\n\
  \n\n\n### 消除首次等待图像的技巧  \n如果你想消除首次加载图像时的等待时间，技巧是在需要图像之前就提前获取它，这样它就能被添加到缓存中，供后续使用。这种方法被称为**预取**（`prefetch`）。\n\
  \n要预取图像，我们首先创建一个图像对象。该对象不会被显示，仅存在于内存中。当我们显示一张图像时，也会用数组中的下一张图像填充这个新对象。当用户查看当前图像时，加载图像的延迟就会被吸收。\n\
  \n---\n\n### 创建图像对象  \n为了创建一个新的图像对象，我们调用一个名为`Image()`的特殊函数：\n\n```javascript\nfunction\
  \ doSlides(images, containerSelector, delay=3000) {\n  //  元素\n  // ...\n  let prefetch\
  \ = new Image();\n  // ...\n}\n```\n\n`Image()`函数被称为**构造函数**，用于创建一个**对象**。对象是数据的封装包。有许多内置的构造函数，例如`Date()`用于创建处理日期和时间的对象。你也可以创建自己的构造函数来定义自定义对象。\n\
  \n构造函数通过特殊的`new`关键字调用。通常，圆括号内会包含额外的参数来帮助设置对象。如果没有参数需要提供，你可以省略括号直接调用构造函数：`let prefetch\
  \ = new Image;`。此外，还有一些用于创建对象的函数不是构造函数，例如稍后会遇到的`createElement()`。它们有自己的创建对象的方式。\n\
  \n---\n\n### 设置`src`属性  \n与此同时，`prefetch`对象将作为虚拟图像仅存在于内存中。我们想对它做的唯一操作就是设置它的`src`属性，以强制浏览器加载另一张图像。这部分操作位于`next()`函数内部：\n\
  \n```javascript\nfunction next() {\n  //  填充当前图像\n  img.src = `images/slides/${images[slideNumber++]}`;\n\
  \  //  循环播放\n  if(slideNumber >= images.length) slideNumber = 0;\n  //  预取\n  prefetch.src\
  \ = `images/slides/${images[slideNumber]}`;\n}\n```\n\n这里，你首先递增幻灯片编号（`slideNumber++`），然后使用这个新值来填充`prefetch`。如果你在复制粘贴代码，请记住**不要**再次递增`slideNumber`。\n\
  \n---\n\n## 向文档添加按钮  \n通过点击图像来暂停幻灯片播放是可行的，但你可能会觉得应该有一个真正的按钮。此时，你需要做一个设计决策。  \n一个好的\
  \ JavaScript 脚本应尽可能不引人注目，并尽量减少对 HTML 的依赖。HTML 已经为图像提供了一个容器，但不应要求它提供更多内容，例如额外的按钮。你甚至可以考虑让\
  \ HTML 提供更少的内容。\n\n我们不会在 HTML 中定义按钮，而是使用 JavaScript 创建一个按钮，并将其插入到合适的位置。我们还将通过 JavaScript\
  \ 来设置它的文本。\n\n### 创建按钮元素  \n首先，使用`document.createElement()`创建一个`button`元素：\n\n```javascript\n\
  function doSlides(images, containerSelector, delay=3000) {\n  //  元素\n  // ...\n\
  \  //  添加按钮\n  let button = document.createElement('button');\n  //  变量\n  // ...\n\
  }\n```\n\n`document.createElement()`函数会创建一个`button`元素，但它目前仅存在于内存中。稍后我们会将其移动到实际的文档中。在此之前，我们需要为它提供一些基本属性：\n\
  \n```javascript\nfunction doSlides(images, containerSelector, delay=3000) {\n  //\
  \ ...\n  //  添加按钮\n  let button = document.createElement('button');\n  button.id\
  \ = 'run-button';\n  button.textContent = 'Start';\n  // ...\n}\n```\n\n`textContent`属性设置了页面上显示的内容。我们会在暂停或恢复幻灯片播放时更改它。\
  \  \n`id`属性并非严格必需，因为我们不需要它来使按钮工作。但是，如果你想控制它的外观，就需要在 CSS 中定位它。附带的 CSS 文件包含了针对`button#run-button`的样式规则；当然，你可以使用任何你喜欢的`id`，只要相应地修改\
  \ CSS 即可。\n\n### 绑定事件监听器  \n按钮的主要作用是暂停和恢复幻灯片播放，因此我们将像处理图像那样，为它绑定事件监听器：\n\n```javascript\n\
  function doSlides(images, containerSelector, delay=3000) {\n  // ...\n  img.addEventListener('click',\
  \ toggle);\n  button.addEventListener('click', toggle);\n  // ...\n}\n```\n\n###\
  \ 将按钮添加到文档  \n最后，我们需要将按钮元素添加到文档中。按钮可以放在很多位置，但将其放置在包含`img`元素的`div`元素附近是合理的。这可以通过`insertAdjacentElement()`函数轻松实现。\
  \  \n我们在第三章中已经了解过`insertAdjacentElement()`函数。\n\n在我们的例子中，我们将按钮添加到容器内部的末尾：\n\n```javascript\n\
  function doSlides(images, containerSelector, delay=3000) {\n  // ...\n  let button\
  \ = document.createElement('button');\n  button.id = 'run-button';\n  button.textContent\
  \ = 'Start';\n  container.insertAdjacentElement('beforeend', button);\n  // ...\n\
  }\n```\n\n如果你看不清新按钮，可以将鼠标移到容器右下角按钮的模糊图像上。CSS 负责将按钮定位在图像上方、使其变暗，并在鼠标悬停时高亮。相关的 CSS\
  \ 部分如下所示：\n\n```css\nbutton#run-button {\n  /* ... */\n  position: absolute;\n \
  \ bottom: 1em; right: 1em;\n  opacity: .2;\n  transition: opacity 500ms;\n}\nbutton#run-button:hover\
  \ {\n  opacity: 1;\n}\n```\n\n此时，你可能会决定不再需要让整个图像作为按钮：\n\n```javascript\n//  img.addEventListener('click',\
  \ toggle);\n```\n\n该语句被注释掉而不是删除，以防你后续还想使用它。  \n现在的问题是按钮的文本令人困惑。\n\n### 更改按钮文本  \n\
  按钮的初始文本显示`Start`。当幻灯片正在播放时，它应变为`Stop`；当暂停时，应变回`Start`。这个操作应在`toggle()`函数中完成：\n\n\
  ```javascript\nfunction toggle() {\n  if(!running) {\n    running = setInterval(next,\
  \ delay);\n    next();\n    button.textContent = 'Stop';\n  }\n  else {\n    running\
  \ = clearInterval(running);\n    button.textContent = 'Start';\n  }\n}\n```\n\n\
  这样，按钮的显示就更有意义了。\n\n---\n\n## 更改外观  \n当幻灯片暂停或播放时，你可以使用 CSS 更改其外观。思路是使用 CSS 类。  \n\
  在 CSS 中，**类**（`class`）可用于描述元素的变体。你可以让多个元素拥有相同的类，此时 CSS 会将相同的属性应用于它们。  \n通过 JavaScript，你可以为元素分配或取消分配一个类。CSS\
  \ 随后会相应地应用或移除类的属性。在旧版本的 JavaScript 中，你需要使用`.className`属性。  \n然而，这已被`classList`属性所取代，后者允许分配多个类，并且更容易操作。\n\
  \n要为元素添加一个类，使用`.classList.add(...)`并传入类名；要移除一个类，使用`.classList.remove()`：\n\n```javascript\n\
  function toggle() {\n  if(!running) {\n    running = setInterval(next, delay);\n\
  \    next();\n    button.textContent = 'Stop';\n    container.classList.add('running');\n\
  \  }\n  else {\n    running = clearInterval(running);\n    button.textContent =\
  \ 'Start';\n    container.classList.remove('running');\n  }\n}\n```\n\n相关的 CSS 部分如下：\n\
  \n```css\ndiv#slides {\n  outline: medium solid #666;\n}\ndiv#slides.running {\n\
  \  outline-color: black;\n}\n```\n\n你将看到，当幻灯片暂停或播放时，CSS 会改变边框的颜色。\n\n---\n\n## 响应按键事件\
  \  \n我们已经添加了一个按钮来暂停和恢复幻灯片播放，但如果能通过按键来实现会更方便。这里，我们可以使用空格键。\n\n如果你拥有表单输入或`textarea`元素，可以在该元素内设置事件监听器来响应特定的按键。在本例中，我们希望整个文档能响应空格键，因此我们将事件监听器分配给文档本身：\n\
  \n```javascript\ndocument.onkeypress = /* ... */;\n```\n\n\n\n事件监听器是针对`keypress`事件的，这里我们可以使用简单的形式。如前所述，事件监听器总是一个函数，例如`toggle`函数。在这种情况下，我们需要一个不同的函数，先测试按下了哪个键，然后再调用`toggle`函数。\n\
  \n到目前为止，我们通过名称创建了一个函数，并将其作为事件监听器进行赋值，就像这样：\n\n```\nbutton.onclick = toggle;\nfunction\
  \ toggle() {\n}\n```\n\n如果你稍后要再次使用这个函数，以这种方式定义函数是很有用的。然而，你也可以在不单独定义函数的情况下做同样的事情：\n\
  \n```\nbutton.onclick = function() {\n}\n```\n\n这被称为**函数表达式**。注意这个函数没有名字，这种情况下它被称为匿名函数。你也可以给它一个名字：\n\
  \n```\nbutton.onclick = function toggle() {\n}\n```\n\n但是，这个名字只能在函数内部使用，所以你不太会经常看到这种模式。\n\
  \n对于`keypress`事件，我们将使用同样的思路来创建事件监听器，而不单独创建一个函数：\n\n```\nfunction doSlides(images,\
  \ containerSelector, delay=3000) {\n...\ndocument.onkeypress = function(event) {\n\
  };\nfunction toggle() {\n...\n}\n...\n}\n```\n\n注意这个函数也有一个参数。所有事件监听器都会接收一个特殊的`event`对象作为参数，但在许多情况下，你不会去理会它。你可以给它起任何名字，但你通常会看到它被命名为`event`、`e`，甚至`evt`。JavaScript\
  \ 允许你忽略传入的参数值，正如我们目前所做的那样。但这一次，我们将需要它。\n\n`event`对象包含关于事件的各种信息，比如事件发生时鼠标的位置、是否同时按下了\
  \ Shift 键，以及是哪个键触发了事件。按下的键位于`.key`属性中，我们可以用一个简单的`if()`来测试它：\n\n```\ndocument.onkeypress\
  \ = function(event) {\nif(event.key == ' ') {\n}\n};\n```\n\n这里，我们只对空格键感兴趣，所以我们只使用一个包含空格的字符串（`'\
  \ '`）。\n\n此时，如果测试通过，我们就可以调用 toggle 函数：\n\n```\ndocument.onkeypress = function(event)\
  \ {\nif(event.key==' ') {\ntoggle();\n}\n};\n```\n\n然而，浏览器通常对某些按键有自己的响应方式，这可能会干扰我们的计划。我们可以通过使用`event.preventDefault()`函数告诉浏览器不要再继续响应，从而完全接管其行为：\n\
  \n```\ndocument.onkeypress = function(event) {\nif(event.key==' ') {\ntoggle();\n\
  event.preventDefault();\n}\n};\n```\n\n现代 JavaScript 有一种编写函数表达式的替代方法：\n\n```\ndocument.onkeypress\
  \ = event => {\nif(event.key==' ') {\ntoggle();\nevent.preventDefault();\n}\n};\n\
  ```\n\n这被称为**箭头函数**表达式，原因显而易见。箭头函数语法简洁，这使得它们非常适合编写事件处理程序。它们也缺少传统函数的一些特性，这在更复杂的代码中反而可能是一个优势。在这种情况下，使用箭头语法并没有实际的好处，但你会逐渐发现事件监听器越来越多地以这种方式编写。\n\
  \n## 添加说明文字\n\n现在我们可以为每个图像添加描述性的说明文字。这些说明文字将包含在图像名称数组中，并通过 JavaScript 创建的特殊段落元素来显示。\n\
  \n## JavaScript 对象\n\n到目前为止，`images`数组只包含图像名称的条目。如果我们想要包含说明文字，每个条目都需要稍复杂一些。\n\n\
  **对象**是一个数据包。JavaScript 有许多预定义的对象，但你可以通过定义一组对象属性来创建自己的对象：\n\n```\n»   var apple\
  \ = {\nshape: 'round',\ncolour: 'red'\n};\n```\n\n这被称为**对象字面量**，因为你是在代码本身中定义属性。在\
  \ JavaScript 中，对象字面量包含在大括号（`{ ... }`）内，看起来就像代码块，但其实不是。事实上，大括号用于两种不同的事情可能会导致 JavaScript\
  \ 误解某些代码。\n\n对象的每个属性可以通过`object.property`读取：\n\n```\n»   console.log(apple.colour);\n\
  ```\n\n你也可以更改属性的值：\n\n```\n»   apple.colour = 'green';\n```\n\n在编写对象属性时要小心。默认情况下，JavaScript\
  \ 允许你即时创建新属性，这并不总是你的本意。例如：\n\n```\napple.Colour = 'green';\n```\n\n将会创建一个名为`Colour`的新属性，因为属性名和\
  \ JavaScript 的其他部分一样，是区分大小写的。\n\n当然，你也可以在一行内编写对象字面量：\n\n```\n»   var banana = {\
  \ shape: 'long', colour: 'yellow' };\n```\n\n如果你要创建许多具有相同属性但不同值的对象，你可以创建一个构造函数来自动完成：\n\
  \n```\n»   function Fruit(shape, colour) {\nthis.shape = shape;\nthis.colour = colour;\n\
  }\n»   var cherry = new Fruit('small', 'black');\n```\n\n关于创建构造函数，我们在这里就不再深入讨论了。\n\
  \n## 重新审视图像集合\n\n我们可以使用一个对象数组，而不是字符串数组，每个对象将包含图像的名称及其说明文字。每个对象可以采取以下形式：\n\n```\n\
  {\nsrc: '...',\ncaption: '...'\n}\n```\n\n其中`src`属性是图像的名称，`caption`属性是说明文字。我们可以将这个新数组命名为`images2`，以区别于原始集合。\n\
  \n通过将每个对象写在一行，图像数组现在变成：\n\n```\nlet images2 = [\n{ src: '...', caption: '...' },\n\
  { src: '...', caption: '...' },\n{ src: '...', caption: '...' }\n];\n```\n\n你现在可以在示例项目中像这样定义\
  \ images 数组：\n\n```\nlet images = [ ... ];\nlet images2 = [\n{ src: 'bamboo.jpg',\n\
  caption: '日本竹林' },\n{ src: 'bird.jpg', caption: '飞翔的鸟' },\n{ src: 'bromeliad.jpg',\
  \ caption: '凤梨花' },\n{ src: 'bush-panorama.jpg',\ncaption: '澳大利亚灌木丛全景' },\n{ src:\
  \ 'canal.jpg', caption: '荷兰运河' },\n{ src: 'church.jpg',\ncaption: '布里斯班夜晚的老教堂' },\n\
  { src: 'cityscape.jpg', caption: '日本城市' },\n{ src: 'emu.jpg', caption: '澳大利亚鸸鹋'\
  \ },\n{ src: 'gum-nuts.jpg', caption: '一些桉树果' },\n{ src: 'hanging-rock.jpg',\ncaption:\
  \ '维多利亚州的岩石露头' },\n{ src: 'hut.jpg', caption: '古老的丛林小屋' },\n{ src: 'koala.jpg',\n\
  caption: '一只做着考拉平常事的考拉……' },\n{ src: 'kookaburra.jpg',\ncaption: '一只回头的笑翠鸟' },\n\
  { src: 'lake.jpg', caption: '日本的一个湖泊' },\n{ src: 'lantern.jpg',\ncaption: '日本神社的灯笼'\
  \ },\n{ src: 'light-house.jpg', caption: '一座灯塔' },\n{ src: 'lorikeet.jpg',\ncaption:\
  \ '澳大利亚吸蜜鹦鹉' },\n{ src: 'mountain-panorama.jpg',\ncaption: '日本的山脉全景' },\n{ src:\
  \ 'rocks.jpg', caption: '湖中的岩石露头' },\n{ src: 'rose.jpg', caption: '一朵黄玫瑰' },\n{\
  \ src: 'steps.jpg',\ncaption: '花园中的石阶' },\n{ src: 'sunset.jpg', caption: '云中日落'\
  \ },\n{ src: 'tall-trees.jpg',\ncaption: '澳大利亚灌木丛中的树木' },\n{ src: 'tea-leaf.jpg',\n\
  caption: '一片茶树叶子' },\n{ src: 'train.jpg',\ncaption: '进站的火车' },\n{ src: 'waterfall.jpg',\n\
  caption: '林间瀑布' }\n];\n```\n\n为了减少你的输入量，这里也提供了这个数组的代码片段。\n\n在`slideshow.js`文件中，你可以修改函数调用以使用`images2`数组：\n\
  \n```\ndoSlides(images2, 'div#slides', 3000);\n```\n\n当然，你现在已经破坏了代码。\n\n## 使用对象属性\n\
  \n\n\n现在每个项目不再只是图片的名称，而是包含名称和标题的对象。要读取名称，你需要使用 `images[...].src`。这将位于求值表达式 `${images[...].src}`\
  \ 中：\n\n```\nfunction next() {\n//  填充图片\n//  img.src = `images/slides/${images[slideNumber++]}`;\n\
  img.src = `images/slides/${images[slideNumber++].src}`;\n//  循环播放\nif(slideNumber>=images.length)\
  \ slideNumber = 0;\n//  预加载\n//  prefetch.src = `images/slides/${images[slideNumber]}`;\n\
  prefetch.src = `images/slides/${images[slideNumber].src}`;\n}\n```\n\n至少幻灯片又可以正常工作了。\n\
  \n## 添加标题\n\n下一步是创建一个段落元素来包含标题，并在适当的时候填充它。\n\n为了创建段落元素，我们将使用与创建按钮相同的技术：\n\n```\n\
  function doSlides(images, containerSelector, delay=3000) {\n//  元素\n...\n//  添加标题\n\
  let caption = document.createElement('p');\ncontainer.insertAdjacentElement('beforeend',\
  \ caption);\n//  变量\n...\n}\n```\n\n在这里，段落被添加到了容器的末尾，位于之前添加的按钮之后。CSS 负责在容器中定位新的段落并定义其外观，例如文本居中并加粗。\n\
  \n剩下的工作就是让 `next()` 函数来填充标题：\n\n```\nfunction next() {\n//  填充图片\nimg.src = `images/slides/${images[slideNumber].src}`;\n\
  caption.textContent = images[slideNumber++].caption;\n...\n}\n```\n\n注意，表达式 `slideNumber++`\
  \ 已被移到标题语句中。这是因为你不想在旧值使用完毕之前递增 `slideNumber`。如果你愿意，下面的写法可能更清晰：\n\n```\nfunction\
  \ next() {\n//  填充图片\nimg.src = `images/slides/${images[slideNumber].src}`;\ncaption.textContent\
  \ = images[slideNumber].caption;\nslideNumber++;\n...\n}\n```\n\n同时，你还可以设置图片本身的\
  \ `title` 属性，以及 `alt` 属性，你可以将它们设置为相同的内容：\n\n```\nfunction next() {\n//  填充图片\nimg.src\
  \ = `images/slides/${images[slideNumber].src}`;\ncaption.textContent = images[slideNumber].caption;\n\
  img.title = images[slideNumber].caption;\nimg.alt = images[slideNumber].caption;\n\
  slideNumber++;\n...\n}\n```\n\n图片的 `title` 属性通常不会显示，但如果你将鼠标悬停在上面，它会显示为工具提示。\n\n\
  ## 总结\n\n在本章中，我们通过一个图片幻灯片示例，学习了操作网页内容的技术。在此过程中，我们掌握了许多技能。\n\n### 组织代码\n\n我们将实际的幻灯片代码放在了\
  \ `library.js` 文件中，以便可以重复使用。该函数还接受一个图片集合和幻灯片容器的 CSS 选择器，以使其尽可能灵活。\n\n### 定位元素\n\n\
  我们使用 `.querySelector()` 函数来定位幻灯片容器以及其中的 `img` 元素。\n\n### 数组\n\n数组是一个编号的项目集合。你可以通过数组字面量创建一个数组：\n\
  \n```\nvar fruit = ['apple', 'banana', 'cherry'];\n```\n\n数组从 0 开始编号。你可以使用 `.length`\
  \ 属性获取项目数量。你可以使用方括号中的索引从数组中获取单个项目：`fruit[1]`。\n\n### 操作图片元素\n\n在 HTML 中，图片出现在 `img`\
  \ 元素中。在 JavaScript 中，我们通过更改其 `.src`、`.alt` 和 `.title` 属性来操作该元素。一旦 `.src` 属性被更改，浏览器会立即尝试重新加载图片。\n\
  \n### 延迟和重复函数\n\nJavaScript 有 `setTimeout()` 函数来延迟调用函数一段时间。还有 `setInterval()` 函数用于重复调用函数。在这两种情况下，都可以从这些函数的返回值中设置一个变量，以便我们取消它们。\n\
  \n### 启动与停止\n\n使用 `setTimeout()` 函数返回的变量，我们可以跟踪幻灯片是否正在运行，并用它来调整内容的外观。我们还可以使用这个变量来管理一个切换按钮。该按钮用于通过运行\
  \ `setTimeout()` 来启动幻灯片，或者如果它已经在运行则取消它。\n\n### 事件处理程序与创建元素\n\n通过设置事件监听器来响应点击，任何\
  \ HTML 元素都可以充当按钮。我们首先对图片元素执行了此操作。我们还可以使用 `document.createElement()` 创建额外的按钮元素。通过添加\
  \ `.id` 属性，我们可以让 CSS 对其进行样式设置。然后为该按钮分配了一个点击事件处理程序。还可以为文档本身分配一个键盘事件监听器。我们这样做了，以监听空格键来切换幻灯片。\n\
  \n### 预加载图片\n\n通过网络获取图片可能需要一些时间，这可能会导致幻灯片暂停。我们创建了一个虚拟图片来包含数组中的下一张图片。这允许浏览器在访问者观看前一张图片时获取并缓存下一张图片。\n\
  \n### 对象\n\n我们接着为每张图片添加了标题。这需要将数组从字符串数组修改为对象数组。对象是值的集合。用于图片的对象包含一个 `.src` 属性和一个\
  \ `.caption` 属性。然后我们重构了代码，使用每个对象的 `.src` 属性。我们还为标题创建了一个新的段落元素，并用每个对象的 `caption`\
  \ 属性填充它。\n\n### 下回预告\n\n下一个项目将涉及与 Web 表单的交互。这将是第 6 章的内容，关于创建一个专用计算器。不过在此之前，我们将更多地了解表单的工作原理以及我们如何处理它们。\n\
  \n## 5. 使用表单\n\nHTML 表单是与用户交互的重要组成部分。通常，用户将数据输入表单，然后数据被发送到 Web 服务器进行进一步处理。JavaScript\
  \ 也可以在浏览器内处理表单数据。有时，这是为了在数据发送到服务器之前对其进行预处理或检查，但有时所有操作都留在浏览器内，无需发送出去。\n\n传统上，JavaScript\
  \ 用于数据**验证**：检查表单在发送前是否已正确填写。为了确保万无一失，Web 服务器应再次检查：有些情况无法在浏览器端检查，而且绕过 JavaScript\
  \ 验证总是可能的。从这个意义上说，JavaScript 验证并非最终验证，而是为了方便用户，因为它可以在表单发送之前警告用户错误。\n\n在现代 HTML 中，许多表单验证可以通过额外的\
  \ HTML 属性来处理，因此 JavaScript 验证不再那么重要。然而，JavaScript 在处理表单数据方面仍然扮演着重要角色。在下一个项目中，我们将使用表单作为专用计算器，其中\
  \ JavaScript 将用于检查输入并计算结果。现在，我们先了解一下 JavaScript 通常如何与表单协同工作。\n\n### HTML 表单的结构\n\
  \n表单是一个 HTML 容器，它可以包含以下类型的元素：\n\n- 表单字段，例如文本框、菜单和按钮。这些包含表单的实际 *数据*，它们是表单的核心。\n-\
  \ 组织元素，例如 `fieldset` 和 `label`。这些对数据没有影响，但在视觉上和实用性上对用户有帮助。\n- 任何其他元素，例如段落和图片。同样，它们对数据没有影响，但用于增强表单的外观或使表单的某些部分更清晰。\n\
  \n当然，这些其他元素本身并不是表单的一部分：它们只是*位于*表单内部。它们完全也可以被放置在表单外部。\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵守您提供的注意事项，将给定的英文文本翻译成中文。\n\
  \n\n在浏览器和代码编辑器中打开`sample-form.html`页面。以下是显示表单结构的摘录：\n\n```\nEnter your details:\n\
  \nFull Name:\n\nEmail Address:\n\nSubject:\n\nMessage:\nThis space ...\n\nSend Message\n\
  ```\n\n在浏览器中，表单可能类似于图 5-1。\n\n![](img/609513_1_En_5_Fig1_HTML.jpg)\n\n截图显示了示例表单，包含以下字段：全名、电子邮件地址、主题、消息。\n\
  \n**图 5-1** 示例表单\n\n实际外观部分取决于浏览器，很大程度上取决于 CSS 样式。现代开发者在使表单美观易用方面投入了大量精力。外观对提交数据后\
  \ Web 服务器所看到的内容没有任何影响；但肯定会影响用户与表单的交互方式。\n\n示例表单的重要部分如下：\n\n*   表单有一个`id`属性。这对数据没有影响，但用于\
  \ CSS 设置样式，也用于 JavaScript 定位特定表单。\n*   表单还有`method`和`action`属性，用于控制数据如何发送回 Web 服务器。它们对于将数据提交回服务器非常重要。\n\
  *   存在一些数据元素。在此示例中，它们是各种类型的文本框，但也可能包括复选框、单选按钮、列表和菜单。我们将在 JavaScript 中重点关注这些数据元素。\n\
  *   有一个提交按钮，它也被视为数据元素。通常，这会向服务器提交数据，但可以在 JavaScript 中被拦截。\n*   表单中的其他所有内容都是组织性的，不会影响我们对数据的处理。\n\
  \n除了其他 HTML 属性之外，表单字段*元素*还有一些相关属性：\n\n*   `name=\"...\"`属性为数据附加一个标识符。如果将表单发送到服务器，`name`是识别值的*唯一*方式。在\
  \ JavaScript 中，有其他替代方法，但我们将使用`name`属性。\n*   `value=\"...\"`是一个*默认*值，但当前值可以由用户轻松更改。它通常用作对用户的便利，并且对我们测试来说也很方便。\n\
  \n`value`是少数具有*两种*不同含义的属性之一。作为 HTML 属性，它是*默认*值；作为 JavaScript 属性，它是*当前*值。\n\n*  \
  \ `type`属性对于表单及其元素的*行为*很重要，但对实际数据没有影响。\n\n在这种情况下，较小的文本框具有`type=\"text\"`或`type=\"\
  email\"`，这看起来像文本框，但仅限于类似电子邮件地址的文本。较大的文本框是一个`textarea`元素，它执行类似的工作，但没有`type`属性。\n\n\
  默认情况下，表单内的`button`元素充当`submit`按钮。通常最好使用`type=\"submit\"`属性来指定。表单通常有一个`action=\"\
  ...\"`属性，其中包含数据将提交到的 URL。\n\n如果提交示例表单（使用默认值或自定义值），数据将被发送到 Web 服务器上的脚本。在这种情况下，脚本仅显示发送到服务器的数据，而不会进一步处理。你将看到类似图\
  \ 5-2 的内容。\n\n![](img/609513_1_En_5_Fig2_HTML.jpg)\n\n测试表单结果页面的截图。它包含以下列出的信息：Accept、Cookies、Get\
  \ Data、Post Data、Raw Data。\n\n**图 5-2** 示例表单结果\n\n**Get** 数据是以查询字符串形式添加到 URL 的数据。**Post**\
  \ 数据是来自表单本身的数据，其方法设置为`post`。如果方法设置为`get`，它将被添加到查询字符串中作为更多的**Get**数据。\n\n## 在 JavaScript\
  \ 中访问表单\n\n出于我们的目的，我们不一定想将表单提交到服务器。我们只想用 JavaScript 访问它。\n\n你首先需要的是对表单的引用。假设表单有一个`id`，你可以使用类似这样的代码：\n\
  \n```\nvar form = document.querySelector('form#contact');\n```\n\n当然，变量名不必是`form`。如果提交表单，表单的`id`属性没有任何意义，服务器也永远不会看到`id`。但是，它在浏览器中对于\
  \ CSS 样式以及我们在此看到的 JavaScript 非常重要。还有一个`forms`集合，你可以引用`forms[0]`作为第一个（也是唯一一个）表单，但这在现代\
  \ JavaScript 中不是必需的。\n\n## 访问表单元素\n\n从 JavaScript 的角度来看，表单是一个**对象**：一个复杂的包。它有许多属性，例如`action`和`method`，它们是表单自身行为的一部分。它还有一个表单元素的集合。\n\
  \n访问表单的元素有两种方法。最简单的方法是使用元素的名称作为属性。例如，要访问`name`为`subject`的元素，你可以在文本框中填写内容，然后在 JavaScript\
  \ 中使用`form.subject`：\n\n```\nvar form = document.querySelector('form#contact');\n\
  console.log(form.subject);\n```\n\n这是一种非常常见的方法，因为它很简单。但是，它将表单元素与表单的其他属性（例如其`method`或`action`）混合在一起，并且如果你需要访问其他恰好与表单元素同名的表单属性，就会成为问题。最好通过`form.elements`集合来访问元素：\n\
  \n```\nvar form = document.querySelector('form#contact');\nconsole.log(form.elements.subject);\n\
  ```\n\n另一个复杂之处是元素的`name`属性可能不是一个合适的 JavaScript 属性名。例如，如果`name`类似于`name=\"email-address\"\
  `，你不能引用`form.elements.email-address`，因为你不能在属性名中使用连字符。相反，你需要使用替代表示法`form.elements['email-address']`。\n\
  \n现在有几种方法可以引用表单元素：\n\n```\nvar form = document.querySelector('form#contact');\n\
  console.log(form.subject);\nconsole.log(form.elements.subject);\nconsole.log(form.elements['subject']);\
  \  //  首选\n```\n\n最后一种是我们更倾向于使用的方式，因为它最安全，并且适用于所有有效的名称。\n如果你运行前面显示的代码，你将看到元素本身，而不是元素中的文本。为此，你需要读取元素的一些属性。\n\
  \n## 访问表单数据\n\n所有表单元素都可以使用`form.elements['element-name']`来访问。但是，这将给你元素本身，而不是元素内部的数据。\n\
  \n令人困惑的是，有两个相关属性的名称重叠：\n\n*   你也可以通过这种方式设置`.defaultValue`属性，但它不是很有用。\n*   HTML 的`value=\"\
  ...\"`属性实际上是*默认*值；在 JavaScript 中，它被称为`.defaultValue`属性。\n*   元素的*当前*值是 JavaScript\
  \ 所称的`.value`属性。\n\n例如，假设你在表单的主题中输入了`Random Question`。然后你可以如下检查它：\n\n```\nvar form\
  \ = document.querySelector('form#contact');\nconsole.log(form.elements['subject'].defaultValue);\n\
  General Enquiry\nconsole.log(form.elements['subject'].value);\nRandom Question\n\
  ```\n\n对于大多数应用程序，你将需要`.value`属性。\n\n如果你愿意，你可以设置`value`属性：\n\n```\nvar form = document.querySelector('form#contact');\n\
  form.elements['email-address'].value = 'someone@example.com';\n```\n\n\n\n### 关于\
  \ `.value` 属性的说明\n\n请注意，`.value` 属性*始终*是一个字符串。如果你期望得到一个数字，你可能需要使用 `parseInt()` 或\
  \ `parseFloat()` 将其转换为数字。这与你在猜数字游戏中遇到的 `prompt` 函数的问题是相同的。\n\n## 访问提交按钮\n\n表单的提交按钮与其他表单元素一样，因此可以使用相同的表示法轻松访问：\n\
  \n-   你可以做的一件事是模拟点击提交按钮：\n\n```\n    »   var form = document.querySelector('form#contact');\n\
  \    »   form.elements['send'].click();\n    ```\n\n-   `click()` 函数模拟点击，可以在任何时候用于点击任何元素。\n\
  \n如果你确实想要提交表单，也可以使用 `submit()` 函数从表单对象执行此操作：\n\n```\n    »   var form = document.querySelector('form#contact');\n\
  \    »   form.submit();\n    ```\n\n-   访问提交按钮最可能的用途是附加一个事件监听函数：\n\n```\n    » \
  \  var form = document.querySelector('form#contact');\n    »   function doSomething(event)\
  \ {\n    }\n    »   form.elements['send'].onclick = doSomething;\n    ```\n\n请注意，由于我们是在控制台中实验，我们需要在引用\
  \ `doSomething()` 函数*之前*定义它。在真实的脚本中，你可以之后定义该函数，因为 JavaScript 解释器会在运行脚本之前扫描所有函数定义。\n\
  \n另外请注意，如果你重新定义了该函数（就像你在这里会做几次一样），你还需要重新分配 `onclick` 事件监听器。\n\n```\nform.elements['send'];\n\
  ```\n\n这个附加的函数被称为事件监听器，并且如果你需要的话，它实际上有一个参数。这个参数通常被称为 `event`，可用于取消提交：\n\n```\n»\
  \   var form = document.querySelector('form#contact');\n»   function doSomething(event)\
  \ {\n//  处理表单\nevent.preventDefault();\n}\n»   form.elements['send'].onclick = doSomething;\n\
  ```\n\n由于提交按钮的默认行为是提交数据，`preventDefault()` 函数会阻止此行为。有时，这会在 `if()` 之后使用，例如在检查错误时。如果你希望完全在\
  \ JavaScript 中处理表单而不将其发送到服务器，也可以无条件地使用它。\n\n你经常会看到 `preventDefault()` 函数被首先调用：\n\
  \n```\nfunction doSomething(event) {\nevent.preventDefault();\n//  处理表单\n}\n```\n\
  \n如果你不取消提交，那么表单将被提交，在这种情况下，页面将被重新加载。\n\n## 总结\n\n在本章中，我们快速了解了 HTML 表单。我们讨论了：\n\n\
  -   HTML 表单的结构\n-   在 JavaScript 中访问表单\n-   访问表单元素\n-   访问表单数据\n-   访问提交按钮并拦截提交过程\n\
  \n## 下一章预告\n\n既然我们已经了解了表单和 JavaScript，我们将把表单用作一个自定义计算器。在计算器项目中，我们将学习更多关于处理表单和表单字段以及处理来自表单的数据的知识。我们还将了解更多关于数据处理和计算的技术，以及关于为将来存储数据的一些知识。\n\
  \n# 6. 创建自定义计算器表单\n\nWeb 表单是一种允许用户与网络服务器进行通信的标准方法。这通常用于发送消息或下订单。尽管表单可以按原样工作，但通常会用\
  \ JavaScript 来预处理数据和进行检查。在这个项目中，我们将使用 JavaScript 来处理数据，而不将其发送到服务器。在这种情况下，我们将创建一个专门的計算機。\n\
  \n在开发这个项目的过程中，我们将学习以下内容：\n\n-   从 Web 表单读取数据\n-   检查和验证数据\n-   拦截表单\n-   编写公式代码\n\
  -   在浏览器中存储数据\n\n虽然我们不会将表单提交到服务器（除了测试表单），但如果你想要记录查询或进行一些进一步的处理，你也可以这样做。\n\n## 创建抵押贷款还款计算器\n\
  \n专门计算器的一个简单例子是使用专门公式的计算器。在这里，我们将根据本金（借款金额）、利率和抵押贷款期限来计算定期还款额。你可能会或可能不会对金融计算充满热情。或者你可能对科学计算或数学公式更感兴趣。当然，我们关注的不是公式本身，而是如何将公式转化为表单，以及如何用\
  \ JavaScript 实现它。\n\n如果你要在电子表格应用程序中执行此操作，你可能会找到一个名为 `PMT()` 的内置函数来完成相同的工作。JavaScript\
  \ 没有这样的函数，所以你必须自己编写代码。如果你有时间和数学知识，你可能可以自己推导出这个公式。如果你没有时间、知识或意愿，你可以尝试在互联网上找到某个公式。\n\
  \n最终，你会发现还款公式为：\n\n![$$ pr\\frac{{\\left(1+r\\right)}^n}{{\\left(1+r\\right)}^n-1}\
  \ $$](img/609513_1_En_6_Chapter_TeX_Equa.png)\n\n其中\n\n- p = 本金\n- r = 利率（每期）\n\
  - n = 还款期数\n\n这个公式可以完成任务，但其中两个值对用户不太友好。在计算抵押贷款时，我们通常以*年*利率表示，而不是*每期*利率。而且我们通常使用*年*数，而不是还款期数。\n\
  \n为人类编写应用程序的最重要规则是，让人类做对他们来说自然的事情，并让代码进行必要的调整。*永远不要期望用户进行调整：(a) 他们不想这样做，(b) 他们可能会犯错误，(c)\
  \ 他们真的不想这样做。*\n\n因此，部分工作将是把对人类友好的值转换为对公式友好的值。\n\n### 计算器表单\n\n数据将来自以下表单：\n\n```\n\
  \n借款金额：\n\n期限（年）：\n\n还款频率：\n\n利率（年化%）：\n\n计算\n\n```\n\n它看起来类似于图 6-1。\n\n![](img/609513_1_En_6_Fig1_HTML.jpg)\n\
  \n抵押贷款计算器表单页面的屏幕截图。以下是字段：借款金额、期限（年）、还款频率和利率。\n\n**图 6-1** 抵押贷款计算器表单\n\n在此表单中，两个重要的输入元素类型是\
  \ `<input type=\"text\" name=\"...\">` 和 `<button name=\"...\">`，它们是文本框和操作按钮。你会看到还有一个\
  \ `output` 元素。这是一个简单的元素，你可以在 JavaScript 中向它写入任何你喜欢的内容。它将是表单的 `elements` 集合的一部分，但如果你提交表单，它将不会被包含在内。\n\
  \n为了实现计算器，我们将响应 `button`，读取和处理来自 `input` 元素的数据，并将结果放入 `output` 元素中。\n\n### 表单字段\n\
  \n表单字段是从用户角度看待我们需要处理的值。它们是：\n\n-   `principal`：借款金额\n-   `term`：抵押贷款的年数\n-   `frequency`：每年的还款次数\n\
  -   `rate`：以百分比表示的年利率\n\n请注意，这些都是 `text` 类型的输入。HTML 确实有 `type=\"number\"`，但它不够灵活。无论如何，数据将是一个字符串，即使我们使用\
  \ `type=\"number\"`，所以对我们来说没有多大好处。\n\n这四个值是人们期望填写的那种值，但公式想要的是不同的东西。为了准备好公式需要的值：\n\
  \n-   本金保持不变。\n-   每期利率将按如下方式计算：\n\n```\n    每期利率\n    = 年利率 / 每年还款次数 / 100\n```\n\
  \n\n\n# 除以 100 将百分比转换为小数。\n\n- 还款期数的计算方式如下\n\n```\n    还款期数\n    = 贷款年限 × 每年还款次数\n\
  \    ```\n\n请注意，我们再次向用户做出了让步。我们习惯于将利率表示为百分比，但`JavaScript`对百分比一无所知。因此，我们将允许用户输入看起来像百分比的值，然后在代码中将其除以\
  \ 100。^(³)\n\n## 初始化 JavaScript\n\nHTML 代码已准备就绪，并包含了指向`JavaScript`文件的链接：\n\n```\n\
  ...\n...\n...\n```\n\n请注意，其中包含了库脚本。如果某些新代码是可复用的，我们可能需要将其移到库中。\n\n`calculator.js`\
  \ 文件已为您创建完毕，可以直接使用：\n\n```\n/*  按揭贷款计算器\n================================================\
  \ */\n'use strict';\nwindow.onerror=function(message,url,line) {\nalert(`Error:\
  \ ${message}\\n${url}: ${line}`);\n};\ndoCalculator();\nfunction doCalculator()\
  \ {\n}\n```\n\n我们没有费心去单独编写一个`init()`函数，因为那里已无需再做任何处理。\n\n## 处理表单\n\n第一步是找到表单并引用它：\n\
  \n```\nfunction doCalculator() {\nlet calculatorForm = document.querySelector('form#data');\n\
  }\n```\n\n找到表单后，你需要为提交按钮附加一个事件监听器：\n\n```\nfunction doCalculator() {\nlet calculatorForm\
  \ = document.querySelector('form#data');\ncalculatorForm.elements['calculate'].onclick\
  \ = doit;\nfunction doit(event) {\n}\n}\n```\n\n这里，提交按钮的名称为`calculate`。事件监听器是`doit`函数。你可能觉得`doit`不是一个描述性很强的名称，但我们能用其简洁性来辩护。\n\
  \n在这种情况下，`doit`函数是**嵌套**在`doCalculator()`函数内部的。因此，这个函数具有以下几个特点：\n\n- 由于位于`doCalculator()`函数内部，`doit`函数继承了所有外部变量。在本例中，它继承了`calculatorForm`变量，该变量对于获取数据值至关重要。\n\
  \n- 与局部变量一样，嵌套函数只能在外部函数内部访问，外部无法访问。你可以随意命名嵌套函数，而不会影响你其余的`JavaScript`代码。\n\n- 正是这个特性使得为`doit`函数取一个描述性较弱的名称是合理的，因为它只需在局部范围内有意义。\n\
  \n- 外部函数是自包含的，因为它包含了所有依赖函数，并且无需与其他任何函数通信。\n\n`doit`函数包含了`event`参数，我们可以用它来阻止表单实际提交：\n\
  \n```\nfunction doit(event) {\nevent.preventDefault();\n}\n```\n\n如果你忘记这样做，每次点击提交按钮时页面都会重新加载，你将永远看不到计算结果。\n\
  \n### 获取表单数据元素\n\n有四个数据元素需要用到。你可以直接使用它们的值，但将它们存入变量会更方便：\n\n```\nfunction doit(event)\
  \ {\nevent.preventDefault();\nlet principal = calculatorForm.elements['principal'].value;\n\
  let term = calculatorForm.elements['term'].value;\nlet frequency = calculatorForm.elements['frequency'].value;\n\
  let rate = calculatorForm.elements['rate'].value;\n}\n```\n\n无法阻止用户犯错，尤其是输入错误。最简单的错误是多余的空格，我们可以使用`trim()`函数轻松处理：\n\
  \n```\nfunction doit(event) {\nevent.preventDefault();\nlet principal =\ncalculatorForm.elements['principal'].value.trim();\n\
  let term = calculatorForm.elements['term'].value.trim();\nlet frequency =\ncalculatorForm.elements['frequency'].value.trim();\n\
  let rate = calculatorForm.elements['rate'].value.trim();\n}\n```\n\n`trim()`函数应用于字符串，在这里是`.value`属性，它会移除字符串开头和结尾的所有空格。如果字符串内部有其他空格，则不受影响。\n\
  \n### 检查表单值\n\n记住，所有表单数据最初都是字符串，因此你需要确保它们被转换为数字。虽然`JavaScript`会在可能的情况下自动进行转换，但你自己手动转换更好。这样，你也可以检查转换错误。例如：\n\
  \n```\nlet principal = calculatorForm.elements['principal'].value.trim();\nprincipal\
  \ = parseFloat(principal);\n```\n\n`parseFloat()`和`parseInt()`函数都会尝试从字符串开头开始，尽可能多地将字符串解析为浮点数或整数。如果遇到数字中无效的字符，它们就会停止解析，并使用该字符之前的所有内容。两者之间的区别在于，`parseFloat`还会接受小数点，这对于整数来说是无效的。\n\
  \n当你使用`parseInt()`或`parseFloat()`处理字符串时，字符串转换失败的可能性始终存在；也就是说，它是**无效的**。检查用户数据是否有效当然被称为**验证**。现代\
  \ HTML 为表单提供了一些内置验证，但使用`JavaScript`进行验证功能更强大。\n\n如果字符串为空或开头就是无效字符，`parseFloat()`和`parseInt()`将返回`NaN`，这是一个特殊值，表示“Not\
  \ a Number”（非数字）。你可以使用以下两种方法之一专门测试这个特殊值：\n\n```\nif(isNaN(principal)) ... ;    \
  \        //  isNaN() 函数\nif(principal != principal) ...    ;   //  NaN 的特性\n```\n\
  \n第一种方法使用`isNaN()`函数，你需要记住它有两个大写`N`。第二种方法利用了`NaN`的一个奇特特性：它不等于任何东西，甚至不等于它本身。你不会认真使用这个方法，但可能想展示一下。\n\
  \n实际上，你可以利用`NaN`被视为假值的特性，直接使用非（`!`）运算符：\n\n```\nlet principal = calculatorForm.elements['principal'].value.trim();\n\
  principal = parseFloat(principal);\nif(!principal) principal = 0;\n```\n\n这样，如果字符串解析失败，你可以指定一个默认值。\n\
  \n在`JavaScript`中，你可以使用`||`（或）运算符将上一步骤中显示的最后两步合并：\n\n```\nlet principal = calculatorForm.elements['principal'].value.trim();\n\
  principal = parseFloat(principal) || 0;\n```\n\n在`JavaScript`中，`||`运算符是**短路**的。这意味着如果第一个测试足以得到结果，第二个将不会被执行。在这种情况下，如果第一个值为真值，则不会使用第二个值，因为`||`只需一个成功条件即可。\n\
  \n现在，你可以预处理以下值：\n\n```\nfunction doit(event) {\nevent.preventDefault();\nlet principal\
  \ =\ncalculatorForm.elements['principal'].value.trim();\nprincipal = parseFloat(principal);\n\
  if(!principal) principal = 0;\nlet term = calculatorForm.elements['term'].value.trim();\n\
  term = parseFloat(term);\nif(!term) term = 0;\nlet frequency =\ncalculatorForm.elements['frequency'].value.trim();\n\
  frequency = parseFloat(frequency);\nif(!frequency) frequency = 1;\nlet rate = calculatorForm.elements['rate'].value.trim();\n\
  rate = parseFloat(rate);\nif(!rate) rate = 0;\n}\n```\n\n或者更简洁地：\n\n```\nfunction\
  \ doit(event) {\nevent.preventDefault();\nlet principal =\ncalculatorForm.elements['principal'].value.trim();\n\
  principal = parseFloat(principal) || 0;\nlet term = calculatorForm.elements['term'].value.trim();\n\
  term = parseFloat(term) || 0;\nlet frequency =\ncalculatorForm.elements['frequency'].value.trim();\n\
  frequency = parseFloat(frequency) || 0;\nlet rate = calculatorForm.elements['rate'].value.trim();\n\
  rate = parseFloat(rate) || 0;\n}\n```\n\n除了为公式提供无害的虚拟值之外，这些默认值实际上什么也不做。你本来可以轻松地提供更有意义的值。\n\
  \n\n\n### 使用 HTML 默认值与修复表单值\n\n如果你想要使用 HTML 默认值，请记住 HTML 使用`value`作为该属性的默认值。然而，JavaScript\
  \ 使用`value`表示当前值，因此你需要使用另一个 JavaScript 属性`defaultValue`。例如：\n\n```\nprincipal =\
  \ parseFloat(principal) ||\nparseFloat(calculatorForm.elements['principal'].defaultValue);\n\
  ```\n\n上述语句的续行通过缩进使其更易阅读。\n\n### 修复表单值\n\n虽然有些开发者似乎以此为乐，但通常不建议混淆用户。在本例中，你可能已经调整了某些值，并且即将使用这些调整后的值。\n\
  \n当你对用户数据做出任何更改后，最好将这些值写回表单，以便用户能够看到实际发生了什么。表单的`value`属性既可读也可写，因此我们可以通过这种方式写入调整后的值：\n\
  \n```\nfunction doit(event) {\nevent.preventDefault();\nlet principal =\ncalculatorForm.elements['principal'].value.trim();\n\
  principal = parseFloat(principal) || 0;\ncalculatorForm.elements['principal'].value\
  \ = principal;\nlet term = calculatorForm.elements['term'].value.trim();\nterm =\
  \ parseFloat(term) || 0;\ncalculatorForm.elements['term'].value = term;\nlet frequency\
  \ =\ncalculatorForm.elements['frequency'].value.trim();\nfrequency = parseFloat(frequency)\
  \ || 0;\ncalculatorForm.elements['frequency'].value = frequency;\nlet rate = calculatorForm.elements['rate'].value.trim();\n\
  rate = parseFloat(rate) || 0;\ncalculatorForm.elements['rate'].value = rate;\n}\n\
  ```\n\n虽然`.value`属性从技术上讲是字符串而非数字，但 JavaScript 知道这一点，并且会轻松地将数字转换为字符串。\n\n你现在可以尝试使用无效值进行测试。任何默认值都会被写回表单，尽管在此阶段还不会进行任何计算。\n\
  \n## 转换抵押贷款计算公式\n\n如前所述，还款公式为：\n\n![$$ pr\\frac{{\\left(1+r\\right)}^n}{{\\left(1+r\\\
  right)}^n-1} $$](img/609513_1_En_6_Chapter_TeX_Equb.png)\n\n你需要做的第一件事是准备计算所需的值：\n\
  \n- 本金很简单，我们使用从表单获取的值`principal`。唯一需要注意的是，为了简化，我们可以将其放入一个新变量中：\n\n```\n    let p\
  \ = principle;\n    ```\n\n- 值`n`是还款次数。由于我们拥有以年为单位的期限（`term`）和每年的还款次数（`frequency`），总的还款次数就是这两个值的乘积：\n\
  \n`let n = term * frequency;`\n\n- 值`r`是*每期*的利率。由于我们拥有年利率和每年的还款次数，我们需要将两者相除。同时，由于该数字是百分比形式，我们还需要除以`100`：\n\
  \n`let r = rate / frequency / 100;`\n\n我们现在可以将以下代码添加到函数中：\n\n```\nfunction doit(event)\
  \ {\nevent.preventDefault();\n...\nlet p = principal;\nlet n = term * frequency;\n\
  let r = rate / frequency / 100;\n}\n```\n\n下一步是将表达式转换为 JavaScript：\n\n- 第一部分只是值的乘法，因此你可以写成：\n\
  \n`p * r * ...`\n\n- 表达式`(1+r)`^(`n`)表示`(1 + r)`的`n`次方。你可以这样写：\n\n`(1 + r)**n`\n\
  \n在较旧的 JavaScript 中，你需要使用内置函数`Math.pow(1+r, n)`来完成计算。\n\n- 表达式 ![$$ \\frac{something}{something}\
  \ $$](img/609513_1_En_6_Chapter_TeX_IEq1.png) 表示你需要进行除法运算。但是，表达式的分母部分是一个加法运算，你需要将其用括号括起来。\n\
  \n综合起来，公式转换为：\n\n```\np * r * (1+r)**n / ((1+r)**n - 1)\n```\n\n使用较旧的 JavaScript，你需要：\n\
  \n```\np * r * Math.pow(1+r,n) / (Math.pow(1+r,n) - 1)\n```\n\n将代码添加到函数中：\n\n```\n\
  function doit(event) {\n...\nlet repayment = p * r * (1+r)**n / ((1+r)**n - 1);\n\
  }\n```\n\n我们将结果保存到一个新的变量`repayment`中。\n\n### 显示结果\n\n最后，我们需要将结果显示在页面上。还记得那个名为`result`的`output`元素吗？我们可以像写入其他表单元素一样写入它：\n\
  \n有一个`id`为`results`的段落，因此我们需要定位它。我们可以将变量命名为`result`。我们可以在`doit`函数中完成此操作：\n\n```\n\
  function doit(event) {\n...\nlet repayment = p * r * (1+r)**n / ((1+r)**n - 1);\n\
  calculatorForm.elements['result'].value = repayment;\n}\n```\n\n你可能已经注意到结果中存在过多的小数位。这是用复杂数字进行除法运算的结果。你可能只需要保留两位小数。\n\
  \n虽然 JavaScript 确实有一个四舍五入函数（`Math.round`），但它只能四舍五入到整数。无论如何，将数字*显示*为固定的小数位数并不是近似函数的职责。相反，你应该按照你喜欢的格式生成一个*字符串*。\n\
  \n幸运的是，JavaScript 有一个函数可以完成这项工作：`toFixed(...)`。它会将数字转换为指定小数位数的字符串。我们可以直接将其应用于`repayment`变量：\n\
  \n```\nfunction doit(event) {\n...\nlet repayment = p * r * (1+r)**n / ((1+r)**n\
  \ - 1);\ncalculatorForm.elements['result'].value = repayment.toFixed(2);\n}\n```\n\
  \n如果你现在使用默认值进行尝试，应该会得到结果`1798.65`。\n\n## 改进\n\n我们可以做一些事情来让这个计算器表单变得更好。这里，我们只做以下两件事：\n\
  \n- 以本地货币格式显示结果。\n- 为下次使用本地存储这些值。\n\n我们可能会沉迷于次要的改进，但这两个实现起来并不太难。\n\n### 以本地货币格式显示结果\n\
  \n如果你不在澳大利亚阅读本文，你的本地货币可能不同，甚至十进制和长数字的表示方式也可能不同。实际上，过滤输入格式的差异非常困难，但输出格式却相对容易。\n\n\
  #### `Intl` 对象\n\nJavaScript 有一个内置对象叫做`Intl`。它非常强大——事实上，它强大到需要花点功夫才能弄明白它的工作原理。\n\
  \n`Intl`对象能够根据不同的区域设置格式化日期、时间和数字。它甚至可以根据惯例格式化列表。在我们的例子中，我们感兴趣的是将数字格式化为货币。\n\n要使用`Intl`格式化，你需要经过两个步骤。你可以在控制台中实验以了解其工作原理。\n\
  \n首先，创建一个新的`NumberFormat`对象，指定区域设置以及你希望如何处理数字：\n\n```\n»   var numberFormat = Intl.NumberFormat(\n\
  'en-AU',\n{ style: 'currency', currency: 'aud' }\n);\n```\n\n此处，区域设置设置为`en-AU`，表示澳大利亚的英语。这里的关键是区域设置有助于定义小数点（`.`）和千位分隔符（`,`）。如果你在欧洲，比如可能想使用`nl-NL`，这是荷兰使用的格式：小数点与千位分隔符的用法是相反的。\n\
  \n第二个参数是一个选项对象。这里，我们指定希望以货币形式显示数字，使用澳元。货币和区域设置不必匹配。如果你希望以荷兰的数字格式显示澳元，这是可以的：\n\n\
  ```\n»   var numberFormat = Intl.NumberFormat(\n'nl-NL',\n{ style: 'currency', currency:\
  \ 'aud' }\n);\n```\n\n### 格式化数字\n\n当然，你此时还不会得到格式化后的数字。为此，你需要使用该对象的`format()`方法：\n\
  \n```\n»   numberFormat.format(123456.789);\n←   \"$123,456.79\"\n```\n\n\n\n注意该数字已正确四舍五入至两位小数。同时请注意结果是字符串。数值仅含数值本身，不包含货币符号或千位分隔符。若需要此类修饰，则需使用字符串，这对于后续操作而言是可行的。\n\
  \n若打算多次使用该格式化器，可将`format()`方法纳入变量以提升便利性：\n\n```\nvar format = Intl.NumberFormat(\n\
  'en-AU',\n{ style: 'currency', currency: 'aud' }\n).format;\nformat(123456.789);\n\
  // 返回 \"$123,456.79\"\n```\n\n请记住，在 JavaScript 中，函数也是数据对象。你可以像赋值其他对象一样赋值函数。此处，我们将新`NumberFormat`对象的`format()`方法赋值给名为`format`的变量。由于该变量包含的是函数，因此可直接将其作为函数使用。接下来我们将此功能添加到代码中。\n\
  \n原则上，我们可能需要多次重新计算。每次创建新的格式化对象会造成浪费，因此将其创建在`doit()`函数外部：\n\n```\nfunction doCalculator()\
  \ {\nlet calculatorForm = document.querySelector('form#data');\ncalculatorForm.elements['calculate'].onclick\
  \ = doit;\nlet format = Intl.NumberFormat(\n'en-AU',\n{ style: 'currency', currency:\
  \ 'aud' }\n).format;\nfunction doit(event) {\n...\n}\n}\n```\n\n由于已不在控制台环境中，我们将`var`改为`let`。`doit()`函数在每次点击`calculate`按钮时执行。与`calculatorForm`变量类似，它能够访问包含函数中的`format()`函数。\n\
  \n我们不再需要`toFixed()`方法。该方法之前表现尚可，但格式化函数也会对结果进行四舍五入。可将其替换为以下代码：\n\n```\nfunction doit(event)\
  \ {\n...\nlet repayment = p * r * (1+r)**n / ((1+r)**n - 1);\n// calculatorForm.elements['result'].value\
  \ =\n// repayment.toFixed(2);\ncalculatorForm.elements['result'].value = format(repayment);\n\
  }\n```\n\n这样看起来更专业一些。`Intl`对象的功能远不止格式化数字。若想了解其更多用法，可访问[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl)。\n\
  \n**在存储中保存数值**  \n这是一个带有默认值的简单计算器，对用户负担不大。不过，记住这些数值以供下次使用或许会带来便利。你无法将数据保存到磁盘，这是出于安全设计——网页不应能访问用户计算机。但你可以将部分数据保存到浏览器的存储区域。\n\
  \n过去，保存数据会使用浏览器 Cookie，这实际上是对 Cookie 的误用。以下才是 Cookie 的正确使用方式：\n\n1.  用户访问网站，可能输入一些数据或进行搜索。\n\
  2.  服务器响应请求内容，同时通过 Cookie 发送附加数据。\n3.  用户再次访问该网站时，与该网站关联的任何 Cookie 都会返回给服务器。\n\n\
  该过程如图 6-2 所示。\n\n![图 6-2：使用 Cookie](img/609513_1_En_6_Fig2_HTML.png)  \n*与用户设备和服务器相连的云状结构包含以下序列：1.\
  \ 首次访问；2. 响应+Cookie；3. 再次访问+Cookie。*\n\n从一开始，JavaScript 就具备读取、修改甚至创建 Cookie 的能力。这些\
  \ Cookie 会在浏览器再次访问服务器时被发送，即便它们并非源自该服务器。\n\n使用 Cookie 进行本地存储存在两个主要问题：\n\n*   所有与网站相关的\
  \ Cookie 都会被发送到服务器，即便它们是在 JavaScript 中创建且并非真正源自服务器。这意味着你的数据从未真正实现隐私保护。\n\n\n\n##\
  \ 在 JavaScript 中操作 Cookie\n\n在 JavaScript 中操作 Cookie 实际上相当棘手。\n\n## 使用 Web 存储\n\n\
  幸运的是，如今 JavaScript 有了更好的机制用于在浏览器上存储本地数据。这被称为 **web 存储**，有两种形式：\n\n-   **本地存储**会无限期地保存在浏览器中。\n\
  \n本地存储可通过内置对象 `localStorage` 使用。\n\n-   **会话存储**会在浏览器或标签页关闭时自动删除。\n\n会话存储可通过内置对象\
  \ `sessionStorage` 使用。\n\n两者的工作方式相同，因此你只需决定希望数据保留多长时间。在这个例子中，我们将使用 `localStorage`。\n\
  \n`storage` 对象有许多用于设置和获取数据的方法。这里，我们将存储刚才用于计算结果的值：\n\n```\nfunction doit(event) {\n\
  ...\n//  存储值\nlocalStorage.setItem('data', true);\nlocalStorage.setItem('principal',\
  \ principal);\nlocalStorage.setItem('term', term);\nlocalStorage.setItem('frequency',\
  \ frequency);\nlocalStorage.setItem('rate', rate);\n}\n```\n\n当然，这些项目的实际名称可以任意指定，但在这里我们将它们设置为与变量和原始表单数据相同的名称。我们还设置了另一个项目\
  \ `data`。这将使我们下次加载页面时，能够轻松地测试是否有任何数据被存储。\n\n你可以在开发者工具中检查浏览器存储中的内容。对于 Firefox 和 Safari，你可以在“存储”(Storage)\
  \ 部分找到它。在 Chromium 中，则位于“应用程序”(Application) 部分的“存储”(Storage) 部分。你会看到类似下面的内容：\n\n\
  | 键 (Key) | 值 (Value) |\n| :--- | :--- |\n| `data` | `true` |\n| `frequency` | `12`\
  \ |\n| `principal` | `300000` |\n| `rate` | `6` |\n| `term` | `30` |\n\n下一步是从存储中重新填充这些值。我们在页面加载时执行此操作，也就是运行\
  \ `doCalculator()` 函数时。当然，这只有在之前有保存的值时才有效。这就是 `data` 项目的用武之地：\n\n```\nfunction doCalculator()\
  \ {\n...\n//  恢复值\nif(localStorage.getItem('data')) {\n}\nfunction doit(event) {\n\
  ...\n}\n}\n```\n\n`.getItem()` 方法简单地通过项目名称获取一个值。如果某个项目不存在，`.getItem()` 会返回 `null`，众所周知，这是一个假值。`if()`\
  \ 语句检查它是否为真值。我们本可以测试其他任何项目来达到此目的，但如果有专门的值来检查，则更容易理解和维护。\n\n恢复这些项目虽然繁琐但很简单。只需为每个值调用\
  \ `.getItem()` 方法，并将这些值放入相应的表单字段中：\n\n```\nfunction doCalculator() {\n...\n//  恢复值\n\
  if(localStorage.getItem('data')) {\ncalculatorForm.elements['principal'].value =\n\
  localStorage.getItem('principal');\ncalculatorForm.elements['term'].value =\nlocalStorage.getItem('term');\n\
  calculatorForm.elements['frequency'].value =\nlocalStorage.getItem('frequency');\n\
  calculatorForm.elements['rate'].value =\nlocalStorage.getItem('rate');\n}\n...\n\
  }\n```\n\n要尝试此功能：\n\n-   更改部分数值并计算结果。\n-   返回主页。\n-   现在返回到计算器页面，检查先前的数值是否已被恢复。\n\
  \nWeb 存储的优点在于它不仅易于使用，而且也很安全。至少它和你使用的浏览器一样安全：如果其他人能够接触到你的浏览器，他们仍然可以检查存储的内容。因此，你永远不应以这种方式存储任何真正敏感的信息。至少它不会被发送回\
  \ Web 服务器。\n\n## 使用数组处理\n\n恢复数值的那部分代码包含大量重复。每当出现代码重复时，就有可能进行简化。在这个例子中，重复操作涉及对四个项目做相同的事情。\n\
  \n我们可以通过将这些值放入一个数组 `items` 中来稍微简化：\n\n```\n['principal','term','frequency','rate']\n\
  ```\n\n要遍历数组，我们可以使用计数器循环。你可以在控制台中尝试一下。\n\n\n```javascript\nvar items = ['principal','term','frequency','rate'];\n\
  for(var i=0; i<items; i++) {\nconsole.log(item);\n}\n```\n\n在现代 JavaScript 中，你可以使用一个名为\
  \ `.forEach()` 的数组方法：\n\n```javascript\nvar items = ['principal','term','frequency','rate'];\n\
  items.forEach(function(item) {\nconsole.log(item);\n});\n```\n\n如你所见，`.forEach()`\
  \ 方法接收一个带有一个或多个参数的函数。第一个参数（也是最常用的参数）是数组中的每一项。既然我们在使用现代 JavaScript，那么使用箭头函数表达式也很常见：\n\
  \n```javascript\nvar items = ['principal','term','frequency','rate'];\nitems.forEach(item\
  \ => {\nconsole.log(item);\n});\n```\n\n在箭头函数表达式中，`item =>` 替代了 `function(item)`。虽然它并没有简短多少，但对于简单的任务来说，它可以非常简洁。\n\
  \n如果我们要立即使用数据，则无需将数据保存在单独的变量中。你可以将 `.forEach()` 方法应用于数组字面量：\n\n```javascript\n['principal','term','frequency','rate'].forEach(item\
  \ => {\nconsole.log(item);\n});\n```\n\n我们可以用这个方法来替换代码中用于恢复值的部分：\n\n```javascript\n\
  // 恢复值\nif(localStorage.getItem('data')) {\n/*\n...\n*/\n['principal','term','frequency','rate'].forEach(item\
  \ => {\ncalculatorForm.elements[item].value =\nlocalStorage.getItem(item);\n});\n\
  }\n```\n\n在测试新版本时，其他代码已被注释掉。一旦你确认新代码运行正常，就可以删除被注释的代码。\n\n遗憾的是，你无法对用于存储值的代码做同样的处理。这是因为你想要存储的数据在变量中，而\
  \ JavaScript 没有简单的方法来遍历普通变量。\n\n## 使用对象存储数据\n\n如果你*真的*想遍历计算器中使用的变量，有一种间接方法。你已经接触过\
  \ `Math` 对象了。它本质上是一个包含数学计算所需的实用函数和数据的包。你可以轻松地创建自己的对象来完成同样的工作。\n\n我们可以在控制台中尝试：\n\n\
  ```javascript\nvar data = {};\ndata.principal = 300000;\ndata.term = 30;\ndata.frequency\
  \ = 12;\ndata.rate = 6;\n```\n\n在 JavaScript 中，你可以通过赋值一个**对象字面量**来创建新对象，对象字面量是包含在花括号\
  \ (`{ ... }`) 中的一组数据。在这个例子中，新对象是一个空对象。然后，你可以像示例所示那样，为其分配新的属性和值。\n\n在控制台中，你可以使用 `console.log()`\
  \ 打印出这个对象：\n\n```javascript\nconsole.log(data);\n```\n\n我们还可以将其与数组遍历结合，以列出对象的全部内容：\n\
  \n```javascript\n['principal','term','frequency','rate'].forEach(item => {\nconsole.log(`${item}:\
  \ ${data[item]}`);\n});\n```\n\n我们使用了模板字符串字面量来包含属性名和来自 `data` 对象的值。请注意，我们对对象成员使用了方括号表示法。记住，它是点表示法的一种替代方案，允许我们使用变量。\n\
  \n在我们的计算器代码中，我们可以用对象属性来替换四个主要变量的实例。首先，我们可以使用 `.forEach()` 循环来获取并检查数据：\n\n```javascript\n\
  function doit(event) {\nevent.preventDefault();\nlet data = {};\n['principal','term','frequency','rate'].forEach(item\
  \ => {\ndata[item] = calculatorForm.elements[item].value.trim();\ndata[item] = parseFloat(data[item])\
  \ || 0;\ncalculatorForm.elements[item].value = data[item];\n});\n...\n}\n```\n\n\
  公式中使用的变量随后可以使用这些对象属性，而不是之前的变量：\n\n```javascript\nfunction doit(event) {\nevent.preventDefault();\n\
  ...\nlet p = data.principal;\nlet n = data.term * data.frequency;\nlet r = data.rate\
  \ / data.frequency / 100;\n...\n}\n```\n\n最后，你可以用同样的方式存储值：\n\n```javascript\nfunction\
  \ doit(event) {\nevent.preventDefault();\n...\n['principal','term','frequency','rate'].forEach(item\
  \ => {\nlocalStorage.setItem(item, data[item]);\n});\n}\n```\n\n最终的代码看起来像这样：\n\n\
  ```javascript\nfunction doit(event) {\nevent.preventDefault();\nlet data = {};\n\
  ['principal','term','frequency','rate'].forEach(item => {\ndata[item] = calculatorForm.elements[item].value.trim();\n\
  data[item] = parseFloat(data[item]) || 0;\ncalculatorForm.elements[item].value =\
  \ data[item];\n});\nlet p = data.principal;\nlet n = data.term * data.frequency;\n\
  let r = data.rate / data.frequency / 100;\n// 不受影响的部分：\nlet repayment = p * r *\
  \ (1+r)**n / ((1+r)**n - 1);\ncalculatorForm.elements['result'].value =\nformat(repayment);\n\
  // 存储值\nlocalStorage.setItem('data', true);\n['principal','term','frequency','rate'].forEach(item\
  \ => {\nlocalStorage.setItem(item, data[item]);\n});\n}\n```\n\n将数据保存在对象中而不是单独的变量中，不仅有助于遍历这些值，还可以简化对过多变量的管理，并便于将数据存储起来供以后使用。这也是一种在位置之间传输数据的便捷方式，例如从网络服务器获取数据。\n\
  \nJavaScript 最近新增了一个 **Map** 对象，它更专门地用于以这种方式存储数据。不过，它使用起来并不那么方便。\n\n## 总结\n\n在本章中，我们了解了如何处理表单数据并存储数据。为了实践这个思路，我们开发了一个简单的计算器来计算抵押贷款还款额。\n\
  \n### 获取表单数据\n\n一个网页表单包含一个 `elements` 集合，该集合引用了所有的 `input` 和 `output` 元素。你可以使用“点”表示法或“方括号”表示法来引用单个元素，但方括号表示法更灵活、更一致。\n\
  \n要引用单个元素，你可以使用类似 `form.elements['...']` 的表达式。然而，这样会得到元素本身；你可能真正想要的是该元素中的值，这时需要使用像\
  \ `form.elements['...'].value` 这样的表达式。\n\n所有表单数据都以字符串形式提供。如果你想执行数值计算，你应该对数据进行类似\
  \ `parseInt()` 或 `parseFloat()` 的处理，这会将字符串解析为数字。\n\n来自表单的数据不一定合适，因此你需要检查每个值，并可能默认设置为合适的数值。\n\
  \n通常情况下，表单应该将数据提交到服务器上的外部进程。然而，我们可以使用 `event.preventDefault()` 方法来拦截这个过程，它可以阻止表单的默认行为。有时，这是有条件执行的，例如当表单数据未能通过某种验证检查时。在这种情况下，表单本就不该发送数据。\n\
  \n### 执行计算\n\n专用计算器的全部意义在于能够执行那些过于复杂的计算。寻找合适的公式可能需要一些研究，并且公式并不总是对代码友好。\n\n另一个问题是，有时公式对人类也不友好。部分任务在于获取用户期望输入的数值，并对其进行调整以满足公式要求。\n\
  \n最后，公式可能需要转换为 JavaScript 表达式。\n\n### 显示结果\n\n`output` 元素允许你设置一个值显示在表单上。然而，有时计算出的结果格式并不合适，例如小数位数过多，失去了意义。\n\
  \n`.toFixed()` 方法可以将数字格式化为固定的小数位数。结果实际上是一个字符串，这非常适合用于输出。\n\n你可以使用 `Intl` 对象获得更灵活的结果，该对象可以根据特定的区域设置和其他偏好来格式化数字、日期以及其他数据。在这个例子中，我们根据区域设置将数字格式化为货币格式。结果同样是一个字符串。\n\
  \n\n### 存储数据\n\n`JavaScript` 无法将数据存储到用户的磁盘上，但可以将数据存储在浏览器中。过去，这一功能是通过 cookie 实现的，不过\
  \ cookie 并非为此用途而设计。\n\n如今我们可以使用 Web 存储，它既支持短期存储，也支持长期存储。这使得我们能够保存数值，以便在下次访问页面时加载。\n\
  \n由于 `storage` 对象使用键来存储值，我们可以使用键名数组并遍历该数组来简化重复操作。\n\n普通变量无法以这种方式遍历，但我们可以创建一个简单对象，将值存储在对象属性中，而不是使用简单变量。在遍历键名数组时，可以引用这些对象属性。\n\
  \n## 后续内容\n\n接下来的几个项目将对页面上显示的内容进行重大调整。在某些情况下，我们会创建新的 HTML 元素；在某些情况下，我们会显示和隐藏它们；而在另一些情况下，我们会持续更改这些元素的内容。\n\
  \n在此之前，我们需要进一步了解如何操作 CSS 样式，以及 JavaScript 如何响应用户事件。\n\n## 脚注\n\n### 7. 与 CSS 和事件监听器的交互\n\
  \n在幻灯片项目以及后续项目中，我们都依赖 CSS 来完成大部分工作。CSS，即**层叠样式表**，是一种主要控制页面内容外观的语言。你无需成为 CSS 专家也能完成这些工作，但应该了解一些基本概念，以便理解其工作原理并能轻松进行调整。\n\
  \n在此，我们将探讨：\n\n* CSS 的背景\n* CSS 能做什么\n* 使用事件监听器函数响应用户事件\n* 如何使用 JavaScript 与 CSS\
  \ 交互\n* 使用 JavaScript 创建额外的 CSS 样式\n* CSS 动画效果\n\n你可以使用浏览器的开发者工具同时实验 CSS 和 JavaScript。有一个示例文件\
  \ `sample-css.html` 供你尝试，以及它的 CSS 文件 `sample-css.css`。\n\n该示例文件如图 7-1 所示。\n\n![](img/609513_1_En_7_Fig1_HTML.jpg)\n\
  \nCSS 示例页面的屏幕截图。顶部是一张照片，下方是标题和示例按钮。\n\n**图 7-1** CSS 示例文件\n\n在我们尝试这些概念（尤其是样式和事件监听器）时，文档可能会积累一些不必要的冗余。此时，重新加载页面是你的好朋友，可以让你重新开始。\n\
  \n### 什么是 CSS？\n\n最初的 HTML 并没有包含任何严格控制页面内容外观的方式。早期的尝试包括 `font` 元素；关于这一点，越少提越好。\n\
  \n后来 CSS 语言得以发展。CSS 控制颜色、字体样式、定位，甚至控制内容的可见性。它已经发展到包含一些视觉效果，例如阴影、圆角，以及控制物体不透明度的能力。\n\
  \n随着 CSS 的发展，它还增加了对这些属性变化进行动画处理的能力，无论是简单的过渡还是多步动画。\n\n过去，其中一些功能（例如显示和隐藏元素或对它们的属性进行动画处理）是由\
  \ JavaScript 完成的。在部分项目中，你将向文档添加新的元素。如果你不断添加和移除对象，这本身就是一种显示和隐藏的形式，但代价是需要大量额外的编码，并且浏览器需要处理不断变化或缺失的元素，从而增加了额外的工作负担。\n\
  \n同样，我们创建了一个幻灯片，它依次显示图像。如果你切换得足够快，就可以形成动画，但这同样意味着需要大量额外的编码和浏览器工作量。\n\n现在，CSS 为我们提供了无需编写\
  \ JavaScript 就能完成这些工作的工具。然而，CSS 无法做到的是与用户交互，或根据情况自行决定事件发生的时间和方式。这正是 JavaScript 的用武之地。\n\
  \n### 在 HTML 中添加 CSS\n\n\n\n通常，CSS 会被添加到一个单独的 CSS 文档中，然后通过 HTML 的 `link` 元素进行链接。你可以在\
  \ `sample-css.html` 中看到这一点：\n\n```\n这里，`href` 属性指向样式表。无论在理论上还是实践中，`href` 都可以是一个指向不同网站的完整\
  \ URL。通常不需要 `id`，但我们后续可以利用它来实现一些效果。\n```\n\n样式也可以包含在 HTML 的 `style` 元素中：\n\n```\n\
  /* 样式规则 ... */\n```\n\n这种方式比外部样式表更难以管理，因此在正常情况下应避免使用。然而，有时你可能需要在页面中使用自定义的样式块。你也可以在\
  \ JavaScript 中创建一个 `style` 元素，效果是等同的。稍后你将看到更多关于创建 `style` 元素的内容。\n\n最后，你可以使用 `style`\
  \ 属性为元素分配样式：\n\n```\nHello\n```\n\n这被称为内联样式，是实现方式中最繁琐的一种。由于它是在其他样式表之后应用的，因此也是最难以覆盖的。不过，在\
  \ JavaScript 中设置此属性仍然很有用。\n\n## 禁用样式\n\n你可以通过设置 `disabled` 属性来禁用某个样式块或链接的样式表。通常你不需要在纯\
  \ HTML 中这样做，但可以借助 JavaScript 来打开或关闭此属性。这就是之前的例子中包含 `id` 属性的原因之一——以便让 JavaScript\
  \ 能够修改链接。\n\n例如：\n\n```\n»   var link = document.querySelector('link#sample-css');\n\
  »   link.disabled = true;\n```\n\n你可以通过将该属性设置为 `false` 来重新激活样式表或样式块：\n\n```\n» \
  \  link.disabled = false;\n```\n\n像这样打开和关闭样式表，可以让你响应例如用户偏好之类的需求。你可能有一个额外字号或不同颜色的样式表。\n\
  \n### 事件监听器\n\n与网页交互需要设置事件监听器。事件监听器是一个函数，它会响应用户触发的事件（例如点击某处或按下某个键）而运行。\n\n你可以直接使用元素的事件属性来分配事件监听器。例如：\n\
  \n```\n»   function doit() {\nconsole.log(h1.textContent);\n}\n»   var h1 = document.querySelector('h1');\n\
  »   h1.onclick = doit;\n```\n\n这里，事件属性是 `onclick`，当用户点击该元素时会被触发。在支持触摸的设备上，它同样会响应触摸，因此不一定是仅限鼠标的事件。当你点击或触摸标题时，该函数会打印出标题的文本。正如我们在前几章所述，不要将属性写成\
  \ `onClick`、`onlick` 或其他任何变体。\n\n如果你想要移除事件监听器，可以将 `null` 赋值给它：\n\n```\n»   h1.onclick\
  \ = null;\n```\n\n你也可以使用 `addEventListener` 来分配事件监听器：\n\n```\n»   h1.addEventListener('click',doit);\n\
  ```\n\n第二种方法显然更复杂，但它使得分配多个事件监听器以及改变其在嵌套元素中的响应方式成为可能。有些事件甚至没有简单的 `onsomething` 版本。由于前面展示的\
  \ `doit` 函数是专门附加到 `h1` 元素上的，在函数内部再次引用 `h1` 就显得重复了。为此，你需要多了解一些关于事件目标的知识。\n\n如果你想要移除通过这种方式添加的事件监听器，可以使用\
  \ `removeEventListener()`：\n\n```\n»   h1.removeEventListener('click',doit);\n```\n\
  \n用这种方式移除事件监听器有一个陷阱，我们将在关于嵌套事件监听器的部分看到。使用 `.addEventListener()` 是添加事件监听器的首选方式。然而，在接下来的实验中，你可能需要多次添加事件监听器。这会导致单个事件上产生许多动作。对于每个新章节，请务必移除之前添加的事件监听器。或者，你也可以重新加载页面。\n\
  \n### 事件目标\n\n当你触发一个事件监听器时，你需要知道是什么实际触发了它。\n\n例如，在示例文件中，有一个包含图片和标题的 `figure` 元素：\n\
  \n```\n...\n```\n\n你当然可以为前面展示的任何元素分配一个事件监听器，但让我们看看如果将其分配给 `figure` 元素会发生什么：\n\n\
  ```\n»   function doit(event) {\nconsole.log(this);\nconsole.log(event.target);\n\
  console.log(event.currentTarget);\n}\n»   var figure = document.querySelector('figure');\n\
  »   figure.addEventListener('click',doit);\n```\n\n`doit()` 函数包含一个参数 `event`，它包含事件的详细信息以及控制事件的方法。在函数内部，有三个重要的值：\n\
  \n*   `this` 是一个魔法变量，指向持有事件监听器函数的对象；在这个例子中，它是 `figure` 元素。\n*   `event.target` 是你实际点击的元素。\n\
  *   `event.currentTarget` 是持有事件监听器函数的元素；在*大多数*情况下，它与 `this` 相同，但并非总是如此。\n\n如果你点击图片或标题，你会得到\
  \ `<img>` 或 `<figcaption>`。\n\n如果你点击图片周围的空间，你会得到 `<figure>`。\n\n在所有情况下，`this` 和\
  \ `event.currentTarget` 都是容器 `figure`。`event.target` 的值取决于你实际点击的是哪个元素。虽然写 `this`\
  \ 显然比 `event.currentTarget` 更方便，但它的实际值会根据函数的调用方式而变化，因此在后续代码中，我们将坚持使用 `event.currentTarget`\
  \ 或 `event.target`。\n\n上一节的例子现在可以写成：\n\n```\n»   h1.removeEventListener('click',\
  \ doit);   // 移除旧的\n»   function doit(event) {\nconsole.log(event.target.textContent);\n\
  }\n»   var h1 = document.querySelector('h1');\n»   h1.addEventListener('click',\
  \ doit);\n```\n\n通过将 `h1` 替换为 `event.target`，你使事件监听器更具可复用性。你也可以将它分配给多个元素，让代码自动判断你点击的是哪个元素。\n\
  \n### 嵌套事件目标\n\n你已经看到，点击图片也会触发包含它的 `figure` 元素的点击事件。这是设计使然，但并非总是你想要的。有时，你可能希望点击图片时事件就止步于此。\n\
  \n在此之前，我们需要理解点击事件是如何传播的。当你点击一个嵌套在另一个元素内部的元素时，被点击的元素以及所有包含它的元素都会感知到此次点击。点击事件的传播分两个阶段进行。首先，点击事件从外向内传播，从外层元素到内层元素。这被称为**事件捕获**阶段，如图\
  \ 7-2 所示。\n\n![嵌套事件目标的可视化表示。三个方块嵌套在一起，一个在另一个内部。第一个方块上标有“捕获”。](img/609513_1_En_7_Fig2_HTML.png)\n\
  \n*图 7-2 事件捕获*\n\n然后它进入**目标**阶段，这个阶段涉及你实际点击的元素。\n\n之后，点击事件从内向外传播，从内层元素到外层元素。这被称为**事件冒泡**，如图\
  \ 7-3 所示。\n\n![嵌套事件目标的可视化表示。三个方块嵌套在一起，一个在另一个内部。第一个方块上标有“冒泡”。](img/609513_1_En_7_Fig3_HTML.png)\n\
  \n*图 7-3 事件冒泡*\n\n大多数时候，你更关注的是冒泡阶段，即从被点击的元素开始。当你直接使用 `onclick` 属性或默认的 `addEventListener()`\
  \ 方法时，事件监听器只会响应冒泡阶段。\n\n你可以使用带有可选参数的 `addEventListener()` 来让事件监听器监听捕获阶段：\n\n```\n\
  addEventListener('click', doit, true);\n```\n\n\n```markdown\n第三个参数可以包含其他选项，但使用`true`表示它应该监听捕获阶段；其默认值为`false`，这也是为什么它默认监听冒泡阶段。\n\
  \n你可以通过在多个元素上添加相同的事件监听器来测试冒泡阶段和捕获阶段。我们将使用`<figure>`和嵌套的`<img>`元素进行测试。在这个实验中，我们将使用`.currentTarget`属性，它会告诉我们正在响应的是哪个事件监听器。\n\
  \n在进行测试之前，你需要确保当前的事件监听器已被移除：\n\n```\nfigure.removeEventListener('click',doit);\n\
  ```\n\n我们还需要获取对嵌套图片的引用：\n\n```\nvar img = figure.querySelector('img');\n```\n\n\
  现在，重新定义`doit()`函数：\n\n```\nfunction doit(event) {\nconsole.log(event.currentTarget);\n\
  }\n```\n\n首先，将事件监听器添加到冒泡阶段。这是默认行为，但我们会通过将最后一个参数设置为`false`来明确这一点：\n\n```\nfigure.addEventListener('click',\
  \ doit, false);\nimg.addEventListener('click', doit, false);\n```\n\n当你点击图片时，你会看到两个元素都调用了事件监听器，但`img`元素会先响应：\n\
  \n现在移除事件监听器。当你移除事件监听器时，它必须在事件类型（`click`）、事件监听器函数（`doit`）以及监听器类型（`false`）上与已添加的事件监听器完全匹配。如果任何一项不同，则事件监听器将无法被成功移除。由于`false`是默认类型，你不需要显式指定它，但我们仍会这样做：\n\
  \n```\nfigure.removeEventListener('click', doit, false);\nimg.removeEventListener('click',\
  \ doit, false);\n```\n\n现在，将第三个参数设置为`true`来添加它们，以在捕获阶段调用：\n\n```\nfigure.addEventListener('click',\
  \ doit, true);\nimg.addEventListener('click', doit, true);\n```\n\n当你点击图片时，你现在会看到响应以相反的顺序出现：\n\
  \n同样，要移除事件监听器，你需要使用`removeEventListener()`，并匹配所有三个参数：\n\n```\nfigure.removeEventListener('click',\
  \ doit, true);\nimg.removeEventListener('click', doit, true);\n```\n\n在第[8]章中，我们需要注意元素的传播顺序。\n\
  \n### 停止传播\n\n你可以阻止事件函数进一步处理。例如，你可以决定只处理最内层的元素，或只处理最外层的元素。\n\n你可以使用`stopPropagation()`方法来阻止进一步的处理。例如，如果你只想处理图片，可以这样使用：\n\
  \n```\nfunction doit(event) {\nevent.stopPropagation();\nconsole.log(event.currentTarget);\n\
  }\nfigure.addEventListener('click', doit, false);\nimg.addEventListener('click',\
  \ doit, false);\n```\n\n如果你现在点击图片，输出中你将只会得到图片，即最内层的元素。你现在可以再次移除事件监听器：\n\n```\nfigure.removeEventListener('click',\
  \ doit, false);\nimg.removeEventListener('click', doit, false);\n```\n\n如果你只想让`figure`元素响应，你可以通过将第三个参数设置为`true`来使用捕获阶段。\n\
  \n## 直接修改 CSS 样式\n\nJavaScript 可以使用元素的`style`属性直接访问元素的 CSS 样式。例如：\n\n```\nvar h1\
  \ = document.querySelector('h1');\nh1.style.color = 'red';\n```\n\n设置`style`属性类似于在\
  \ HTML 中使用内联样式：\n\n```\nThis is a heading\n```\n\n你可以读取通过这种方式设置的属性：\n\n```\nh1.style.color\n\
  ←   red\n```\n\n但是，只有通过直接设置方式获得的属性才能以这种方式读取。通过常规 CSS 设置的属性无法通过这种方式读取。与内联样式一样，`style`属性在所有其他样式之后应用，因此你无法通过其他\
  \ CSS 样式表覆盖它。这对于一些简单的属性来说没问题，但不够灵活，稍后你将看到如何更好地与样式表协同工作。\n\n`style`属性是一个**对象**，它本身是一个包含自身属性的数据包。JavaScript\
  \ 有两种寻址属性的方式：\n\n```\nvar h1 = document.querySelector('h1');\nh1.style.color = 'red';\
  \         //  点号表示法\nh1.style['color'] = 'green';    //  方括号表示法\n```\n\n第一种表示法，通常被称为**点号表示法**，原因显而易见，它更简单，但有一些局限性。第二种表示法，同样出于显而易见的原因被称为**方括号表示法**，它克服了这些局限性。\n\
  \n第一个局限性在 CSS 中最为明显，即点号表示法不允许使用在 JavaScript 中无效的属性名。例如，`background-color`属性包含一个连字符，这在\
  \ JavaScript 中是不允许的，因为它会被解释为减法运算。此时，方括号表示法就派上了用场：\n\n```\nvar h1 = document.querySelector('h1');\n\
  h1.style.background-color = 'yellow';       //  错误\nh1.style['background-color']\
  \ = 'orange';    //  有效\nh1.style.backgroundColor = 'purple';        //  camelCase\
  \ 写法\n```\n\n正如你所见，带连字符的 CSS 属性可以替换为驼峰式（camelCase）写法。然而，为了与标准 CSS 保持一致，我们将优先使用方括号表示法。\n\
  \n点号表示法的第二个局限性是属性名是硬编码的。你不能为属性使用变量。而方括号表示法则允许你使用变量来代替字符串字面量。\n\n你可能会想，既然颜色应该在 CSS\
  \ 中设置，为什么还要用 JavaScript 来改变颜色呢？原因是 CSS 只设置一次属性，而 JavaScript 可以用于与用户交互，因此你可以轻松地将其设置为其他值。\n\
  \n例如，你可以通过这种方式切换标题的颜色：\n\n```\nvar h1 = document.querySelector('h1');\nfunction\
  \ doit(event) {\nif(event.target.style['color'] != 'yellow')\nevent.target.style['color']\
  \ = 'yellow';\nelse event.target.style['color'] = 'orange';\n}\nh1.addEventListener('click',doit);\n\
  ```\n\n这段代码中存在一些重复。我们可以对此进行改进，但这需要一点小小的迂回。\n\n### 重置属性\n\n如果你想移除通过这种方式设置的属性，可以将其设置为`null`或空字符串（`''`）：\n\
  \n```\nh1.style['color'] = null;               //  或 ''\nh1.style['background-color']\
  \ = null;    //  或 ''\n```\n\n这将使元素回退到之前在 CSS 中设置的属性。\n\n与此同时，我们还应该移除事件监听器：\n\n\
  ```\nh1.removeEventListener('click',doit);\n```\n\n如果我们不移除事件监听器，我们所有额外的实验都会堆积更多的事件监听器，导致元素以多种方式响应。\n\
  \n用这种方式设置颜色可能不是一个好主意，因为你更愿意在其他地方做艺术决策。然而，这种技术可以用于显示或隐藏元素，正如你将在接下来的项目中看到的那样。如果你希望\
  \ JavaScript 更改一些更艺术性的属性，你可以使用关于类（classes）和样式表（style sheets）部分中介绍的技术。\n\n## 存储状态\n\
  \n在前面的例子中，我们在决定如何处理颜色之前，测试了颜色是否已经被设置。除了繁琐之外，这种技术也硬编码了太多值。\n\n一种更好的技术是将我们所做的存储在一个单独的变量中。我们将其称为**状态**变量。\n\
  \n一个简单的方法是在函数外部创建一个变量，并在函数内部测试和设置它：\n\n```\nvar h1 = document.querySelector('h1');\n\
  var modified = false;\nfunction doit(event) {\nif(!modified) event.target.style['color']\n\
  = 'yellow';\nelse event.target.style['color'] = null;\nmodified = !modified;\n}\n\
  h1.addEventListener('click',doit);\n```\n\n当你完成测试后，移除事件监听器：\n\n```\nh1.removeEventListener('click',doit);\n\
  ```\n```\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n## 优化代码\n\n我们可以改进之前展示的代码。如果基于测试条件来设置值，可以简化这个过程。\n\
  \n### 条件运算符\n\nJavaScript 有一个**条件运算符**（也称为**三元运算符**），它将测试与值的选择结合起来。例如：\n\n```\n\
  »   var a = 3, b = 4;\n»   a == b ? 'yes' : 'no';\n←   \"no\"\n```\n\n条件运算符包含三个部分。第一部分是测试，可以使用在`if()`或`while()`语句中使用的任何表达式。第二部分是如果测试结果为`true`或真值时的值。第三部分是测试结果为假时的值。\n\
  \n我们可以使用条件运算符重写之前的代码：\n\n```\n»   var h1 = document.querySelector('h1');\n»   var\
  \ modified = false;\n»   function doit(event) {\nevent.target.style['color'] =\n\
  !modified ? 'yellow' : null;\nmodified = !modified;\n}\n»   h1.addEventListener('click',doit);\n\
  ```\n\n这不仅更简单，而且使意图更清晰。\n\n测试完成后，移除事件监听器：\n\n```\n»   h1.removeEventListener('click',doit);\n\
  ```\n\n### 静态变量\n\n在某个时候，你可能会听说`JavaScript`不支持静态变量，从技术上讲，这是正确的。\n\n在支持静态变量的语言中，函数变量可以在调用之间保留其值。例如，你可能会像这样编写代码：\n\
  \n```\n»   //  This doesn't work:\n»   function test() {\nstatic var value;\nvalue\
  \ = value ? value+1 : 1;\nconsole.log(value);\n}\n»   test();\n»   test();\n»  \
  \ test();\n```\n\n从注释中可以看出，这在`JavaScript`中无法工作。这是因为`JavaScript`确实不支持静态变量。但是，如果你利用所有`JavaScript`函数在技术上都是对象这一事实，你可以*模拟*静态变量。这意味着它们具有属性，并且你可以根据需要添加更多属性。\n\
  \n为了使之前的示例正常工作，我们将`value`变量更改为函数的`.value`属性：\n\n```\n»   function test() {\ntest.value\
  \ ??= 0;       //  undefined → 0\ntest.value ++;\nconsole.log(test.value);\n}\n\
  »   test();\n»   test();\n»   test();\n```\n\n如果尝试读取不存在的属性（例如`test.value`），第一次你会得到`undefined`，记住，除非你尝试在计算中使用它，否则这不是错误。第一次运行时，你需要检查这一点，如果它是`undefined`，则为其赋予一个实际值。\n\
  \n你可以使用像这样的语句：\n\n```\n»   if(test.value === undefined) test.value = 0;\n```\n\n\
  你需要使用恒等运算符（`===`）来避免将`undefined`与其他假值混淆。然而，当你习惯后，使用前面显示的较短表达式会更简单且更具可读性。\n\n在`JavaScript`中，这是**空值合并运算符**，它专门测试第一个值是否为`null`或`undefined`，这避免了混淆。你可以像这样测试它：\n\
  \n```\n»   undefined ?? 23\n←   23\n```\n\n你可以将其与赋值运算符结合，创建**空值合并赋值运算符**（`??=`）。\n\
  \n我们可以使用相同的技术来省去事件监听器中的状态变量：\n\n```\n»   var h1 = document.querySelector('h1');\n\
  »   //  var modified = false;   //  not needed\n»   function doit(event) {\ndoit.modified\
  \ ??= false;\nevent.target.style['color'] =\n!doit.modified ? 'yellow' : null;\n\
  doit.modified = !doit.modified;\n}\n»   h1.addEventListener('click',doit);\n```\n\
  \n这使函数更加自包含，因为它不依赖外部变量来维护状态。\n\n测试完成后，移除事件监听器：\n\n```\n»   h1.removeEventListener('click',doit);\n\
  ```\n\n## 动态 CSS 更改\n\n因为现在`JavaScript`深度参与其中，你可以以更有趣的方式变化样式。例如，这将随机更改背景颜色：\n\n\
  ```\n»   var h1 = document.querySelector('h1');\n»   var colours\n= ['red','orange','yellow','green','blue','violet'];\n\
  »   function doit(event) {\n//  random index\nvar i = Math.floor(Math.random() *\
  \ colours.length);\nevent.target.style['background-color'] = colours[i];\n}\n» \
  \  h1.addEventListener('click',doit);\n```\n\n`colours`变量只是一个颜色名称数组。变量`i`是一个随机数，将用作数组的索引。当你点击标题时，其背景颜色将设置为随机颜色。这绝对是`CSS`本身无法做到的。\n\
  \n测试完成后，移除事件监听器：\n\n```\n»   h1.removeEventListener('click',doit);\n```\n\n如果你不喜欢最终得到的颜色，也可以移除它：\n\
  \n```\n»   h1.style['background-color'] = null;\n```\n\n## 读取其他 CSS 属性\n\n如果你开始篡改各个`CSS`属性，将会丢失已精心添加到页面中的原始`CSS`设置。你可以读取这些属性，也许是为了恢复你的更改。例如，我们可以将标题背景颜色在新颜色和原始颜色之间切换，无论原始颜色是什么。\n\
  \n如果你一直在跟随操作，可能会发现自己积累了多个事件监听器。此时，如果重新加载页面，所有这些都将被清除。\n\n要读取元素的所有可用`CSS`属性，你可以使用`window.getComputedStyle(element)`，或简写为`getComputedStyle(element)`。例如：\n\
  \n```\n»   var h1 = document.querySelector('h1');\n»   var styles = getComputedStyle(h1);\n\
  »   console.log(styles['background-color']);\n```\n\n`getComputedStyle(element)`的结果是一个对象，包含应用于元素的所有`CSS`属性，无论它们是继承的、有意设置的，还是（更可能是）两者兼有。在这种情况下，我们想要`background-color`属性，它是在`styles.css`样式表中设置的。\n\
  \n我们可以将其存储在变量中，并将其用于切换：\n\n```\n»   var h1 = document.querySelector('h1');\n»  \
  \ var styles = getComputedStyle(h1);\n»   var originalColour = styles['background-color'];\n\
  »   function doit(event) {\ndoit.modified ??= false;\nevent.target.style['background-color']\
  \ =\n!doit.modified ? 'yellow' : originalColour;\ndoit.modified = !doit.modified;\n\
  }\n»   h1.addEventListener('click',doit);\n```\n\n通常，如果你要在`JavaScript`中更改原始`CSS`属性，记录它们始终是一个好主意。\n\
  \n不要忘记为将来的实验移除事件监听器和颜色。或者，你可以直接重新加载页面。\n\n```\n»   h1.removeEventListener('click',doit);\n\
  »   h1.style['background-color'] = null;\n```\n\n## 使用 CSS 样式表\n\n直接更改样式的主要问题是，决策是在`JavaScript`中做出的，并由`JavaScript`开发者实现。在许多情况下，这些是艺术决策，应该由设计师在`CSS`中做出。即使两个角色由同一个人担任，你也应该将`JavaScript`逻辑与艺术风格分离。\n\
  \n最简单的方法是在`CSS`样式表中设置所有样式，并使用类来区分不同的状态。然后在`JavaScript`中更改类的值。\n\n例如，在`sample-css.css`样式表中，你会找到类似这样的内容：\n\
  \n```\nh1.different-color {\ncolor: #dac1a4;\n}\nh1.different-background {\nbackground-color:\
  \ #587272;\n}\n```\n\n你会注意到有两个不同的类，每个类都有自己的属性。如果你希望应用其中任何一个类，可以在`HTML`中添加以下内容：\n\
  \n```\n ... \n```\n\n你甚至可以添加多个类：\n\n```\n ... \n```\n\n但是，这仅在你想使其永久生效时才有效。如果你想动态更改类，可以在`JavaScript`中执行：\n\
  \n```\n»   var h1 = document.querySelector('h1');\n»   h1.className = 'different-color';\n\
  ```\n\n如果你想应用多个类，只需列出它们即可。\n\n\n```javascript\nvar h1 = document.querySelector('h1');\n\
  h1.className = 'different-color different-background';\n```\n\n大多数 JavaScript 中的元素属性与\
  \ HTML 中的对应属性同名，但 `class` 名称除外。这是因为 `class` 在 JavaScript 中有特殊含义，因此 JavaScript 使用\
  \ `className` 来避免冲突。\n\n你可以通过将 `className` 设置为空字符串来移除一个类。\n\n```javascript\nh1.className\
  \ = '';\n```\n\n如果在字符串中管理多个类，而你又希望单独操作它们，这可能会比较棘手。现代 JavaScript 提供了一种使用 `.classList`\
  \ 操作类的替代方法：\n\n```javascript\nvar h1 = document.querySelector('h1');\nh1.classList.add('different-color',\
  \ 'different-background');\n```\n\n你可以通过这种方式添加任意数量的类，但通常它用于单个类。\n\n然后你可以移除该类以恢复其样式：\n\
  \n```javascript\nvar h1 = document.querySelector('h1');\nh1.classList.remove('different-color');\n\
  ```\n\n`classList` 属性允许你一次操作一个类，而保持其他类不变。`classList` 属性还赋予你更多控制权，它拥有以下方法：\n\n- `.classList.add(...)`\
  \ 如果类不存在则添加它，如果已存在则忽略。\n  你可以在列表中包含多个类。\n- `.classList.remove(...)` 如果类存在则移除它，如果不存在则忽略。\n\
  \  你可以在列表中包含多个类。\n- `.classList.toggle(...)` 如果类不存在则添加它，如果已存在则移除它。\n  `.classList.toggle()`\
  \ 可以接受第二个参数。如果为 `true`，则添加该类；如果为 `false`，则移除它。\n- `.classList.contains(...)` 告知你元素是否拥有该类。\n\
  \n你会发现 `.classList.toggle()` 方法特别有用。例如，你可以在 `click` 事件处理器中使用它：\n\n```javascript\n\
  var h1 = document.querySelector('h1');\nfunction toggle(event) {\n    event.target.classList.toggle('different-color');\n\
  }\nh1.addEventListener('click', toggle);\n```\n\n完成后，你可以移除事件监听器：\n\n```javascript\n\
  h1.removeEventListener('click', toggle);\n```\n\n**关于事件监听器函数表达式的说明**\n请注意，在前面的示例中，你定义了一个函数纯粹是为了将其分配为事件监听器。这可能被视为一种形式，因为事件监听器必须是一个函数，但实际上你之后不再需要引用该函数。\n\
  \n你可以通过直接分配事件监听器函数来简化此过程。如果你使用 `onclick` 事件属性，可以这样写：\n\n```javascript\nvar h1 =\
  \ document.querySelector('h1');\nh1.onclick = function(event) {\n    event.target.classList.toggle('different-color');\n\
  };\n```\n\n这里，我们使用了一个**函数表达式**，它本质上是一个未单独定义的函数。如果你打算立即分配它，这会特别有用。\n\n现代 JavaScript\
  \ 为函数表达式提供了一种替代语法：\n\n```javascript\nvar h1 = document.querySelector('h1');\nh1.onclick\
  \ = event => {\n    event.target.classList.toggle('different-color');\n};\n```\n\
  \n这被称为**箭头函数**表达式，在现代 JavaScript 中经常用于赋值的函数。然而，使用箭头函数时有一个陷阱。之前，你看到可以使用 `this` 关键字来引用带有事件监听器的元素。但这在箭头函数中行不通，因为箭头函数不会将\
  \ `this` 与不同的对象关联起来。这也是为什么使用 `event.target` 属性更好的原因之一。\n\n如果你想使用 `.addEventListener`\
  \ 方法，它的工作方式相同，但函数表达式被添加在括号内，这使得它稍微难以理解。\n\n例如，使用传统的函数表达式：\n\n```javascript\nvar\
  \ h1 = document.querySelector('h1');\nh1.addEventListener('click', function(event)\
  \ {\n    event.target.classList.toggle('different-color');\n});\n```\n\n或者使用箭头函数表达式：\n\
  \n```javascript\nvar h1 = document.querySelector('h1');\nh1.addEventListener('click',\
  \ event => {\n    event.target.classList.toggle('different-color');\n});\n```\n\n\
  这样写可读性稍差，但它能让你获得 `.addEventListener()` 方法提供的灵活性。真正的问题是事件监听器现在是匿名的，你无法轻易移除它，因为你没有直接的引用。有两种解决方法。\n\
  \n首先，你可以将匿名函数作为元素的一个属性来命名：\n\n```javascript\nvar h1 = document.querySelector('h1');\n\
  h1.addEventListener('click', h1.fn = function(event) {\n    event.target.classList.toggle('different-color');\n\
  });\n```\n\n由于箭头函数表达式的运算符优先级，这种方法更适用于传统（非箭头）函数表达式。在这里，函数表达式同时被赋值给了 `h1.fn`（或任何你想要赋予的属性名）。\n\
  \n要移除事件监听器，你可以使用 `h1.fn` 属性：\n\n```javascript\nh1.removeEventListener('click', h1.fn);\n\
  ```\n\n第二种方法则更为彻底，但它是清除累积事件监听器的一个绝佳途径：\n\n```javascript\nh1.outerHTML = h1.outerHTML;\n\
  ```\n\n`outerHTML` 属性本质上是元素本身的 HTML。你所做的实际上是重新构建该元素。这不会包含任何 JavaScript，但会包含已添加到元素上的所有类。如果你开始记不清自己添加的事件监听器，并且确实不想重新加载页面时，可以使用\
  \ `outerHTML` 方法。\n\n**触发 CSS 过渡**\n\nCSS **过渡**是从一种样式逐渐变化到另一种样式的过程，例如改变元素的颜色、大小或不透明度。你可以将其视为一次简单的、一次性动画。这依赖于两个部分：\n\
  \n- 首先，必须有一个设置来定义*哪些*属性需要进行过渡以及需要多长时间。\n- 其次，一个属性必须有两个不同的值。其中一个值可以是默认值，例如文本颜色的黑色。\n\
  \n对于简单的 CSS 过渡，你可以直接使用 CSS，但对于更复杂的行为，你可以使用 JavaScript。\n\n**一个简单的 CSS 过渡**\n你可以在\
  \ CSS 中实现过渡，但 CSS 对用户操作的响应能力不是很好。因此，你通常会在鼠标移动到元素上时看到它们，例如按钮改变颜色。\n\n例如，当你将鼠标悬停在示例按钮上时，它的颜色会改变。\n\
  以下是导致这种情况发生的部分 CSS 代码：\n\n```css\nbutton#sample-button {\n    ...\n    background-color:\
  \ rgb(0,34,34);\n    color: white;\n    transition: color 0.5s, background-color\
  \ 0.5s\n}\nbutton#sample-button:hover {\n    color: rgb(0,34,34);\n    background-color:\
  \ white;\n}\n```\n\n过渡由鼠标悬停触发，因为这是在纯 CSS 中你所能做的全部。有时你也可以响应点击，但 CSS 在这方面并不灵活。你还会注意到，变化大约需要半秒钟，这很好。这是因为\
  \ `transition` 属性的作用。\n\n**在 JavaScript 中实现过渡**\n*在过去*，所有的过渡和动画都是在 JavaScript 中实现的。那是因为\
  \ CSS 当时不知道如何实现。整个库都围绕过渡和动画构建，有些至今仍在使用。但大多数情况下，我们不再需要它们了。\n如果你真的想自己实现 JavaScript\
  \ 过渡，可以使用幻灯片项目中修改过的代码。过渡本质上是变化的快速重复。\n\n以下是你如何使用 JavaScript 在 20 步内淡出图像元素的方法：\n\n\
  ```javascript\nvar img = document.querySelector('figure>img');\nvar i = 0;\nfunction\
  \ fading() {\n    img.style.opacity = 1 - i/20;\n    i++;\n    if(i>20) clearInterval(timer);\n\
  }\nvar timer = setInterval(fading, 100);\n```\n\n如果你想认真对待这件事，可以将其封装在一个函数中。\n\n```javascript\n\
  function fade(element, time, steps=20) {\n  var interval = time/steps;\n  var i\
  \ = 0;\n  var timer = setInterval(fading, interval);\n  function fading() {\n  \
  \  element.style.opacity = 1 - i/steps;\n    i++;\n    if(i>steps) clearInterval(timer);\n\
  \  }\n}\nfade(document.querySelector('figure>img'), 2000, 20);\n```\n\n这里，图片现在作为参数传递，同时还传递了总时间（2000\
  \ 毫秒）和步数；在函数内部，它们用于计算 `setInterval()` 函数的间隔和透明度的增量。\n\n然而，**我们真的不想这样做**，尤其是在涉及其他更复杂的过渡时。幸运的是，CSS\
  \ 解决了这个问题。\n\n## 使用 JavaScript 实现 CSS 过渡\n\n你也可以在 JavaScript 中通过设置 CSS 属性并使用事件监听器触发更改来实现过渡。\n\
  \n例如：\n\n```javascript\nvar h1 = document.querySelector('h1');\n// 初始属性\nh1.style.transition\
  \ = 'border-color 3s';\nh1.style['border'] = 'thick solid';\nh1.style['border-color']\
  \ = 'red';\nfunction doTransition(event) {\n  doTransition.modified ??= false;\n\
  \  event.target.style['border-color'] =\n    !doTransition.modified ? 'yellow' :\
  \ 'red';\n  doTransition.modified = !doTransition.modified;\n}\nh1.onclick = doTransition;\n\
  ```\n\n点击标题时，边框颜色最终会变为黄色，但需要三秒钟才能完成。再次点击则会变回红色。\n\n过渡效果需要两个条件：\n\n- 在 `border-color`\
  \ 属性上设置了 `transition` 属性。\n- 然后更改了 `border-color` 属性。\n\n这比依赖 `:hover` 伪类**好得多**，因为更改仅在用户明确需要时才会执行。如果弹出菜单能做到这一点，而不是在用户移动鼠标时突然出现，世界会变得更好。\n\
  \n如果你尝试连续更改属性两次，会遇到一些问题：\n\n```javascript\nvar h1 = document.querySelector('h1');\n\
  h1.style['transition'] ='border-color 3s';\nh1.style['border-color'] = 'red';\n\
  h1.style['border-color'] = 'yellow';\n```\n\n问题在于，浏览器不会等待三秒完成颜色更改后再进行下一次更改。相反，它会走捷径，直接分配第二个值。如果元素一开始是另一种颜色，你只会看到过渡到第二种颜色。如果元素已经是第二种颜色，你将什么也看不到。\n\
  \nJavaScript 不喜欢等待，但你可以让它到时候再回来处理任务。在这种情况下，你可以分配一个函数在过渡结束时运行。这需要响应 `transitionend`\
  \ 事件：\n\n```javascript\nvar h1 = document.querySelector('h1');\nh1.style['transition']\
  \ = 'border-color 3s';\nh1.ontransitionend = event => {\n  event.target.style['border-color']\
  \ = 'yellow';\n};\nh1.style['border-color'] = 'red';\n```\n\n这些示例都使用颜色作为明显的测试属性。你也可以将这种技术与\
  \ `opacity` 一起使用：\n\n```javascript\nh1.style.transition='opacity 4s';\nh1.ontransitionend\
  \ = event => {\n  event.target.style['opacity'] = 1;\n}\nh1.style.opacity = 0;\n\
  ```\n\n... 或者与尺寸一起使用：\n\n```javascript\nh1.style['overflow']='hidden';\nh1.style.transition='max-height\
  \ 4s';\nh1.style['max-height'] = '2em';\nh1.ontransitionend = event => {\n  event.target.style['max-height']\
  \ = '2em';\n}\nh1.offsetHeight;\nh1.style['max-height'] = '0';\n```\n\n最后一个示例需要一些额外的样式修改才能使过渡更明显。`overflow`\
  \ 属性控制内容超出盒子时的行为。在这种情况下，内容被隐藏而不是溢出。\n\n它还需要一些技巧才能工作：\n\n- 只有在属性实际发生变化时才会触发过渡。这就是为什么\
  \ `max-height` 属性最初被设置为 `2em`。\n- 如果允许，JavaScript 也会不耐烦地合并两个 `max-height` 设置。在第二次设置它之前，我们包含了\
  \ `h1.offsetHeight` 来强制屏幕更新。\n\n如你所见，在 JavaScript 中触发 CSS 过渡有点棘手，但它仍然比尝试在 JavaScript\
  \ 中完成整个过渡要简单得多。在下一节中，你将看到如何将更多的艺术工作委托给 CSS 本身。\n\n## 在 JavaScript 中创建样式表\n\n在之前关于使用类的讨论中，你会注意到对现有\
  \ CSS 样式表的依赖。当然，页面元素外观的细节应该留给样式表及其开发者，但 JavaScript 中的某些技术如果依赖别人完成他们的工作，就会变得脆弱。\n\
  \n在 JavaScript 代码**绝对需要**某些 CSS 属性的情况下，最好让 JavaScript 设置这些属性。更好的是，JavaScript 可以以允许\
  \ CSS 开发者用首选值覆盖它们的方式设置这些属性。\n\n### 创建样式表\n\n如果你要在 HTML 本身中定义样式，你可以创建一个 `style` 元素：\n\
  \n```html\n<html>\n  <head>\n    <style>\n      ...\n    </style>\n    <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"standardstyles.css\" />\n    ...\n  </head>\n\
  </html>\n```\n\n`style` 元素将包含仅限此页面的额外样式。请注意，在此示例中，它被放置在加载外部样式表的 `link` 元素**之前**。也可以放在后面，但放在前面允许外部样式表覆盖内部样式。\n\
  \n在 HTML 中以这种方式定义样式通常不是一个好主意，因为它难以维护，但我们将在 JavaScript 中使用此技术的变体。\n\n要在 JavaScript\
  \ 中创建样式表，我们使用 `document.createElement()`，它可以创建任何 HTML 元素：\n\n```javascript\nvar\
  \ style = document.createElement('style');\ndocument.head.insertAdjacentElement('afterbegin',\
  \ style);\n```\n\n变量 `style` 用于将元素添加到文档中，并且稍后也将用于添加 CSS 规则。\n\n要将样式元素添加到 `head`\
  \ 元素，最简单的方法是使用 `insertAdjacentElement`，它允许你在原始元素的内部或外部、开头或结尾添加新元素。\n\n请注意，新的样式表被添加到\
  \ `head` 元素的开头，位于任何其他已添加的样式表之前。这允许链接的样式表在需要时覆盖属性。\n\n### 添加 CSS 规则\n\n你现在可以使用 `insertRule()`\
  \ 函数添加 CSS 规则，该函数接受一个 CSS 字符串：\n\n```javascript\nstyle.sheet.insertRule(`h2 {\n\
  \  border: medium solid white;\n  border-style: none none solid none;\n  padding-bottom:\
  \ 0.5em;\n}`);\n```\n\nCSS 可以写成一行，但通常在属性之间换行以使代码更易于管理。这就是我们使用模板字符串字面量来允许字符串中换行的原因。\n\
  \n在这个例子中，我们添加了一些本可以轻松包含在标准样式表中的 CSS，所以在这里有点浪费。然而，在第 9 章关于 Lightbox 的内容中，我们将使用这种技术来添加一些使效果工作所需的基本\
  \ CSS。通过将新样式表放在开头，你仍然可以选择使用常规样式表覆盖某些属性。\n\n## 总结\n\n在本章中，我们探讨了如何使用 CSS 样式和 JavaScript\
  \ 事件监听器。\n\n### CSS\n\nCSS 是向网页添加样式的标准方法。它可以作为样式块添加到 HTML 中，但更常见的是作为指向单独样式表的链接添加。也可以使用\
  \ `style` 属性将 CSS 样式直接添加到单个元素。\n\n你可以使用 JavaScript 对元素进行 CSS 样式更改，无论是直接添加样式还是更改与样式关联的元素类。\n\
  \nJavaScript 还可以选择性地禁用或启用单个样式表。\n\n\n### 事件监听器\n\n事件监听器是一种用于响应用户事件的函数，例如使用鼠标或键盘。你可以通过事件监听属性（如\
  \ `.onclick`）或使用 `.addEventListener()` 方法来为元素添加事件监听器。`addEventListener()` 方法更为灵活，允许为单个元素添加多个事件监听器。事件监听器也可以被移除。\n\
  \n事件监听器不必是一个完整的函数。它可以是一个函数表达式，即不单独存储的函数。它也可以是一个箭头函数表达式，这是一种简化形式。然而，使用函数表达式会使移除监听器变得更为棘手。\n\
  \n事件监听函数可以访问一个事件对象，该对象包含刚刚发生的事件的信息。事件对象的一个重要属性是 `target`，它指向触发事件的元素。\n\n同一个事件监听函数可以用于多个元素。如果元素是嵌套的，所有事件都会经历事件，既包括捕获阶段（从外向内），也包括冒泡阶段（从内向外）。\n\
  \n### 更改 CSS 属性和类\n\n可以使用元素的 `style` 对象来更改单个 CSS 属性。CSS 属性可以像其他对象属性一样被访问，但我们使用方括号表示法，以便属性名称与\
  \ CSS 属性名称保持一致。\n\n也可以通过更改元素的类或类列表来间接更改 CSS 样式。这样可以将 CSS 样式设置在样式表中，而让 JavaScript\
  \ 来触发样式的更改。\n\n可以使用 `.className` 属性来设置类，但使用 `.classList` 对象更加灵活。\n\n还可以读取应用于元素的所有样式，这些样式可以是直接添加的、通过样式表添加的，或者是继承而来的。这在恢复你可能已做出的任何更改时非常有用。\n\
  \n### 切换属性\n\nJavaScript 的一个常见应用是来回更改属性——即切换它们。\n\n将当前状态存储在一个变量中可能会很有用。这可以在函数外部的变量中完成，也可以作为函数对象的属性来完成，其作用类似于静态变量。可以使用空值合并运算符来初始化变量。可以使用条件运算符在两个状态之间进行切换。\n\
  \n### 过渡\n\n过渡是 CSS 样式的渐变过程。在过去，这需要通过 JavaScript 重复调用函数来实现，类似于 JavaScript 幻灯片展示代码的方式。现代\
  \ CSS 无需额外的 JavaScript 即可处理这些过渡效果。\n\n你可以通过在 JavaScript 中设置 `transition` 属性并更改受影响的\
  \ CSS 属性来触发 CSS 过渡。或者，你也可以通过使用预定义的过渡来更改类，从而触发过渡。\n\n### 创建样式表\n\n通常情况下，所有 CSS 都应在附件样式表中实现。然而，有时可能会需要额外的样式。这可以通过在\
  \ JavaScript 中创建一个新的 style 元素并将其添加到文档中来实现。\n\n## 后续内容\n\n接下来的两个项目将会把这些知识付诸实践。第 8\
  \ 章重点介绍 JavaScript 如何通过切换类来切换某些元素的可见性。第 9 章重点介绍创建新元素、添加 CSS 样式、劫持 HTML 锚点以及更多关于事件监听器的内容，包括处理键盘事件。\n\
  \n# 8. 显示和隐藏内容\n\n你经常会在网页上看到可以打开和关闭的区域。它们可能是菜单项或内容区块。\n\n在这个项目中，我们将切换内容和列表。技术是相似的，都是让\
  \ JavaScript 更改选定元素的状态。至于其他方面，我们将让 CSS 来完成内容的显示和隐藏，并适当地添加一些动画效果。\n\n\n\n## 初始页面设置\n\
  \n我们处理的页面位于**变化的内容**链接中，文件名为 `showing-hiding.html`。初始状态下，页面如图 8-1 所示。\n\n![菜单页面的截图。底部分组框位于底部。内容与列表部分已折叠。](img/609513_1_En_8_Fig1_HTML.png)\n\
  \n**图 8-1** *变化的内容*\n\n内容各部分和列表均已折叠。其余内容虽存在，但在 CSS 中被隐藏了。我们将编写代码来改变这一情况。此外，最后还有一个部分，讨论如何根据我们在第一个关于内容标题的练习中开发的技术来改变分组框的行为。\n\
  \n### 初始 HTML 和 JavaScript\n\n`showing-hiding.html` 页面已配置好内容及指向 JavaScript 文件的链接：\n\
  \n同样，我们引入了该库，以备编写可复用代码。而且，由于没有需要立即执行的内容，因此没有使用 `defer` 属性。\n\nJavaScript 文件 `showing-hiding.js`\
  \ 也已设置完毕：\n\n```\ninit();\nfunction init() {\n  doHeadings();\n  doMenu();\n  doForm();\n\
  }\nfunction doHeadings() {\n}\nfunction doMenu() {\n}\nfunction doForm() {\n}\n\
  ```\n\n`init()` 函数将调用*三个*函数，分别对应这个项目的不同部分。\n\n## 显示和隐藏文本内容\n\n本项目的这一部分将允许你通过点击标题来显示和隐藏文本块。\n\
  \n### 基本 HTML\n\n内容的基本格式如下所示：\n\n```\n<div id=\"headings\">\n  <div class=\"section\"\
  >\n    <h2>...</h2>\n    <div>...</div>\n  </div>\n  ...\n</div>\n```\n\n所有内容都包含在一个\
  \ `div` 元素内。`div` 常用于控制布局，但在这里它被用作主容器。由于 `div` 除了作为块级元素之外，没有特定的默认行为，通常会给它一个 `id`\
  \ 或 `class` 来标识。在此例中，`id` 为 `headings`，容器被标识为 `div#headings`。这在 CSS 和 JavaScript\
  \ 中都会用到。\n\n还有更多的 `div` 元素，但它们很容易被识别为主容器内部的元素。`h2` 元素也是如此，它们通常定义标题，但在这里也将用于显示和隐藏内容。内部\
  \ `div` 元素的用途是容纳标题之后要显示或隐藏的内容。在 CSS 中，它们被标识为 `h2+div`，表示 `h2` *之后*的 `div`。\n\n通过使用这一个\
  \ `id`，我们可以使用以下选择器来识别主容器及其内容：\n\n| 元素 | 选择器 |\n| --- | --- |\n| 主容器 `div` | `div#headings`\
  \ |\n| 内部 `h2` | `div#headings>h2` |\n| `h2` 之后的 `div` | `div#headings>h2+div` |\n\
  \n注意，我们已尽量降低对 HTML 的要求。容器必须有一个 id，且内容必须遵循一种模式。仅此而已。\n\n### 准备切换代码\n\n我们首先要做的是找到那些能切换\
  \ `div` 可见性的标题。JavaScript 有两个函数可以使用 CSS 选择器定位元素。`querySelector()` 函数查找*第一个*匹配项，在你知道该元素应该是唯一时特别有用。`querySelectorAll()`\
  \ 函数返回一个带编号的匹配集合。对于本项目，我们将使用 `querySelectorAll()`。如果没有匹配 `querySelectorAll()` 的结果，你将得到一个空集合。测试空集合最简单的方法是检查其\
  \ `length` 属性。\n\n要获取所有标题，我们可以使用：\n\n```\nfunction doHeadings() {\n  let headings\
  \ = document.querySelectorAll('div#headings>h2');\n  if(!headings.length) return;\n\
  }\n```\n\n该集合将存储在 `headings` 变量中。如果没有匹配项，`length` 为 `0`，这是假值，函数将立即返回，因为无事可做。\n\n\
  如果考虑让这段代码可复用，我们应该移除对 `div#headings` 的硬编码引用，并将其改为参数变量。我们仍然需要其中的 `h2` 部分，因此我们将它们组合成一个模板字符串字面量：\n\
  \n```\nfunction doHeadings(container) {\n  let headings = document.querySelectorAll(`${container}>h2`);\n\
  \  if(!headings.length) return;\n}\n```\n\n我们需要在 `init()` 函数的调用中提供容器：\n\n```\nfunction\
  \ init() {\n  doHeadings('div#headings');\n  doMenu();\n  doForm();\n}\n```\n\n\
  我们也会留意其他可以将代码通用化的机会。\n\n### 遍历标题集合\n\n从 `querySelectorAll()` 获取的数据称为**节点列表**。它实际上并不是数组，但它与数组类似，是一个带编号的集合。它同样类似于数组，因为你可以使用\
  \ `forEach()` 方法遍历该集合。\n\n`forEach()` 方法接受一个函数作为参数，该函数将执行实际工作：\n\n```\nfunction\
  \ doSomething(item, index, collection) {\n}\nheadings.forEach(doSomething);\n```\n\
  \n其中 `item` 是集合中的每一项，`index` 是每一项的编号，`collection` 是整个集合。大多数时候我们只关心 `item`。\n\n如果你只在\
  \ `forEach()` 方法中使用该函数，它不必是一个永久命名的函数。函数表达式也可以：\n\n```\nheadings.forEach(function(item,\
  \ index, collection) {\n});\n```\n\n现代 JavaScript 为函数表达式提供了一种更短的语法：\n\n```\nheadings.forEach((item,\
  \ index, collection) => {\n});\n```\n\n在我们的案例中，我们需要引用集合中的每一项（每个标题），但不需要其余参数，因此我们可以使用更*短*的语法，省去括号：\n\
  \n```\nheadings.forEach(item => {\n});\n```\n\n在我们的 `doHeadings()` 函数中，可以如下使用：\n\
  \n```\nfunction doHeadings() {\n  let headings = document.querySelectorAll('div#headings>h2');\n\
  \  if(!headings.length) return;\n  headings.forEach(heading => {\n  });\n```\n\n\
  下一步将是让标题执行某些操作。\n\n### 附加切换行为\n\n显示和隐藏内容的代码将以一个名为 `toggle()` 的函数的形式存在。我们需要做的是在点击标题时触发该函数。我们将通过为每个标题的\
  \ `onclick` 事件属性赋值一个 `toggle()` 函数来实现：\n\n```\nfunction doHeadings(container) {\n\
  \  ...\n  headings.forEach(heading => {\n    heading.onclick = toggle;\n  });\n\
  \  function toggle() {\n  }\n}\n```\n\n注意，函数是在赋值*之后*定义的，这看起来有些违反直觉。当然，你也可以在之前定义函数，但这种方式可能更容易理解。JavaScript\
  \ 通常不会乱序执行。然而，JavaScript 解释器分多个阶段运行，你会发现它在实际运行代码之前会处理所有 `var` 和 `function` 语句。我们说\
  \ `var` 和 `function` 语句会被**提升**（hoisted）。较新的 `let` 和 `const` 语句则*不会*被提升。\n\n###\
  \ 改变外观\n\n此时，我们需要了解一些 CSS 如何显示和隐藏内容的知识。一个非常简单的例子如下：\n\n```\ndiv#headings>h2+div\
  \ {\n  display: none;\n}\ndiv#headings>h2.open+div {\n  display: block;\n}\n```\n\
  \n选择器 `div#headings>h2+div` 表示位于 id 为 `headings` 的 `div` 内部、`h2` 元素之后的 `div`。有时，你需要反向阅读选择器才能理解其英文含义。在这里，`div`\
  \ 默认是隐藏的，因为其 `display` 属性设置为 `none`。如果你为 `h2` 分配一个 `open` 类，那么选择器 `h2.open` 就会生效。在这种情况下，它会变得可见，因为其\
  \ `display` 属性被设置为 `block`。\n\n前面的 CSS 可以实现功能，但如果你加入一些（微妙的）动画，显示和隐藏会变得更有趣。项目中的实际\
  \ CSS 是：\n\n```\ndiv#headings>h2+div {\n  overflow: hidden;\n  max-height: 0;\n\
  \  opacity: 0;\n  transition: max-height 250ms, opacity 1500ms;\n}\ndiv#headings>h2.open+div\
  \ {\n  max-height: 30em;\n  opacity: 1;\n}\n```\n\n\n\n与其用 `display` 属性生硬地隐藏和显示\
  \ `div`，不如先将 `div` 的 `max-height` 设为 `0`。为避免内容溢出，还需要将 `overflow` 属性设为 `hidden`。同时，我们将其\
  \ `opacity` 设为 `0` 使其不可见，这样就能在后续让它淡入。\n\n要显示这个 `div`，我们把它的高度设为一个足够大的值，并将 `opacity`\
  \ 设为 `1`。让这种变化更有趣的是 `transition` 属性，它指定了哪些属性需要过渡以及过渡时长。最难的部分是为 `max-height` 属性设置一个合理的值。如果设得太高，你会等很久才能看到内容闭合；如果设得太低，又无法容纳内容。通过这几行\
  \ CSS 代码，你会体会到其功能之强大。而 JavaScript 只需要负责切换类名。\n\n### 切换类名\n\n从 JavaScript 的角度来看，任务很简单。当你点击标题时，应该添加或移除\
  \ `open` 类，剩下的工作交给 CSS。\n\n要切换所点击标题的类名，使用 `classList.toggle` 函数：\n\n```javascript\n\
  function toggle(event) {\n  event.target.classList.toggle('open');\n}\n```\n\n记住，`event.target`\
  \ 就是你刚刚点击的标题。`toggle` 函数会查找 `open` 类，如果找到就移除它，否则就添加它。现在测试一下，你会发现可以通过点击任意部分的标题来打开或关闭该部分，还会看到为这个类编写的\
  \ CSS 动画效果。\n\n### 选中单个标题\n\n按照目前的代码，你可以同时打开任意多个部分。这种行为类似于表单上的复选框，你同样可以选中多个。你可能更希望一次只打开一个部分，就像在表单上从多个单选按钮中选择一个一样。一次只选中一个部分需要更多工作，因为你还需要跟踪哪个部分已经打开，以便在打开新部分时将其关闭。\n\
  \n首先，我们需要另一个变量，比如 `opened`，来记住当前打开的部分：\n\n```javascript\nfunction doHeadings() {\n\
  \  ...\n  let opened = null;\n  function toggle(event) {\n    //  event.target.classList.toggle('open');\n\
  \  }\n}\n```\n\n`opened` 变量将用于跟踪当前拥有 `open` 类的 `h2` 元素。一开始没有部分被打开，所以变量 `opened`\
  \ 初始化为 `null`。注意，`toggle` 函数中原来的语句已被注释掉。接下来将替换这段代码。当然，你可以删除那条语句，但这里保留它以便对比。\n\n\
  还要注意新变量与内部函数和外部函数的关系。`opened` 变量定义在 `doHeadings` 函数内部，因此它是 `doHeadings` 的*局部*变量。然而，它是在外部\
  \ `toggle` 函数外部定义的。虽然没有官方术语，但我们可以非正式地称其为**相对全局变量**。一个相对全局变量的最接近正确名称是**闭包变量**。**闭包**是由一个函数及其继承的环境（此处指该变量）组合而成的。你可以在\
  \ [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures)\
  \ 了解更多关于闭包的内容。\n\n`toggle` 函数的第一个任务应该是隐藏前一个部分，即从当前选中的 `h2` 上移除 `open` 类：\n\n```javascript\n\
  function toggle(event) {\n  //  event.target.classList.toggle('open');\n  opened.classList.remove('open');\
  \    //  还未实现\n}\n```\n\n`classList.remove` 函数会在元素中查找 `open` 类，如果存在就将其移除；如果不存在则无任何效果。\n\
  \n如果尝试运行这段代码，一开始会遇到错误。这是因为没有部分被打开，且 `opened` 被设为 `null`；不能在 `null` 上调用方法。这意味着我们必须先进行判断：\n\
  \n```javascript\nfunction toggle(event) {\n  //  event.target.classList.toggle('open');\n\
  \  if(opened) opened.classList.remove('open');\n}\n```\n\n记住，`if( ... )` 会判断 `true`\
  \ 或 `false`，但也判断“有值”或“无值”。在此例中，`null` 被视为“无值”；如果 `opened` 有值，我们就可以移除该类。\n\n下一步是通过向选中的\
  \ `h2` 的类列表添加 `open` 来打开选中的部分。同时，我们会将该 `h2` 赋给新的 `opened` 变量：\n\n```javascript\n\
  function toggle(event) {\n  //  event.target.classList.toggle('open');\n  if(opened)\
  \ opened.classList.remove('open'); //  关闭\n  event.target.classList.add('open');\n\
  \  opened = event.target;\n}\n```\n\n现在运行代码，你会看到一次只有一个部分被打开。\n\n### 关闭选中的部分\n\n\
  单选按钮的正常行为是，一旦选中一个，就始终有一个被选中。（你可以在页面底部的单选按钮部分看到这一点。）这对单选按钮来说并不总是方便，对打开部分来说也是如此。再做一些工作，我们可以让再次点击当前打开的部分时将其关闭。\n\
  \n在关闭当前部分后，你需要检查选中的标题是否与上一次相同。如果是，就让它保持关闭并忘记它；如果不是，则按之前的方式打开它：\n\n```javascript\n\
  function toggle(event) {\n  //  event.target.classList.toggle('open');\n  if(opened)\
  \ opened.classList.remove('open'); //  关闭\n  if(event.target == opened) {      \
  \      //  忘记\n    opened = null;\n  }\n  else {                               \
  \   //  打开并记住\n    event.target.classList.add('open');\n    opened = event.target;\n\
  \  }\n}\n```\n\n### 将 `doHeadings` 代码移至库文件\n\n大部分代码与应用程序无关，因此我们可以将其移至库文件以备将来使用。不过，我们可能得想一个更好的名字。`doHeadings`\
  \ 有点太模糊了。如果你能想到比 `toggleHeadingContent` 更好的名字，尽管用。目前，我们假设你没想到。\n\n首先，你可以将整个 `doHeadings()`\
  \ 函数代码移至 `library.js` 文件。`showing-hiding.html` 页面中已经有对库文件的引用，因此你可以少操心一件事。别忘了重命名它。\n\
  \n函数前应该有一个注释块，其中还应包含一些简单的说明，如下所示：\n\n```javascript\n/*  toggleHeadingContent(container)\n\
  ================================================\n切换标题部分。使用以下结构：\ndiv#containerid\n\
  \  h2\n  div\n    content\n  h2\n  div\n    content\n  h2\n  div\n    content\n\
  ================================================ */\nfunction toggleHeadingContent(container)\
  \ {\n  ...\n}\n```\n\n你可以根据需要写得尽量详细，但不要过于繁杂。\n\n最后，当然还需要在 `init()` 函数代码中更改名称：\n\n\
  ```javascript\nfunction init() {\n  toggleHeadingContent('div#headings');\n  doMenu();\n\
  \  doForm();\n}\n```\n\n现在，我们可以编写用于切换嵌套列表的代码了。\n\n### 切换列表\n\nHTML 列表是一种包含一个或多个列表项的结构。其最简单的形式如下：\n\
  \n```html\n<ul>\n  <li>苹果</li>\n  <li>香蕉</li>\n  <li>樱桃</li>\n</ul>\n```\n\n在浏览器中显示为：\n\
  \n*   苹果\n*   香蕉\n*   樱桃\n\n这种列表被称为**无序列表**，标记为 `ul`；原则上，项目顺序没有特定含义。你也可以有**有序列表**，标记为\
  \ `ol`，此时项目编号会自动生成。使用 CSS，你可以对列表的外观进行多种更改，包括编号样式。\n\n你还可以有**嵌套列表**，即列表中的列表：\n\n\
  ```html\n<ul>\n  <li>水果\n    <ul>\n      <li>苹果</li>\n      <li>香蕉</li>\n      <li>樱桃</li>\n\
  \    </ul>\n  </li>\n  <li>乐器\n    <ul>\n      <li>手风琴</li>\n      <li>班卓琴</li>\n\
  \      <li>英国管</li>\n    </ul>\n  </li>\n</ul>\n```\n\n显示为：\n\n*   水果\n    *   苹果\n\
  \    *   香蕉\n    *   樱桃\n*   乐器\n    *   手风琴\n    *   班卓琴\n    *   英国管\n\n\n好的，作为一名高级文档工程师兼翻译员，我将严格遵循您提供的格式和注意事项，将给定的英文文本翻译成符合要求的中文。\n\
  \n\n# 列表与菜单的 JavaScript 实现\n\n这里，主列表项包含一些文本，后面跟着另一个 `ul`；文本充当嵌套列表的标题。列表常被用作菜单，从简单的导航按钮到带有下拉子菜单的菜单，这一切都通过\
  \ CSS 的魔力实现。如果列表足够大，它开始主导页面，因此找到一种打开和关闭列表部分的方法变得方便。这正是我们在项目这一部分所做的工作。\n\n当然，列表可以用于许多事情，但一个常见用途是作为链接列表充当菜单。过去，由于使菜单（尤其是水平菜单）看起来美观的难度，其他结构（如表格）也被用于菜单。谢天谢地，那些日子已经过去了，CSS\
  \ 可以让列表菜单看起来恰到好处。现在最难的部分是决定你想要用众多方式中的哪一种来设计你的列表。\n\n### 初始 JavaScript\n\n主列表是如下的无序列表：\n\
  \nCSS 对其外观做了许多更改，包括隐藏嵌套列表：\n\n```css\nul#menu li>ul { /*  ul inside li inside ul#menu\
  \ */\n  display: none;\n}\n```\n\n与之前展示的标题一样，我们希望代码可重用，因此我们将在 `doMenu()` 函数中包含一个参数，并在\
  \ `init()` 函数中使用它：\n\n```javascript\nfunction init() {\n  toggleHeadingContent('div#headings');\n\
  \  doMenu('menu');\n}\nfunction doMenu(menuId) {\n}\n```\n\n这里，我们简单地传递一个 `id`，假设它必须是某个\
  \ `ul` 元素的 `id`。\n\n在 `doMenu()` 函数内部，我们可以使用这个 `id` 来定位列表：\n\n```javascript\nfunction\
  \ doMenu(menuId) {\n  let ul = document.querySelector(`ul#${menuId}`);\n}\n```\n\
  \n与前述标题不同，我们不需要将事件监听器附加到列表内的单个元素上。这是因为如果你点击内部的某个元素，该点击会**传播**到其容器，因此一个事件监听器就能够处理它。\n\
  \n要附加事件监听器，照常分配 `onclick` 属性：\n\n```javascript\nfunction doMenu() {\n  let ul =\
  \ document.querySelector('ul#menu');\n  ul.onclick = toggle;\n  function toggle(event)\
  \ {\n  }\n}\n```\n\n请记住，使用 `onclick` 事件属性添加的事件监听器默认在冒泡阶段（即从内到外）进行监听。这正是我们想要的。\n\n\
  `ul` 变量只被使用一次，因此我们可以通过如下语句省去它：\n\n```javascript\n//  Not this time:\ndocument.querySelector('ul#menu').onclick\
  \ = toggle;\n```\n\n然而，我们稍后需要 `ul` 变量来做出进一步改进，因此我们保留其原始形式。\n现在，列表是一个包含许多其他列表项和内部列表的大型结构。事件监听器将响应任何这些嵌套元素的点击。你需要知道的是你实际点击了哪个元素，以便我们能改变其状态。\n\
  \n事件监听器可以访问与事件相关的**两个**值：\n\n-   `event.target` 变量引用的是实际被点击的元素。这里，它始终是 `ul#menu`\
  \ 元素。\n-   `event.currentTarget` 属性引用的是触发事件监听器的元素；也就是你实际点击的那个元素。\n\n在我们之前的许多示例中，你点击的元素与拥有事件监听器的元素是同一个，因此\
  \ `event.currentTarget` 和 `event.target` 引用的是同一个东西。这次它们会不同，你需要区分它们。这次我们将该事件监听器称为**委托**事件监听器。\n\
  接下来我们需要担心的是是否存在要显示的嵌套列表。`event.target` 始终是一个 `li` 元素，因为这是列表在页面上可见的部分。这些条目中**有些**会有嵌套列表，有些则没有。\n\
  \n我们可以使用 `event.target.querySelector('ul')` 来测试是否存在嵌套列表：\n\n```javascript\nfunction\
  \ toggle(event) {\n  if(!event.target.querySelector('ul')) return;\n}\n```\n\n我们将\
  \ `querySelector` 限制在这个 `li` 元素上。`event.target.querySelector('ul')` 的结果要么是某个东西（另一个列表），要么是空（`null`）。如果它不是某个东西（`if(!...)`），我们就用\
  \ `return` 语句退出函数。否则，我们继续切换该条目：\n\n```javascript\nfunction toggle(event) {\n  if(!event.target.querySelector('ul'))\
  \ return;\n  event.target.classList.toggle('open');\n}\n```\n\n现在你可以打开和关闭嵌套列表了。\n\
  \n### 高亮显示嵌套列表\n\n当然，并非所有列表项都有嵌套列表。理想情况下，你应该高亮显示那些有嵌套列表的项。在这个例子中，它们通过 `›` 字符高亮显示，当条目打开时该字符会被旋转。\n\
  传统上，CSS 没有能够选择包含特定内容的元素的选择器，因此你必须使用 JavaScript 中的蛮力方法。\n\n现代 CSS 确实有这样的选择器。然而，它是全新的，并且在\
  \ Firefox 中尚未得到完全支持。该选择器采用以下形式：\n\n```css\nli:has(ul) {\n  ...\n}\n```\n\n这表示任何包含\
  \ `ul` 的 `li`。如果你查看样式表本身，它并没有那么简单，因为它仍然需要照顾不支持该选择器的浏览器：\n\n```css\nli:is(.nested,:has(ul))\
  \ {\n  ...\n}\n```\n\n关于选择器还有很多内容，因为它们包含了对 `open` 类、`ul#menu` 主列表以及其他内容的引用。关键在于，不支持该选择器的浏览器需要以名为\
  \ `nested` 的类的形式获得一些帮助。\n\n### 支持不支持该选择器的浏览器\n\n目前，大多数（但不是全部）浏览器都支持 `:has()` 选择器，很可能你的浏览器也支持。然而，你应该始终为**较新**特性不被支持的情况做准备。你可以通过访问\
  \ [`https://caniuse.com/`](https://caniuse.com/) 来了解一个较新特性的支持情况。\n为了让这个功能跨平台工作，我们需要在不支持该选择器的浏览器上，为那些具有嵌套列表的条目添加\
  \ `nested` 类。我们不想手动执行此操作，因此我们让 JavaScript 来做这项艰苦的工作。\n在过去，有大量“浏览器嗅探”——检查正在使用哪个浏览器。这绝对是个坏主意，因为要跟上各种浏览器及其版本是不可能的。一个好得多的方法是测试特性本身。\n\
  只有当某个特性已经被标准化但尚未得到完全支持时，你才应该考虑这种事情。依赖非标准特性将来肯定会让你头疼。\n在过去，我们在本书中使用的许多 JavaScript\
  \ 特性，例如 `.forEach()`、`.querySelector()` 或 `.classList`，都需要测试。这就是为什么有这么多对“现代 JavaScript”的引用的原因。幸运的是，它们都已经支持了很多年，访问\
  \ [`https://caniuse.com/`](https://caniuse.com/) 就能确认这一点。\n\n要测试一个新的 CSS 特性，有一个名为\
  \ `CSS.supports()` 的函数，它将测试某个特定的 CSS 特性是否可用。我们想要的大概是这样的：\n\n```javascript\nCSS.supports('selector(:has(ul))')\n\
  ```\n\n字符串中的 `selector()` 函数用于测试特定的选择器是否有效；`:has(ul)` 就是我们想要的具体伪类选择器。如果特性受支持，结果将为\
  \ `true`；否则为 `false`。\n\n我们将使用这个来为那些需要 `nested` 类的列表项添加它，但仅在需要时添加。之前，我们找到了主列表并将其赋值给变量\
  \ `ul`。利用这个，我们可以搜索其内容：\n\n```javascript\nfunction doMenu() {\n  let ul=document.querySelector('ul#menu');\n\
  \  ul.onclick=toggle;\n  if(!CSS.supports('selector(:has(ul))')) {\n    ul.querySelectorAll('li').forEach(li\
  \ => {\n    });\n  }\n  ...\n}\n```\n\n`ul.querySelectorAll('li')` 将生成 `ul` 列表内所有列表项的集合。正如我们之前所见，你可以使用\
  \ `.forEach()` 遍历这个集合。注意，找到的条目将是**所有**列表项，包括嵌套列表内部更深处的条目以及那些没有自己嵌套列表的条目。\n\n\n\n\
  在 `forEach` 内部，我们有一个箭头函数，将每个列表项赋值给变量 `li`。在这里，我们希望只选中那些自身包含列表的列表项：\n\n```\nfunction\
  \ doMenu() {\nlet ul=document.querySelector('ul#menu');\nul.onclick=toggle;\nif(!CSS.supports('selector(:has(ul))'))\
  \ {\nul.querySelectorAll('li').forEach(li => {\nif(li.querySelector('ul')) li.classList.add('nested');\n\
  });\n}\n...\n}\n```\n\n`li.querySelector('ul')` 会在每个 `li` 内部查找 `ul` 元素。如果找到了，我们并不需要这个实际元素，而是希望给该\
  \ `li` 添加 `nested` 类。如果没找到，结果就是 `null`，其余代码将被忽略。\n\n关于 `CSS.supports('selector(:has(ul))')`\
  \ 是否能正确测试，在错误报告中存在一些讨论。根据作者的经验，它运行良好。如果你有所疑虑，可以放弃测试该特性，直接添加类：\n\n```\nfunction doMenu()\
  \ {\nlet ul=document.querySelector('ul#menu');\nul.onclick=toggle;\n//  if(!CSS.supports('selector(:has(ul))'))\
  \ {\nul.querySelectorAll('li').forEach(li => {\nif(li.querySelector('ul')) li.classList.add('nested');\n\
  });\n//  }\n...\n}\n```\n\n同时保留两者也无妨。\n\n### 修复 `toggle()` 函数\n\n在 `toggle()` 函数中，我们包含了一个测试，用于判断列表项是否包含嵌套列表：\n\
  \n```\nif(!event.target.querySelector('ul')) return;\n```\n\n反复遍历 DOM 开销较大，因此我们可以利用已知的嵌套列表信息：要么\
  \ `:has(ul)` 满足条件，要么它拥有 `nested` 类（或两者兼具）。我们可以使用 `.matches()` 方法来测试其中任一条件，该方法用于检验\
  \ CSS 选择器是否匹配：\n\n```\nfunction toggle(event) {\nif(!event.target.matches(':is(.nested,:has(ul))'))\
  \ return;\nevent.target.classList.toggle('open');\n}\n```\n\n`.matches()` 方法用于测试一个元素是否匹配某个\
  \ CSS 选择器。例如：\n\n```\n»   var h1 = document.querySelector('h1');\n»   h1.matches('body\
  \ *');\n←   true\n```\n\n这表明 `h1` 元素位于 `body` 元素内部，事实也的确如此。`:.is(.nested,:has(ul))`\
  \ 选择器会在 `.nested` 选择器或 `:has(ul)` 选择器匹配时成功。如果不匹配，则从函数返回。测试属性比在元素内部搜索其他元素更高效。\n\n\
  ### 将列表切换功能迁移到库中\n\n同样，这段代码的编写方式使其不依赖于特定应用。唯一的要求是列表是嵌套的，并且我们知道其 id。\n\n我们可以将代码迁移到\
  \ `lilbrary.js` 文件中，使用 `toggleNestedLists()` 之类的命名，或者你喜欢的任何名字。同样，我们应该在其前面添加一个有用的注释块，如下所示：\n\
  \n```\n/*  toggleNestedLists(menuId)\n================================================\n\
  切换嵌套列表。\n结构应类似于：\n\n项目\n  项目\n    项目\n  项目\n项目\n\n================================================\
  \ */\nfunction toggleNestedLists(menuId) {\n...\n}\n```\n\n别忘了在 `init()` 函数中更改函数名：\n\
  \n```\nfunction init() {\ntoggleHeadingContent('div#headings');\ntoggleNestedLists('menu');\n\
  }\n```\n\n现在这个功能已准备好用于其他项目。\n\n### 增强单选按钮\n\n之前，我们提到过单选按钮的行为。单选按钮是一种表单元素，允许用户从多个选项中选择一个。当你选中一个时，其他选项会被取消选中。这个名称源于古代汽车收音机使用按钮选择电台的时期。前面提到过，一旦你选中了一个单选按钮，就无法全部取消选中——总有一个会被选中。若要允许不选任何选项，用户友好的方式是包含一个“以上都不是”选项。或者，我们可以使用\
  \ JavaScript 注入与本章标题类似的行为：选中一个已经选中的选项将取消选中它。\n\n页面底部有一个简单的表单，包含一些单选按钮、一个输出元素和一个提交按钮。\n\
  \n\n\nHTML 代码看起来是这样的：\n\n```\n选择一种音乐风格\n爵士乐\n古典乐\n新世纪音乐\n摇滚乐\n\n确定\n\n```\n\n没人觉得这是一种很有用的形式。\n\
  \n在 HTML 中，一组单选按钮具有以下两个特征：\n\n-   它们都是 `radio` 类型：`<input type=\"radio\">`。\n- \
  \  它们都具有相同的 `name` 属性，浏览器正是通过该属性知道它们属于同一组。\n\n提交表单时，只会提交选中的单选按钮。如果没有任何按钮被选中，那么该名称下就不会提交任何内容。\n\
  \n我们要做的第一件事是找到表单并禁用其提交功能：\n\n```\nfunction doForm() {\nlet form = document.querySelector('form#music');\n\
  form.elements['ok'].onclick = event => {\nevent.preventDefault();\n};\n}\n```\n\n\
  接下来要获取单选按钮：\n\n```\nfunction doForm() {\nlet form = document.querySelector('form#music');\n\
  let buttons = form.elements['musical-style'];\n...\n}\n```\n\n通常，从 `elements` 集合中获取内容时，你会得到一个单独的表单元素。但对于单选按钮，你会得到另一个集合；更具体地说，它是一个\
  \ `RadioNodeList`，但我们只关心我们可以遍历该集合这一事实。回想内容标题部分，我们只想选择一个元素。这种内置行为是单选按钮自带的。然而，我们也希望能够取消选择一个标题，这显然不是单选按钮的内置功能。我们将使用相同的技术，即使用一个跟踪变量。\n\
  \n我们将声明一个变量来跟踪当前选中的按钮：\n\n```\nfunction doForm() {\nlet form = document.querySelector('form#music');\n\
  let buttons = form.elements['musical-style'];\nlet selected = null;\n...\n}\n```\n\
  \n现在，我们将为每个单选按钮附加一个事件监听器，以维护这个跟踪变量：\n\n```\nfunction doForm() {\nlet form = document.querySelector('form#music');\n\
  let buttons = form.elements['musical-style'];\nlet selected = null;\nbuttons.forEach(b\
  \ => {\nb.onclick = event => {\n};\n});\n...\n}\n```\n\n这里有两个箭头函数表达式：一个用于遍历 `buttons`\
  \ 集合，另一个用于事件监听器。事件监听器将检查被点击的按钮是否与上次相同。如果是，我们将通过将其 `.checked` 属性设置为 `false` 并清除 `selected`\
  \ 变量来取消选择该按钮。如果不同，我们只需在 `selected` 变量中记录即可。\n\n当然，第一次点击时没有“上次”的概念，所以结果会是 `false`。\n\
  \n```\nbuttons.forEach(b => {\nb.onclick = event => {\nif(event.target == selected)\
  \ {\nevent.target.checked = false;\nselected = null;\n}\nelse selected = event.target;\n\
  };\n});\n```\n\n### 复用可取消选择的单选按钮代码\n\n一如既往，如果代码有用，我们或许可以将其封装成一个可复用的函数。\n\n第一步是创建一个新函数。我们将其命名为\
  \ `deselectableRadio()`。然后，我们可以将代码的主要部分移入其中：\n\n```\nfunction doForm() {\n}\nfunction\
  \ deselectableRadio(buttons) {\nbuttons.forEach(b => {\nb.onclick = event => {\n\
  if(event.target == selected) {\nevent.target.checked = false;\nselected = null;\n\
  }\nelse selected = event.target;\n};\n});\n}\n```\n\n该函数将接收 `buttons` 集合。\n\n为了避免维护一个单独的变量，我们可以将其转换为函数属性：\n\
  \n```\nfunction deselectableRadio(buttons) {\ndeselectableRadio.selected ??= null;\n\
  buttons.forEach(b => {\nb.onclick = event => {\nif(event.target == deselectableRadio.selected)\
  \ {\nevent.target.checked = false;\ndeselectableRadio.selected = null;\n}\nelse\
  \ deselectableRadio.selected = event.target;\n};\n});\n}\n```\n\n现在，我们应该能够测试这个函数了。为保险起见，先注释掉旧代码，然后包含对新函数的调用，并传入\
  \ `buttons` 集合：\n\n```\nfunction doForm() {\nlet form = document.querySelector('form#music');\n\
  let buttons = form.elements['musical-style'];\ndeselectableRadio(buttons);\n/*\n\
  ...\n*/\nform.elements['ok'].onclick = event => {\nevent.preventDefault();\n};\n\
  }\nfunction deselectableRadio(buttons) {\n...\n}\n```\n\n\n\n# 排版后的文档\n\n如果一切正常，你可以删除注释掉的代码，并将该函数移动到`library.js`中，就像你处理本章其他函数一样。你可以包含一个类似这样的注释块：\n\
  \n```\n/*  deselectableRadio(buttons)\n================================================\n\
  Allows a group of radio buttons to be deselected.\n================================================\
  \ */\n```\n\n当然，你可能不希望你的单选按钮是可取消选择的，但有选择总归是好的。\n\n## 总结\n\n在本项目中，我们使用 JavaScript\
  \ 通过用户交互来显示和隐藏内容。我们运用了第 7 章中开发的许多概念。\n\n你可以在 CSS 中显示和隐藏内容。一个简单的方法是将`display`属性在`block`和`none`之间切换，这也是嵌套列表中使用的方法。一个更复杂的方法（允许过渡动画效果）是改变`max-height`和`opacity`属性。\n\
  \n代码的主要思路是使用`click`事件来切换元素的类。CSS 处理嵌套或与受影响元素相邻的内容。\n\n在标题练习中，有多个元素需要绑定到事件监听器。这些元素通过`.querySelectorAll()`函数获取。然后，我们可以通过`.forEach()`方法遍历这个集合。\n\
  \n在嵌套列表练习中，我们将一个单一的委托事件监听器附加到主列表上，并让事件从选中的列表项冒泡。然后，我们使用`event.target`来切换特定元素。\n\n\
  简单的切换允许多个元素处于相同状态，就像表单上的复选框。通过使用一个单独的变量来管理选中的元素，可以一次只选中一个元素，就像表单上的单选按钮。也可以取消选中所有元素。\n\
  \n现代 CSS 包含一个用于包含其他元素的元素的选择器。这应该能简化处理包含嵌套列表的列表项的代码，但并非所有浏览器都完全支持此功能。不过，可以在 JavaScript\
  \ 中测试此功能，搜索这些特定元素，并分配一个类来替代此功能。\n\n最后，我们编写了一些代码来修改单选按钮的行为，以允许取消选中所有按钮。\n\n当代码完成后，只要它不特定于当前项目，我们就可以将代码移动到库文件中。\n\
  \n## 展望未来\n\n我们一直在处理的内容已经存在于页面中——它只是被隐藏了。在第 10 章中，我们将学习如何按需加载新内容。\n\n然而，在此之前，我们将做一个灯箱项目。这是指图像按需在屏幕上弹出。为此，我们将添加\
  \ HTML 内容、添加 CSS，并通过鼠标和键盘触发活动。\n\n在第 10 章中，我们还将使用 Ajax 从服务器加载图像内容和数据。\n\n# 9. 项目：构建灯箱画廊\n\
  \n许多现代图像画廊页面都包含一个弹出的大图。这被称为**灯箱**，其名称源于 Lokesh Dhakar 的一个原始脚本（参见[`https://en.wikipedia.org/wiki/Lightbox_(JavaScript)`](https://en.wikipedia.org/wiki/Lightbox_%2528JavaScript%2529)）。\n\
  \n你会在许多网站上看到类似的效果。当你点击一个缩略图时，一个更大的图片会出现在页面其余部分的上方。一个典型的灯箱效果如图 9-1 所示。\n\n![](img/609513_1_En_9_Fig1_HTML.jpg)\n\
  \n一个 JavaScript 灯箱画廊的截图。它由一个位于中央的大型菠萝花照片组成，两侧各有三张较小的照片排成一行。\n\n**图 9-1** 一个灯箱画廊\n\
  \n你可以在[`https://pure-javascript.net/lightbox.html`](https://javascript101.webcraft101.com/lightbox.html)查看一个示例灯箱画廊的实际效果。\n\
  \n在这个项目中，你将编写自己的 JavaScript 灯箱函数，你可以在许多其他项目中使用它。除了拥有你自己的 JavaScript 小部件之外，你还将学习到更多关于：\n\
  \n*   劫持 HTML 锚点\n*   创建可复用和适配的 JavaScript 小部件\n*   在 JavaScript 中创建 HTML 元素和 CSS\
  \ 样式\n*   创建弹出元素\n*   使用 JavaScript 事件触发 CSS 变化\n*   处理异步图像加载\n*   响应键盘事件\n\n灯箱的一个重要部分是其视觉外观，它由\
  \ CSS 控制，包括一些动画效果。你将学习如何生成足够的基础 CSS 来让小部件正常工作，同时允许设计师覆盖部分外观。\n\n在本章结尾，我们将重新回顾第 4\
  \ 章中的幻灯片。届时，我们将掌握更多处理动态 CSS 的技能，并添加一些新功能，使幻灯片看起来更有趣。\n\n## 准备 HTML\n\nJavaScript\
  \ 代码应尽可能保持不显眼，因此你无需做太多额外准备。\n\n在这种情况下，我们希望 HTML 尽可能自然。如果你在编辑器中打开`lightbox.html`文件并查看代码，你会看到一个主容器内有一组链接图像：\n\
  \n在这种情况下，容器是一个`div`元素，这是最通用的块级元素。我们可以使用`id`属性`catalogue`来标识要处理的容器。这个`id`也用于 CSS\
  \ 中，以便为容器及其内容赋予你喜欢的任何特殊外观。\n\n图像将是普通的`img`元素，在`src`属性中显示缩略图版本。我们在这里省略了其他属性，但`title`属性很有用。通常，`title`在鼠标悬停时作为工具提示文本出现，但我们将把它用作大图的说明文字。\n\
  \n每张图片都包裹在一个指向大图的锚点（`a`元素）中。单独使用时，锚点通常会重新加载页面以显示链接的图像，但我们将用它来在弹出窗口中显示大图。\n\n###\
  \ 初始 HTML 和 JavaScript\n\n与上一个项目一样，我们将创建一个独立的、灵活的函数，可以轻松地将其移至库文件中。为简单起见，现在我们将其保留在主\
  \ JavaScript 文件中。\n\nHTML 文件名为`lightbox.html`，对应的 JavaScript 文件名为`lightbox.js`。\n\
  \nHTML 已经包含了对 JavaScript 文件的引用：\n\nJavaScript 以通常的方式开始，但我们已经包含了一个对新函数的调用，并带了容器的参数：\n\
  \n```\ninit();\nfunction init() {\n  doLightbox('div#catalogue');\n}\nfunction doLightbox(container)\
  \ {\n}\n```\n\n如果你现在加载页面并点击一张图片，你只会看到页面重新加载并显示大图。这是因为大图在周围锚点的`href`属性中被引用。\n\n你还会看到，当鼠标不在缩略图上时，每个缩略图的颜色都是去饱和的（主要是灰度）。这些都是由\
  \ CSS 完成的。\n\n在`doLightbox()`函数内部，我们可以使用选择器字符串配合`querySelectorAll()`来找到包含图像的锚点：\n\
  \n```\nfunction doLightbox(container) {\n  let anchors = document.querySelectorAll(`${container}>a`);\n\
  }\n```\n\n正如你所记得的，模板字面量`` `${container}>a` ``允许你在其中包含表达式和变量。在前面的代码中，选择器字符串转换为：\n\
  \n```\nlet anchors = document.querySelectorAll('div#catalogue>a');\n```\n\n这意味着所有`div`元素的子锚点。\n\
  \n一旦我们有了这些锚点，我们就可以改变它们的行为，将大图加载到弹出窗口中。\n\n\n\n### 劫持锚点\n\n通常，锚点用于链接到新文档或页面。但在这里，我们将用它来显示更大的图片。这意味着我们需要改变其默认行为，转而采用新的行为。这通常被称为**劫持**锚点。\n\
  \n为了添加我们自己的行为，我们需要为所有锚点的 `click` 事件添加一个事件监听器：\n\n```\nfunction doLightbox(container)\
  \ {\nlet anchors = document.querySelectorAll(`${container}>a`);\nanchors.forEach(a\
  \ => {\na.onclick = show;\n});\n//  显示与隐藏\nfunction show(event) {\n}\n}\n```\n\n\
  `forEach()` 函数会遍历 `anchors` 集合中的每一个成员。箭头函数表达式 `a => {}` 将每个锚点临时赋值给变量 `a`，这样我们就可以将其\
  \ `onclick` 事件监听器设置为 `show` 函数。`show` 函数将使用 `event` 参数。\n\n我们需要解决锚点的一个逻辑问题。尽管我们已经将点击事件转移到了自己的函数上，但锚点的正常行为仍然会让浏览器加载新内容，也就是\
  \ `href` 属性中的那张更大的图片；这个新内容会*替换*掉旧内容。\n\n相反，我们将在当前页面上显示新内容，因此需要取消其正常行为。这可以通过 `preventDefault()`\
  \ 函数来实现：\n\n```\nfunction show(event) {\nevent.preventDefault();\n}\n```\n\n只要 HTML\
  \ 元素具有动态行为，例如表单中的按钮或上述的锚点，都可以使用 `preventDefault()` 函数。你可以在 `show` 函数中的任何时候调用 `preventDefault()`\
  \ 函数，但通常会在函数开头调用它。我们还需要再次使用 `event` 对象来获取图片的详细信息。\n\n如果你重新加载页面，它不会有什么反应。事实上，它什么也不会做。点击图片不再加载更大的图片，因为我们已经拦截了该行为。我们稍后会编写显示图片的代码。首先，我们需要创建一个放置图片的地方。\n\
  \n## 创建弹窗元素\n\n要将更大的图片显示为弹窗，你需要一些额外的 HTML 和 CSS。你可以在原始文档中创建这些元素，但更好的做法是由 JavaScript\
  \ 为你完成。这样，文档就没有额外需求了。这是在编写此类 JavaScript 工具时的一个重要原则。实现灯箱所需的 HTML 元素和 CSS 是页面原始内容的附加部分。保持原始内容不变，让\
  \ JavaScript 来管理附加内容是合适的。\n\n我们需要为弹窗创建四个额外的 HTML 元素：\n\n-   需要一个背景 `div` 来覆盖整个屏幕。背景有两个作用。首先，它通过半透明的背景颜色来遮挡文档的其余部分。其次，你可以点击它来隐藏背景和弹窗。\n\
  -   需要一个容器 `figure` 来容纳更大的图片和说明文字。\n-   弹窗图片本身，它将是一个 `img` 元素。\n-   最后，说明文字将位于 `figcaption`\
  \ 元素中。\n\n弹窗元素看起来会像图 9-2 所示。\n\n![](img/609513_1_En_9_Fig2_HTML.jpg)\n\n一张灯箱中弹窗元素的示意图。它有一个矩形框，内部包含一张图片和底部的图片说明文字。\n\
  \n**图 9-2**\n灯箱元素\n\n`figure` 元素以及其中的 `img` 和 `figcaption` 元素，将位于背景 `div` 的前面。\n\
  \n### 创建元素\n\n要创建这些元素，我们使用 `document.createElement()`：\n\n```\nfunction doLightbox(container)\
  \ {\nlet anchors = document.querySelectorAll(`${conainer}>a`);\nanchors.forEach(a\
  \ => {\na.onclick = show;\n});\n//  创建元素\nlet background = document.createElement('div');\n\
  let figure = document.createElement('figure');\nlet img = document.createElement('img');\n\
  let figcaption = document.createElement('figcaption');\n...\n}\n```\n\n这应该足以让 JavaScript\
  \ 处理了，但还需要一点 CSS。为了确保 CSS 不会混淆，我们将为 `background` 和 `figure` 元素添加 id。CSS 将知道如何处理嵌套的\
  \ `img` 和 `figcaption` 元素。\n\n```\nfunction (container) {\n...\n//  创建元素\nlet background\
  \ = document.createElement('div');\nlet figure = document.createElement('figure');\n\
  let img = document.createElement('img');\nlet figcaption = document.createElement('figcaption');\n\
  background.id = 'lightbox-background';\nfigure.id = 'lightbox';\n...\n}\n```\n\n\
  背景 `div` 将独立存在，但图片和说明文字应包含在容器元素内部。这可以通过 `appendChild()` 来实现：\n\n```\nfunction doLightbox(container)\
  \ {\n...\n//  创建元素\n...\nbackground.id = 'lightbox-background';\nfigure.id = 'lightbox';\n\
  figure.appendChild(img);\nfigure.appendChild(figcaption);\n...\n}\n```\n\n`appendChild()`\
  \ 函数将一个元素添加到其内容的末尾。这是 `insertAdjacentElement('beforeend', ...)` 的一个更简单的版本。\n\n###\
  \ 将元素添加到文档中\n\n此时，新创建的元素仍在内存中浮动。我们将以相同的方式将它们添加到文档的 body 中：\n\n```\nfunction (container)\
  \ {\n...\n//  创建元素\n...\nfigure.appendChild(img);\nfigure.appendChild(figcaption);\n\
  document.body.appendChild(background);\ndocument.body.appendChild(figure);\n...\n\
  }\n```\n\n我们现在有了一些空元素被添加到了文档 body 的末尾。如果你重新加载页面，你几乎看不到什么：所有新元素都在 `body` 元素的末尾，但它们都是空的，所以不占用空间。下一步将开始定义它们的外观。\n\
  \n## 为附加元素设置样式\n\n你可以直接将 CSS 添加到样式表中，但和之前一样，这意味着开发者需要做额外的工作。更好的做法是通过 JavaScript\
  \ 添加样式。在第 7 章关于操作 CSS 的内容中，我们在 JavaScript 中创建了一个样式块。在这里，我们将把这个想法付诸实践。\n\n要添加 CSS\
  \ 样式，首先创建一个 `style` 元素，并将其添加到文档的 `head` 中：\n\n```\nfunction doLightbox(container)\
  \ {\n...\n//  创建元素\n...\n//  样式表\nlet style = document.createElement('style');\n\
  document.head.insertAdjacentElement('afterbegin',style);\n...\n}\n```\n\n请注意，新的\
  \ style 元素被添加到 `head` 元素的*开头*。这允许之后添加额外的真实样式表，这意味着它们可以覆盖你的一些样式。\n\n### 添加样式规则\n\n\
  接下来，我们需要创建一些基本的 CSS 规则来完成工作。如果你在普通样式表中实现，基本的 CSS 看起来是这样的：\n\n```\n/*  背景 Div: */\n\
  div#lightbox-background {\nposition: fixed;\ntop: 0; left: 0; width:100%; height:\
  \ 100%;\nz-index: 1;\nbackground-color: rgb(0,0,0,0.5);\n}\n/*  容器 Div: */\nfigure#lightbox\
  \ {\nposition: fixed;\ntop: 50%; left: 50%; margin-right: -50%;\ntransform: translate(-50%,\
  \ -50%);\nz-index: 2;\n}\n```\n\nCSS 的工作原理如下：\n\n-   背景 `div` 需要填满整个屏幕，这是通过将其位置固定相对于屏幕（`position:\
  \ fixed`）并设置其左上角坐标和尺寸来实现的。\n-   为了达到遮罩屏幕其余部分的效果，背景颜色设置为黑色（`0,0,0`），但不透明度设置为 `0.5`，使其半透明（部分可见）。它还有一个非零的\
  \ `z-index`，这使其位于其他元素的前面。\n-   `figure` 元素需要居中于屏幕，这也需要将其位置固定相对于屏幕（`position: fixed`），但将其起始位置偏移一半。\n\
  -   为了确保 `figure` 元素出现在背景的前面，其 `z-index` 属性的值设置得比背景高。\n\n\n\n\n背景的实际颜色和不透明度是任意的，你可以轻松地在额外的真实样式表中覆盖这些值。\n\
  \n前面展示的 CSS 中的两个部分被称为**规则**，可以使用`insertRule()`添加：\n\n```\nfunction doLightbox(container)\
  \ {\n...\n//  Style Sheet\nlet style = document.createElement('style');\ndocument.head.insertAdjacentElement('afterbegin',style);\n\
  //  Lightbox Element Styles\nstyle.sheet.insertRule(`\ndiv#lightbox-background {\n\
  position: fixed;\ntop: 0; left: 0; width:100%; height: 100%;\nz-index: 1;\nbackground-color:\
  \ rgb(0,0,0,0.5);\n}\n`);\nstyle.sheet.insertRule(`\nfigure#lightbox {\nposition:\
  \ fixed;\ntop: 50%; left: 50%; margin-right: -50%;\ntransform: translate(-50%, -50%);\n\
  z-index: 2;\n}\n`);\n...\n}\n```\n\n我们使用了模板字面量来允许换行和缩进，以提高可读性。请记住，CSS 可以包含任意多的额外间距。如你所见，CSS\
  \ 有变得冗长的趋势，因此它永远不会非常紧凑。幸运的是，这些 CSS 已经足够实现所需效果。你现在看到的是整个页面被半透明背景覆盖。`figure`元素显示为一个小框，但由于没有内容，它在其他方面是不可见的。\n\
  \n### 隐藏和显示元素\n\n灯箱的整个技巧在于，背景和容器只会在你选择一张图片时出现，并在你查看完毕后消失。\n\n#### 显示和隐藏背景\n\n你已经开始编写`show()`函数来显示图像，现在可以添加一个`hide()`函数来隐藏它：\n\
  \n```\nfunction doLightbox(container) {\n...\n//  Showing & Hiding\nfunction show(event)\
  \ {\nevent.preventDefault();\n}\nfunction hide(event) {\n}\n}\n```\n\n要隐藏一个元素，你可以将其`display`属性设置为`none`。要显示该元素，则将其`display`属性设置为`block`，这是我们通常希望的显示方式：\n\
  \n```\nfunction doLightbox(container) {\n...\n//  Showing & Hiding\nfunction show(event)\
  \ {\nevent.preventDefault();\nbackground.style.display\n= figure.style.display\n\
  = 'block';\n}\nfunction hide(event) {\nbackground.style.display\n= figure.style.display\n\
  = 'none';\n}\n}\n```\n\n上述代码使用了链式赋值语句来设置多个属性。这样做的主要原因是为了明确表明你在将两个属性设置为相同的值。你不需要显示或隐藏图像或标题元素，因为它们是容器元素的一部分。\n\
  \n你已经将`show()`函数附加到了锚点的`click`事件上。要隐藏所有内容，你可以将`hide()`函数附加到背景的`click`事件上：\n\n```\n\
  function doLightbox(container) {\n...\n//  Showing & Hiding\nbackground.onclick\
  \ = hide;\nfunction show(event) {\n...\n}\n...\n}\n```\n\n这有效地将背景变成了一个巨大的按钮。你现在可以点击背景来隐藏它，但你也应该在脚本首次加载时调用`hide()`函数：\n\
  \n```\nfunction doLightbox(container) {\n...\n//  Showing & Hiding\nbackground.onclick=hide;\n\
  hide(); //  hide now\n...\n}\n```\n\n在此阶段，你可以通过点击图像和背景来测试显示和隐藏功能，但你只会看到背景的显示和隐藏。接下来，你需要用图像及其标题来填充容器。\n\
  \n## 显示图像内容\n\n下一步是显示图像及其标题。这基本上意味着显示`figure`元素，但首先你需要填充图像和标题段落。\n\n回想一下，图像位于一个锚点元素内：\n\
  \n锚点本身只是一个包装器，大部分视觉空间将被图像占据。因此，当你点击此处时，实际上是在点击图像。图像没有事件监听器，也没有默认的点击行为，所以它对点击事件不感兴趣。该点击事件会被传递到其容器，即锚点元素。正如我们在事件监听器章节中看到的，事件发生了**冒泡**。我们可以阻止冒泡发生，但在此例中，这正是我们想要的。包含图像的锚点*确实*有一个事件监听器，并且正是这个函数来执行任务。总之，你点击的是图像，但锚点会处理这个点击。\n\
  \n在事件监听器内部，有两个重要的对象：\n\n*   `event.target`指向你实际点击的元素：图像。\n*   另一方面，`event.currentTarget`是引用了附加了事件监听器的元素：锚点。\n\
  \n我们需要两者。`currentTarget`（即锚点）在其`href`属性中引用了一个更大的元素。`target`（即图像）在其`title`属性中包含了标题文本。\n\
  \n当我们显示更大的图像时，我们想要将锚点的`href`属性中的 URL 复制到弹出图像的`src`属性中。这意味着从`currentTarget`复制`href`：\n\
  \n```\nfunction show(event) {\nevent.preventDefault();\n//  populate image element\n\
  img.src = event.currentTarget.href;\nbackground.style.display = figure.style.display\
  \ = 'block';\n}\n```\n\n至于标题，它将来自原始图像的`title`属性。这意味着将`event.target`的`title`复制到`figcaption`的`textContent`：\n\
  \n```\nfunction show(event) {\nevent.preventDefault();\n//  populate image element\n\
  img.src = event.currentTarget.href;\n//  caption text\nfigcaption.textContent =\
  \ event.target.title;\nbackground.style.display = container.style.display = 'block';\n\
  }\n```\n\n弹出图像元素目前缺少`alt`和`title`属性。这些属性对于图像来说总是一个好习惯。我们可以同时复制它们：\n\n```\nfunction\
  \ show(event) {\nevent.preventDefault();\n//  populate image element\nimg.src =\
  \ event.currentTarget.href;\n//  caption text\nfigcaption.textContent = img.alt\
  \ = img.title\n= event.target.title;\nbackground.style.display=container.style.display='block';\n\
  }\n```\n\n你不会看到图像的`alt`或`title`属性，但`alt`是必需的，以防图像无法显示，而`title`通常会在鼠标悬停在图像上时出现。如果你现在加载页面，它会工作，但显示和隐藏会非常突兀。稍后，我们会让这个过程更有趣。然而，首先我们需要解决一个关于时序的小问题。\n\
  \n## 时序问题\n\n如果你在自己的机器上测试代码，可能会发现大部分功能按预期工作。但是，如果你从真实的网络服务器上运行代码，可能会因为加载图像的延迟而出现问题。\n\
  \n例如，如果你将第一个锚点中的`href`更改为\n\n```\n...\n```\n\n当你点击它时，会有一个短暂的延迟。然而，这个延迟会足够长，以至于图像不会在弹出窗口中显示。\n\
  \n这个问题本质上是一个关于 JavaScript 运行方式的问题。这里有一个简单的脚本来演示这个问题：\n\n```\n»   var image = new\
  \ Image();\n»   image.src =\n`http://pure-javascript.net/images/random.jpg?${Math.random()}`;\n\
  »   console.log(image.width);\n```\n\n\n\n`image` 变量是一个用于测试的虚拟图片，你实际上不会看到它。在 `random.jpg`\
  \ 后添加随机查询字符串可确保浏览器不会缓存该图片，因为缓存会干扰实验。\n\n语句 `image.src = ...;` 会使浏览器向服务器请求一张图片。然而，这可能需要一些时间，而\
  \ JavaScript 不喜欢等待。因此，下一行 `console.log(...)` 会在新图片*到达之前*运行，所以 `image.width` 还未就绪。你很可能得到\
  \ `0`，或者之前的值。\n\n我们说图片是**异步**加载的。这在之后使用 Ajax（同样涉及与 Web 服务器通信）时也会成为一个问题。\n\n现代 JavaScript\
  \ 有处理异步代码的新方法，但图片加载的延迟可以用一种更传统的方式轻松处理。图片可以有一个 `load` 事件监听器，当图片完全到达时会被触发。我们可以利用它来延迟部分代码的执行：\n\
  \n```\n»   var image = new Image();\n»   function doit(event) {\nconsole.log(image.width);\n\
  }\n»   image.onload = doit;\n»   image.src =\n`https://pure-javascript.net/images/random.jpg?${Math.random()}`;\n\
  »   console.log('Meanwhile ...');\n```\n\n现在，`console.log(...);` 语句会等待图片加载完成，结果将是正确的。注意消息\
  \ `Meanwhile` 会在图片宽度*之前*打印出来，因为它是立即执行的，无需等待。\n\n这个事件监听器很简单，不需要命名函数，因此我们可以使用函数表达式：\n\
  \n```\n»   image.onload = function(event) {\nconsole.log(image.width);\n}\n```\n\
  \n或更简洁的箭头函数表达式：\n\n```\n»   image.onload = event => {\nconsole.log(image.width);\n\
  }\n```\n\n回到我们的 lightbox 项目，我们可以利用这个想法，在图片到达之前暂缓显示弹出窗口：\n\n```\nfunction show(event)\
  \ {\nevent.preventDefault();\n//  填充图片元素\nimg.src = event.currentTarget.href;\n\
  //  标题文本\nfigcaption.textContent = img.alt = img.title\n= event.target.title;\n\
  //  background.style.display = figure.style.display='block';\nimg.onload = event\
  \ => {\nbackground.style.display = figure.style.display = 'block';\n};\n}\n```\n\
  \n现在我们已经准备好了要显示的内容，但只会在图片到达后才显示。你现在可以测试这个项目了。\n\n## 添加键盘控制\n\n到目前为止，lightbox 画廊是通过鼠标控制的，这已经够用了。你还可以为画廊添加一些键盘控制。至少，你应该能够使用\
  \ Escape 键这样的按键来取消弹出窗口，但我们还可以添加一些按键来浏览画廊。\n\n这是我们想要实现的键盘行为：\n\n| 按键 | 行为 |\n| ---\
  \ | --- |\n| ![](img/609513_1_En_9_Figa_HTML.gif) 一个退出图标。 | 隐藏图片 |\n| ![](img/609513_1_En_9_Figb_HTML.gif)\
  \ 主页图标。或 ![](img/609513_1_En_9_Figc_HTML.gif) 向上箭头图标。 | 第一张图片 |\n| ![](img/609513_1_En_9_Figd_HTML.gif)\
  \ 向左箭头图标。 | 上一张图片。如果在开头，则循环到最后一张图片 |\n| ![](img/609513_1_En_9_Fige_HTML.gif) 向右箭头图标。\
  \ | 下一张图片。如果在结尾，则循环到第一张图片 |\n| ![](img/609513_1_En_9_Figf_HTML.gif) 结束图标。或 ![](img/609513_1_En_9_Figg_HTML.gif)\
  \ 向下箭头图标。 | 最后一张图片 |\n\n与其他所有功能一样，这将通过事件监听器来实现。\n\n### 添加键盘事件监听器\n\n你可以将键盘事件监听器添加到单个元素上，例如表单中的\
  \ `textarea` 元素，但这里我们没有任何元素可以聚焦键盘。在这种情况下，我们将事件监听器添加到文档本身。\n\n为了不影响页面其他部分键盘的正常使用，我们只在图片显示时分配事件监听器，并在图片隐藏时移除它。我们将这个函数命名为\
  \ `doKeys()`。\n\n```\nfunction show(event) {\n...\ndocument.addEventListener('keydown',doKeys);\n\
  }\nfunction hide(event) {\n...\ndocument.removeEventListener('keydown',doKeys);\n\
  }\nfunction doKeys(event) {\n}\n```\n\nJavaScript 有几种响应键盘事件的方式，包括 `keydown`、`keyup`\
  \ 和 `keypress`，它们发生在按键的不同阶段。它们在响应非字符键（如 `shift` 键）的方式上也不同。对于我们的按键来说，`keydown` 事件似乎效果最好。\n\
  \n`doKeys()` 事件监听器函数的起始方式与其他任何事件监听器一样：\n\n```\nfunction doLightbox(container) {\n\
  //  --snip--\nfunction doKeys(event) {\nevent.preventDefault();\n}\n}\n```\n\n稍后我们将允许使用方向键浏览图片集。但是，它们通常会使页面滚动，所以我们要在显示图片时阻止这种情况。添加\
  \ `preventDefault()` 将阻止任何此类按键被进一步处理。\n\n### 检查按下的键\n\n我们需要检查按下了哪个键。这个信息可以在 `event.key`\
  \ 属性中找到。你可能会发现一些旧代码使用了不同的属性，这在过去非常成问题，因为不同的浏览器对按键有不同的值。幸运的是，更现代的 `event.key` 属性更简单、更可靠。\n\
  \n最终，我们将响应多个不同的按键，因此使用 `switch` 语句来区分它们更容易。`switch` 语句就像一个专门的 `if ... else if ...\
  \ else if ... else` 块。它用于将未知值与多个备选值进行匹配。\n\n例如，我们可以获取一个用户输入的数字并按如下方式测试（如果你想测试，可以在行之间使用\
  \ shift-return）：\n\n```\n»   var n = prompt('Choose 1 ... 4');\nif(n==1) {\nconsole.log('one');\n\
  }\nelse if(n==2) {\nconsole.log('two');\n}\nelse if(n==3) {\nconsole.log('three');\n\
  }\nelse if(n==4) {\nconsole.log('four');\n}\nelse {\nconsole.log('whatever');\n\
  }\n```\n\n`switch` 语句做的*几乎*是同一件事，但又不完全相同。开始时，它看起来像这样，但还不能正常工作：\n\n```\n»   var n\
  \ = prompt('Choose 1 ... 4');\nswitch(n) {\ncase 1:\nconsole.log('one');\ncase 2:\n\
  console.log('two');\ncase 3:\nconsole.log('three');\ncase 4:\nconsole.log('four');\n\
  default:\nconsole.log('whatever');\n}\n```\n\n原则上，你是在将变量 `n` 与各个值进行匹配。如果它没有任何匹配，就会落到\
  \ `default` 分支。你首先会注意到输入数字无法匹配。由于某种原因，`switch` 语句不会进行 JavaScript 的常规自动类型转换，`prompt()`\
  \ 函数返回的字符串与 `case` 块中的数字不匹配。\n\n你可以尝试自己转换值：\n\n```\n»   var n = prompt('Choose 1\
  \ ... 4');\nswitch(parseInt(n)) {\n...\n}\n```\n\n现在你遇到了下一个问题。如果你输入，比如数字 `2`，你会发现你会得到从\
  \ `two` 开始的所有输出语句。一旦进入一个 `case` 块，就会继续执行后续的块，即使后面的 case 不匹配。这即使对有经验的开发者来说也令人困惑，但这是出于历史原因。我们稍后甚至会利用这一点。\n\
  \n同时，解决方案是处理完每个 case 后添加一个 `break` 语句：\n\n```\n»   var n = prompt('Choose 1 ...\
  \ 4');\nswitch(parseInt(n)) {\ncase 1:\nconsole.log('one');\nbreak;\ncase 2:\nconsole.log('two');\n\
  break;\ncase 3:\nconsole.log('three');\nbreak;\ncase 4:\nconsole.log('four');\n\
  break;\ndefault:\nconsole.log('whatever');\n}\n```\n\n你不需要在 `default` case 之后添加\
  \ break，因为它是最后一个，没有其他地方可以去了。\n\n回到项目，我们将添加 `switch` 块的大纲来测试各种按键：\n\n\n```javascript\n\
  function doKeys(event) {\nevent.preventDefault();\nswitch(event.key) {\n}\n}\n```\n\
  \n每个按键都将在不同的 `case` 代码块中实现。\n\n## 使用 Escape 键隐藏\n\n第一个 case 将用于检测 Escape 键，并利用它隐藏弹出窗口：\n\
  \n```javascript\nfunction doKeys(event) {\nevent.preventDefault();\nswitch(event.key)\
  \ {\ncase 'Esc': //  旧版本\ncase 'Escape':\nhide();\nbreak;\n}\n}\n```\n\nEscape 键的正确值是\
  \ `Escape`。然而，一些较旧的浏览器会使用旧的 `Esc` 名称，因此最好同时检查两者。这可以通过包含一个空值的 `case` 并让它自然落入下一个 case\
  \ 来实现。请注意，我们利用了一个事实，即代码会继续执行后续的 `case` 代码块，直到遇到 `break` 或到达末尾。这就是我们允许 `Esc` case\
  \ 落入 `Escape` case 的方式。现在您可以测试页面，并验证 Escape 键是否确实隐藏了弹出图像。\n\n## 添加导航键\n\n我们还将使用箭头键浏览图库。然而，当前的代码只知道*当前*图像，无法显示上一张或下一张图像。为了实现导航，我们首先需要**重构**代码。\n\
  \n### 重构图像加载\n\n**重构**指的是更改代码的结构而不改变其行为。这样做通常是为了提高代码的效率或可靠性，但在本例中，是为了使其更加灵活。\n\n\
  目前，当您点击图库链接时，会加载较大的图像，并且弹出窗口开始出现。所需的信息可以从您点击的图像中获得。\n\n当浏览图库时，弹出窗口已经出现，您需要加载新内容。这些信息无法直接从您点击的图像中获得，因此您需要采用不同的方法：\n\
  \n-   当您点击图像时，弹出元素会像之前一样出现。\n-   作为独立过程，弹出图像和标题将被填充。这将允许您独立于显示或隐藏弹出窗口来导航到其他图像。\n\
  \n还有一个与使用键盘相关的逻辑问题。当您点击图像时，事件的 `currentTarget` 和 `target` 会由鼠标的 `click` 事件设置为锚点和嵌套图像。然而，当您按下箭头键时，新事件的\
  \ `currentTarget` 和 `target` 与按键操作相关，而与任何图像无关。\n\n首先，我们需要跟踪当前显示的图像，因为我们需要从那里开始使用箭头键进行导航。我们可以使用一个新变量来实现这一点：\n\
  \n```javascript\nfunction doLightbox(container) {\nlet images = document.querySelectorAll(`${container}>a`);\n\
  anchors.forEach(a => {\na.onclick = show;\n});\nlet currentAnchor;  //  当前锚点\n...\n\
  }\n```\n\n`currentAnchor` 变量实际上将是对包含图像的锚点的引用。每当您点击图像时，它将被首次设置：\n\n```javascript\n\
  function doLightbox(container) {\n...\nfunction show(event) {\nevent.preventDefault();\n\
  currentAnchor = event.currentTarget;\n...\n}\n...\n}\n```\n\n现在，我们将把 `event.currentTarget`\
  \ 的引用改为 `currentAnchor`：\n\n```javascript\nfunction show(event) {\nevent.preventDefault();\n\
  currentAnchor = event.currentTarget;\n//  填充图像元素\nimg.src = currentAnchor.href;\n\
  ...\n}\n```\n\n下一步是将代码的加载部分移到一个单独的函数中。我们将其命名为 `loadImage()`：\n\n```javascript\n\
  function loadImage() {\n//  填充图像元素\nimg.src = currentAnchor.href;\n//  标题文本\n//\
  \  figcaption.textContent = img.alt = img.title\n//      = event.target.title;\n\
  img.onload = event => {\nbackground.style.display = figure.style.display = 'block';\n\
  };\n}\nfunction show(event) {\nevent.preventDefault();\ncurrentAnchor = event.currentTarget;\n\
  //  代码移至 loadImage()\ndocument.addEventListener('keydown',doKeys);\n}\n```\n\n我们也从\
  \ `show()` 函数中剪切出了代码，并暂时用注释替换了它。\n\n请注意，`figcaption.textContent =` 代码目前也被注释掉了。这是因为事件目标存在的问题：我们不再能够直接引用嵌套的图像元素。不过，使用\
  \ `querySelector()` 可以轻松地在当前锚点内部查找该引用：\n\n```javascript\nlet currentImage = currentAnchor.querySelector('img');\n\
  ```\n\n然后，我们可以使用 `currentImage` 变量来代替 `event.target` 属性：\n\n```javascript\nfunction\
  \ loadImage() {\nlet currentImage = currentAnchor.querySelector('img');\n//  填充图像元素\n\
  img.src = currentAnchor.href;\n//  标题文本\nfigcaption.textContent = img.alt = img.title\n\
  = currentImage.title;\n//  background.style.display = figure.style.display='block';\n\
  img.onload = event => {\nbackground.style.display = figure.style.display = 'block';\n\
  };\n}\n```\n\n通常，我们使用 `document.querySelector()`，它会在整个文档中搜索匹配项。这里，我们将搜索范围限制在当前锚点内。我们可以将其添加到\
  \ `loadImage()` 函数中，并使用 `currentImage` 来提取标题。\n\n最后，我们不再在 `show` 函数本身中加载图像，而是调用\
  \ `loadImage()` 函数：\n\n```javascript\nfunction show(event) {\nevent.preventDefault();\n\
  currentAnchor = event.currentTarget;\nloadImage();\ndocument.addEventListener('keydown',doKeys);\n\
  }\n```\n\n此时，一切应和之前一样正常工作，但现在我们将能够从代码的其他部分重用 `loadImage()` 函数。这将是响应箭头键的操作。\n\n##\
  \ 加载相邻图像\n\n现在我们可以添加代码来启用箭头键，以及 `Home` 和 `End` 键。\n\n首先，我们来实现左箭头和右箭头。我们可以在 `switch`\
  \ 中开始添加这些：\n\n```javascript\nswitch(event.key) {\ncase 'Esc': //  旧版本\ncase 'Escape':\n\
  hide();\nbreak;\ncase 'Left':    //  旧版本\ncase 'ArrowLeft':\n//  上一张图像\nbreak;\n\
  case 'Right':   //  旧版本\ncase 'ArrowRight':\n//  下一张图像\nbreak;\n}\n```\n\n在较旧的浏览器中，这些键被称为\
  \ `Left` 和 `Right`，但现在前面加上了单词 `Arrow`。我们再次使用空的 `case` 代码块来实现这一点。\n\n要获取上一个或下一个锚点，您需要：\n\
  \n-   **上一个锚点**：`currentAnchor.previousElementSibling`\n-   **下一个锚点**：`currentAnchor.nextElementSibling`\n\
  \n`previousElementSibling` 和 `nextElementSibling` 属性分别指当前元素之前或之后的元素，会跳过任何空白或注释。\n\
  \n之后，您可以调用 `loadImage()` 函数，让它完成其余工作：\n\n```javascript\nswitch(event.key) {\ncase\
  \ 'Esc': //  旧版本\ncase 'Escape':\nhide();\nbreak;\ncase 'Left':    //  旧版本\ncase\
  \ 'ArrowLeft':\ncurrentAnchor = currentAnchor.previousElementSibling;\nloadImage();\n\
  break;\ncase 'Right':   //  旧版本\ncase 'ArrowRight':\ncurrentAnchor = currentAnchor.nextElementSibling;\n\
  loadImage();\nbreak;\n}\n```\n\n如果您进行测试，当尝试移动过远时，会发现一个错误。在第一张图像之前和最后一张图像之后都没有图像。我们需要考虑到这一点，但首先我们将处理选择第一张和最后一张图像。\n\
  \n## 加载第一张和最后一张图像\n\n我们可以为第一张和最后一张图像再添加两个 switch 代码块：\n\n```javascript\nswitch(event.key)\
  \ {\n...\ncase 'Home':\ncase 'Up':      //  旧版本\ncase 'ArrowUp':\n//  第一张图像\nbreak;\n\
  case 'End':\ncase 'Down':    //  旧版本\ncase 'ArrowDown':\n//  最后一张图像\nbreak;\n}\n\
  ```\n\n这里同样有新旧版本的箭头键名称；我们还有 `Home` 和 `End` 键分别作为上箭头键和下箭头键的同义词。与相邻兄弟元素不同，JavaScript\
  \ 没有“第一个”或“最后一个”兄弟元素属性，因此我们需要采用不同的方法。\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将该英文文档翻译成中文。\n\
  \n\n# 文档格式化\n\n虽然无法获取第一个或最后一个同级元素，但可以获取元素的第一个或最后一个子元素。诀窍是找到当前锚点的父元素，然后获取该父元素的第一个或最后一个子元素。你可以使用如下代码：\n\
  \n*   第一个锚点：`currentAnchor.parentNode.firstElementChild`\n*   最后一个锚点：`currentAnchor.parentNode.lastElementChild`\n\
  \n`parentNode` 是包含当前锚点的元素：即容器 `div`。从那里，你可以选择第一个或最后一个元素，同样会跳过空白和注释。\n\n现在，我们可以添加如下代码：\n\
  \n```\nswitch(event.key) {\n...\ncase 'Home':\ncase 'Up':      //  旧版本\ncase 'ArrowUp':\n\
  currentAnchor = currentAnchor.parentNode.firstElementChild;\nloadImage();\nbreak;\n\
  case 'End':\ncase 'Down':    //  旧版本\ncase 'ArrowDown':\ncurrentAnchor = currentAnchor.parentNode.lastElementChild;\n\
  loadImage();\nbreak;\n}\n```\n\n现在，回到左右箭头键的问题。合理的期望是集合能够循环；也就是说，第一张图片之前的应该是集合中的最后一张，最后一张图片之后的应该是集合中的第一张。\n\
  \n## 环绕末端\n\n如果尝试选择第一张图片之前或最后一张图片之后的元素，你会得到一个错误，提示 `currentAnchor` 变量是 `null`。在\
  \ JavaScript 中，你可以使用**或**运算符 (`||`) 来添加一个备选方案。例如：\n\n```\n»   var a = null;\n» \
  \  console.log(a || 'Banana');\n\"Banana\"\n```\n\n在上述代码中，如果变量 `a` 有实际值，则使用该值。这里，它是\
  \ `null`，接近于“无”，所以使用下一个值 `Banana`。我们说 `||` 表达式是**短路**的。\n\n根据这个信息，如果下一张图片为 `null`，我们可以使用第一张图片；同样地，如果上一张图片为\
  \ `null`，我们可以使用最后一张图片：\n\n```\n//  上一张图片\ncurrentAnchor = currentAnchor.previousElementSibling\
  \ ||\ncurrentAnchor.parentNode.lastElementChild;\n//  下一张图片\ncurrentAnchor = currentAnchor.nextElementSibling\
  \ ||\ncurrentAnchor.parentNode.firstElementChild;\n```\n\n现在，你可以完成 `switch` 代码块：\n\
  \n```\nswitch(event.key) {\n...\ncase 'Left':    //  旧版本\ncase 'ArrowLeft':\ncurrentAnchor\
  \ = currentAnchor.previousElementSibling ||\ncurrentAnchor.parentNode.lastElementChild;\n\
  loadImage();\nbreak;\ncase 'Right':   //  旧版本\ncase 'ArrowRight':\ncurrentAnchor\
  \ = currentAnchor.nextElementSibling ||\ncurrentAnchor.parentNode.firstElementChild;\n\
  loadImage();\nbreak;\n...\n}\n```\n\n现在，你可以测试包含键盘导航功能的灯箱画廊了。\n\n## 添加 CSS 特效\n\n\
  如果你测试在线版本，会注意到图片显示时带有动画效果（这可能符合也可能不符合你的喜好）。这个效果纯粹由 CSS 实现，JavaScript 仅负责触发它。\n\n\
  你不需要了解全部细节，但关键部分在于以下的 CSS 代码：\n\n```\nfigure#lightbox {\ntransform-origin: 0 0;\n\
  transition:\ntransform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275),\nopacity 2s;\n\
  }\nfigure#lightbox.closed {\nopacity: 0;\ntransform: scale(0) translate(-50%, -50%);\n\
  }\nfigure#lightbox.open {\nopacity: 1;\ntransform: scale(1) translate(-50%, -50%);\n\
  }\n```\n\n当 figure 关闭时，其 `opacity` 设为 `0`。figure 也被缩小到无。结果是你看不到任何东西。如果 figure 打开，`opacity`\
  \ 和 `scale` 将变为正常的可见度和正常大小。然而，特效在于 `transition` 属性。在 CSS 中，`transition` 基本上意味着缓慢变化。在这种情况下，透明度在一秒钟内变化，产生淡入效果。缩放比例在两秒内增加，但由于\
  \ `cubic-bezier` 的值，变化并不均匀。\n\n为了让 CSS 发挥作用，我们将做两处修改。首先，我们只更改背景的 `display` 属性，而不更改\
  \ figure 的：\n\n```\nfunction loadImage() {\n...\nimg.onload = event => {\n//  background.style.display\
  \ = figure.style.display = 'block';\nbackground.style.display = 'block';\n...\n\
  };\n}\nfunction show(event) {\n...\n}\nfunction hide(event) {\n//  background.style.display\
  \ = figure.style.display = 'none';\nbackground.style.display = 'none';\n...\n}\n\
  ```\n\n第二处是将 `closed` 或 `open` 类应用于 figure：\n\n```\nfunction loadImage() {\n...\n\
  img.onload = event => {\n//  background.style.display = figure.style.display = 'block';\n\
  background.style.display = 'block';\nfigure.classList.add('open');\nfigure.classList.remove('closed');\n\
  };\n}\nfunction show(event) {\n...\n}\nfunction hide(event) {\n//  background.style.display\
  \ = figure.style.display = 'none';\nbackground.style.display = 'none';\nfigure.classList.remove('open');\n\
  figure.classList.add('closed');\n...\n}\n```\n\n通常，你只需要一个类来在两个状态之间切换，就像我们在其他项目中所做的那样。但是，在这种情况下，这样做会将\
  \ figure 的透明度设置为 `0`，这会干扰代码的早期版本。\n\n## 将代码移至库中\n\n现在一切正常，你可以将代码移至库文件。由于所有代码都在一个函数中，只需将其剪切并粘贴到\
  \ `library.js` 文件中即可。HTML 文件中已经有了一个指向该文件的链接。\n\n你可以添加以下块注释：\n\n```\n/*  function\
  \ doLightbox(container)\n================================================\n用于实现图片库灯箱功能的函数。\n\
  使用以下结构：\n\n锚点包含对大图的引用。\n图片包含缩略图。\n================================================\
  \ */\n```\n\n## 重新审视幻灯片\n\n在第 4 章中，我们开发了一个简单的幻灯片。它能完成任务，但缺少我们在本章中为灯箱画廊添加的一些亮点。在本节中，我们将为幻灯片添加一些淡入淡出效果。首先，我们需要重新打开\
  \ `slideshow.html`、`slideshow.js` 和 `library.js` 文件。\n\n### 使用 CSS 淡入图片\n\n为了让每张图片淡入，我们将过渡元素的\
  \ `opacity`，即元素的透明度。`opacity` 为 `0` 表示完全透明，因此不可见；`opacity` 为 `1` 表示实心。将透明度值从 0 过渡到\
  \ 1 将使元素淡入。\n\n首先，我们将添加一个样式表和几条规则，就像我们对灯箱画廊所做的那样：\n\n```\nfunction doSlides(images,\
  \ containerSelector, delay=3000) {\n...\n//  淡入效果\nlet style = document.createElement('style');\n\
  document.head.insertAdjacentElement('afterbegin',style);\nstyle.sheet.insertRule(`\n\
  div#slides>img {\nopacity: 0;\n}\n`);\nstyle.sheet.insertRule(`\ndiv#slides>img.showing\
  \ {\ntransition: opacity 1s;\nopacity: 1;\n}\n`);\nfunction toggle() {\n...\n}\n\
  ...\n}\n```\n\n图片的初始透明度将为 `0`，这意味着它是透明的。我们将其过渡到 `1`，这将是不透明的。过渡将耗时一秒。CSS 过渡只会在你更改元素状态时运行。在这种情况下，我们将更改类，即改为\
  \ `showing`。\n\n### 触发过渡\n\n我们将在 `next()` 函数中更改状态：\n\n```\nfunction next() {\n//\
  \  填充图片\nimg.src = `images/slides/${images[slideNumber].src}`;\nimg.classList.add('showing');\n\
  caption.textContent = images[slideNumber]. caption;\nimg.title = images[slideNumber].caption;\n\
  img.alt = images[slideNumber].caption;\nslideNumber++;\n...\n}\n```\n\n但是，如果该类已被添加，再次添加将不起作用，因此过渡不会被触发。你必须先将其移除：\n\
  \n```\nfunction next() {\n//  填充图片\nimg.src = `images/slides/${images[slideNumber].src}`;\n\
  img.classList.remove('showing');\nimg.classList.add('showing');\n...\n}\n```\n\n\
  \n\n这样做仍然不行，因为浏览器会采取捷径来避免不必要的额外工作。如果你打算移除一个类再重新添加它，浏览器会决定什么都不做，因此过渡*仍然*不会被触发。然而，如果我们能在两个语句*之间*欺骗浏览器更新文档，它就会按要求移除并添加这个类，过渡也就会被触发。\n\
  \n强制更新的一种方法是读取某个元素的尺寸。由于尺寸*可能*会受到 CSS 影响，浏览器必须在测量元素大小之前应用类中的改动。然后，类中的下一次改动也将被应用：\n\
  \n```\nfunction next() {\n//  载入图片\nimg.src = `images/slides/${images[slideNumber].src}`;\n\
  img.classList.remove('showing');\nimg.offsetHeight;\nimg.classList.add('showing');\n\
  ...\n}\n```\n\n`.offsetHeight`属性是许多能给出元素当前尺寸的属性之一。由于`offsetHeight`可能受到 CSS 影响，浏览器需要在读取它之前按照指示进行任何调整。\n\
  \nJavaScript 会愉快地允许你使用任何表达式作为语句，例如`1+2;`，并且我们在开头的`use strict`语句中已经见过这种情况。大多数情况下，这个值会被忽略，因为你实际上并没有用它做任何事情。有时，你会看到它和`void`运算符一起使用：\n\
  \n```\nimg.classList.remove('showing');\nvoid img.offsetHeight;\nimg.classList.add('showing');\n\
  ```\n\n`void`运算符的结果总是`undefined`，如果你不希望代码中存在任何零散的值，这会很有用。在类更改之间读取属性以强制浏览器执行操作，这个技巧是让\
  \ CSS 过渡在 JavaScript 中工作的关键。\n\n### 交叉淡入淡出\n\n之前淡入效果的唯一问题是每张新图片都是从空白开始的：这就是图片切换时你所看到的闪烁。如果你希望从一张图片淡出到下一张，这被称为**交叉淡入淡出**。\n\
  \n要实现交叉淡入淡出，你需要一个额外的`img`元素，放在原始图片上方，这样你就能从一张淡出到另一张。你将在图 9-3 到图 9-5 中看到这个过程。使用额外的图片：\n\
  \n![](img/609513_1_En_9_Fig3_HTML.jpg)\n\n*   将其`opacity`设置为`1`，使其不透明。然后，将旧图片复制到前面的额外图片中。\n\
  *   用新图片填充原始的`img`元素。你暂时还看不到它，因为它位于另一张图片后面。\n\n![](img/609513_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4** 新图片已更换\n\n*   触发一个 CSS 过渡，将前方图片的`opacity`设置为`0`，使其不可见。\n\n![](img/609513_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5** 前景图片淡出\n\n过程就是这样。我们现在就来创建额外的图片。\n\n### 创建额外图片\n\n我们将通过复制原始的`img`元素来创建额外图片。这被称为`克隆`元素。这样，我们可以确保新图片与原始图片具有相同的尺寸。\n\
  \n要克隆一个元素，使用`cloneNode()`。从技术上讲，文档中的所有元素都被称为**节点**，以反映它们在文档对象模型中的位置。我们还会给它一个`id`，以便稍后使用：\n\
  \n```\nfunction doSlides(images, containerSelector, delay=3000) {\n//  元素\nlet container\
  \ = document.querySelector(containerSelector);\nlet img = container.querySelector('img');\n\
  let prefetch = new Image();\n//  交叉淡入淡出\nlet crossFade = img.cloneNode();\ncrossFade.id\
  \ = 'crossfade';\nimg.insertAdjacentElement('afterend', crossFade);\n...\n}\n```\n\
  \n新的`img`元素被立即插入到原始元素之后，这样它就会在之后显示出来。\n\n### 为新图片设置样式\n\n如果你查看你的文档，你会看到原始图片下方出现了一大块空白。CSS\
  \ 样式表确实包含将新图片定位到另一张图片上方所需的样式。我们将像实现淡入效果时那样，把这些样式添加到代码中。\n\n同时，我们可以移除旧的 CSS 规则，以免它们干扰这个版本。\n\
  \n```\nstyle.sheet.insertRule(`\ndiv#slidese {\nposition: relative;\n}\n`);\nstyle.sheet.insertRule(`\n\
  div#slides>img#crossfade {\ndisplay: block;\nposition: absolute;\ntop: 0; left:\
  \ 0;\nopacity: 1;\n}\n`);\nstyle.sheet.insertRule(`\ndiv#slides>img#crossfade.fading\
  \ {\ntransition: opacity 2500ms;\nopacity: 0;\n}\n`);\n```\n\n这里，我们将保持原始图片不动，让新的`crossFade`图片来完成所有繁重的工作。除了`opacity`和`transition`属性之外：\n\
  \n*   默认情况下，图片像文本一样以内联方式显示。我们需要将其改为`block`，以便更好地控制其大小和位置。\n*   `position: absolute;`意味着我们可以将其定位在相对于其容器（即父级`div`）的任何位置。我们希望将其定位在`top:\
  \ 0; left: 0;`，即左上角。\n*   如果你在想，什么元素的左上角？`div`的`position: relative;`属性回答了这个问题：它将位于其容器的角落。\n\
  \n### 触发交叉淡入淡出\n\n要真正实现交叉淡入淡出，首先要做的是将旧图片复制到交叉淡入淡出图片中：\n\n```\nfunction next() {\n\
  //  复制到交叉淡入淡出\ncrossFade.src = img.src;\ncrossFade.alt = img.alt;\n...\n}\n```\n\
  \n从技术上讲，每个图片都应该包含一个`alt`属性，所以我们直接从原始图片中复制过来。\n\n下一张图片将像以前一样分配，但现在我们更改的是交叉淡入淡出图片的类，而不是原始图片：\n\
  \n```\nfunction next() {\ncrossFade.src = img.src;\nimg.src = `images/slides/${images[slideNumber].src}`;\n\
  // img.classList.remove('showing');\n// img.offsetHeight;\n// img.classList.add('showing');\n\
  crossFade.classList.remove('fading');\ncrossFade.offsetHeight;\ncrossFade.classList.add('fading');\n\
  ...\n}\n```\n\n同样，之前的代码已被注释掉，因为你不再需要它了。通常，你会期望删除不需要的代码，但我们以注释形式将其保留在这里，以便你可以比较这两种技术。你甚至可能决定更喜欢旧的实现方式。\n\
  \n## 总结\n\n在这个项目中，我们开发了一个灯箱工具，用于从较小的缩略图弹出较大的图片。我们还应用这些技术增强了第 4 章的幻灯片展示。\n\n### 劫持链接\n\
  \n幻灯片展示的缩略图包含在 HTML 锚点中，这些锚点引用了较大版本的图片。我们可以通过为锚点添加一个`click`事件监听器并阻止其默认行为来拦截这些锚点。锚点和嵌套的图片除了图片本身之外，还包含有用的数据：锚点包含对较大图片的引用，而图片有一个`title`属性，我们可以将其用作标题。当你点击锚点中的图片时，图片和锚点都会触发`click`事件。为了从正确的元素中提取正确的数据，我们区分了`target`（指向被点击的图片）和`currentTarget`（指向包含图片的锚点）。\n\
  \n\n\n### 添加元素与样式\n\n为了管理灯箱效果，最好先创建辅助元素，这样原始 HTML 就不需要过多调整。为这些新元素添加额外样式也是同理。可以创建一个样式块并将其添加到网页的\
  \ `head` 部分。最好将其添加到开头，这样外部样式表之后仍能被应用。这个新样式块只需包含足以实现效果的 CSS 代码，包括将背景设置为半透明覆盖整个屏幕，以及让弹出窗口显示在屏幕中央的\
  \ CSS。另外还可以准备一个样式表来负责美化外观。\n\n### 显示与隐藏内容\n\n内容的可见性可以通过修改元素的 `display` 属性来控制。为了增强效果，还可以操作元素的\
  \ class 属性，让 CSS 样式来处理隐藏与显示。如果我们希望显示和隐藏的效果更生动——比如在灯箱画廊中放大图像、在幻灯片中淡入淡出——那么修改 class\
  \ 属性就特别有用。通过先改变一个元素的 class，然后再改回来，可以触发过渡效果。但是，由于 JavaScript 倾向于合并更改，必须通过读取一个受影响的属性（例如\
  \ `.offsetHeight` 属性）来强制浏览器更新屏幕。\n\n### 时间控制\n\n由于图像是作为独立资源加载的，它们始终是异步加载的。当依赖尚未加载完成的图像时，就会产生问题。可以使用\
  \ `onload` 事件来触发等待，直到图像加载完毕后再尝试使用它。\n\n### 使用键盘\n\n可以使用键盘来控制图库。通过添加键盘事件监听器，我们可以响应特定按键来在图库中移动浏览。\n\
  \n### 重构\n\n重构是指修改代码，使其行为保持不变但更具适应性。当尝试重用那些在开发阶段应用范围有限的代码时，这一点尤为重要。\n\n### 父元素、子元素与兄弟元素\n\
  \n当在一组元素中导航时，我们需要了解引用相邻元素的方法。相邻元素可以被引用为前一个或后一个兄弟元素。集合中的第一个和最后一个元素必须被引用为其父元素的第一个和最后一个子元素。\n\
  \n### 交叉淡入淡出\n\n虽然通过改变 class 来触发过渡效果实现淡入淡出很简单，但创建交叉淡入淡出效果则需要额外的工作。要创建交叉淡入淡出效果，我们可以克隆现有图像，并使用\
  \ CSS 将其定位在原始图像之上。然后将原始图像的副本放入交叉淡入淡出的图像中，并替换原始图像。通过淡出交叉淡入淡出的图像，让新图像逐渐显现，从而实现了交叉淡入淡出的效果。\n\
  \n### 下章预告\n\n我们这里开发的灯箱工具可以用于任何画廊项目。但是，它确实需要您准备好一个包含锚点集合和图片集合的 `div` 容器，因此它可能不像想象中那么方便或灵活。为了更简单地使用灯箱，我们可以改用包含图片文件名和标题的\
  \ CSV 文件。然后，JavaScript 可以读取该文件，并为我们生成锚点和图片。这样，进行更改也会更容易，无需麻烦地修改 HTML。幻灯片同理，我们可以获取图片列表，并用它来填充幻灯片。如果要从网络服务器获取更多数据，则需要一种称为\
  \ Ajax 的技术。Ajax 允许 JavaScript 请求和接收额外的数据。这些数据可以是简单的文本，也可以更复杂。然后，我们可以利用这些数据对当前页面进行更改。在下一章中，我们将介绍\
  \ Ajax 的基础知识，以及如何使用它从网络服务器加载更多内容。\n\n# 10. 项目：Ajax 入门\n\n如果您尝试在没有网络服务器的情况下运行此项目，那可能不太走运。除非其他域名明确允许，否则\
  \ JavaScript 无法向不同域名发出 Ajax 请求。这被称为**同源策略**。现代浏览器倾向于将本地打开的（通过“文件：打开...”）不同文档视为来自不同域，*即使它们位于同一个文件夹中*。因此，Ajax\
  \ 请求将被拒绝。使用 `http://` 协议从同一位置获取的文件被视为来自同一源，这就是为什么本章节需要一个网络服务器。此项目中唯一能正常工作的部分是最后一节，因为它专门访问了不同的网络服务器。运行此项目不需要功能强大的网络服务器。您可以从\
  \ [`https://github.com/manngo/micro-web-server/releases/latest`](https://github.com/manngo/micro-web-server/releases/latest)\
  \ 使用一个轻量级的服务器。\n\n在迄今为止的一些项目中，包含了大量静态内容。幻灯片使用了硬编码的图片列表。关于显示和隐藏内容的项目操作了页面上已有的内容。而灯箱项目则需要一个缩略图图片和链接的集合。\n\
  \n传统上，当你从网络服务器加载一个包含图片、CSS 文件和其他相关资源的页面时，连接会关闭，浏览器自行处理已获取的内容。但是，借助 JavaScript，你可以通过一种称为\
  \ **Ajax** 的过程来获取额外的资源。Ajax 这个词据说是由 James Garrett 创造的，用来描述一系列允许浏览器无需从头重新加载所有内容即可与服务器交互的技术。在我们的例子中，我们将使用\
  \ JavaScript 与相同或不同的网络服务器建立另一个连接，允许它请求额外的资源或将信息发送回服务器。\n\n在幻灯片项目中，你已经看到了这个想法的一个简单形式。每次更改图片的\
  \ `.src` 属性时，你都会与服务器建立一个新的连接以获取另一张图片。以原始的方式，你也在与服务器通信，因为每个图片的请求都可以被处理，并可能被记录。\n\n\
  现代 JavaScript 现在能够以更复杂的方式做到这一点，同时在服务器端和浏览器端进行实时更新。现代 Ajax 最初是使用一个特殊的 `XMLHTTPRequest`\
  \ 对象实现的，后来经过改进增加了更多功能。该对象仍然可用，但实现起来可能有些棘手。如今，所有现代浏览器都实现了 Fetch API，它允许你使用 `fetch`\
  \ 函数来完成大部分繁重的工作。它比旧的 `XMLHTTPRequest` 对象简单得多。\n\n在本章中，我们将通过几个小项目来探索 Ajax。每个项目都将使用\
  \ Ajax 从服务器获取额外数据。\n\n-   第一部分使用被劫持的链接来获取额外的 HTML 内容。\n-   第二部分通过从服务器获取图片列表，并利用你已经编写的代码来运行幻灯片，实现了一个幻灯片功能。\n\
  -   第三部分对灯箱画廊进行了类似的操作。此外，我们将创建包含缩略图的元素。\n-   第四部分从服务器获取国家列表以生成一个菜单。然后，我们使用该菜单刷新一个表单，表单中的数据是从服务器获取的更多数据。\n\
  \n通过完成这些，我们将培养以下技能：\n\n-   理解异步处理\n-   使用 `fetch()` 函数从服务器获取数据\n-   处理 JSON 字符串数据格式以传输复杂数据\n\
  -   在网页上创建元素\n-   使用 Ajax API 访问数据服务\n\n我们需要打开 `ajax.html` 来查看发生了什么，并打开 `ajax.js`\
  \ 来编写代码。我们还将使用 `library.js` 文件中的现有代码。\n\n\n\n## 时序问题\n\n在接下来的讨论中，请确保你已打开了一个页面，例如\
  \ `ajax.html`。如果没有打开页面，你很可能会遇到内容安全策略报错。\n\nAjax 编程中最棘手的问题始终在于时序。与网络服务器的所有通信都需要时间，而\
  \ JavaScript 又不喜欢等待。\n\n以下面这段代码为例：\n\n```\nvar image = new Image;\nimage.src = 'https://pure-javascript.net/random.jpg';\n\
  console.log(image.width);\n```\n\n`Image` 对象是一个虚拟图像，它具备图像的属性，但不会实际显示出来。如果你执行一次，很可能会得到结果\
  \ `0`。再执行一次，有可能得到更有意义的值，但也未必。\n\n问题在于请求新图像需要一点时间。JavaScript 不想干等着，就会跳到下一行，试图在图像可用之前读取其宽度，从而得到结果\
  \ `0`。我们称图像是**异步**加载的，也就是说，加载发生在后台。为了让你免于继续等待，图像可能会被存储在浏览器缓存中，这样下次加载就会更快——快得足以让\
  \ JavaScript 能够读取它的宽度，这就是为什么你再次尝试时可能会得到一个非零的结果。\n\n让 JavaScript 等待图像的一种方法是使用**回调**函数：\n\
  \n```\nvar image = new Image;\nimage.onload = function(event) {\n    console.log(image.width);\n\
  };\nimage.src = 'https://pure-javascript.net/random.jpg';\n```\n\n图像的 `onload` 属性被赋予一个函数，该函数将在图像加载完成后运行。通过推迟对图像的操作，现在代码就能按预期工作了。\n\
  \n使用 Ajax 时，你会不断遇到类似的时序问题：你试图获取一个资源（如文本），但 JavaScript 急于继续执行，因此数据总是到达得太晚。处理异步 Ajax\
  \ 调用的经典方法是同样使用一个 `onload` 事件监听器，将后续处理推迟到回调函数中。然而，对于 Ajax，回调函数要复杂得多，尤其是当你需要在此之后再发起另一个\
  \ Ajax 调用时。\n\n现代 JavaScript 通过**Promise（期约）**解决了这个问题。Promise 允许你包含一段在条件就绪时运行的代码，而无需费力处理回调函数。\n\
  \n## 使用 Fetch\n\n`fetch()` 函数向服务器请求一些数据，并返回一个**Promise**。Promise 是一种特殊对象，允许你添加接下来要执行的操作，类似于添加一系列回调函数。\n\
  \n典型的模式是：\n\n```\n//  假设示例\nfetch(url)                  //  第 1 步：请求某些内容\n.then(processResponse)\
  \      //  第 2 步\n.then(processData);         //  第 3 步\n```\n\n`url` 是你期望找到数据的位置。每个后续步骤都是一个传递给\
  \ `.next()` 方法的函数。该函数的数据取决于前一步骤中发生的情况。这里我们使用了名称 `processResponse` 和 `processData`，不过你通常会更常使用函数表达式。\n\
  \n对于 `fetch()` 函数，下一步骤将得到一个**响应（response）**对象作为其参数，通常（尽管不必然）被称为 `response`。响应对象包含从服务器返回的各种详细信息，但我们通常只对提取数据感兴趣。\n\
  \n你可以像这样定义 `processResponse()` 函数：\n\n```\nfunction processResponse(response) {\n\
  \    return response.text();\n}\n```\n\n`.text()` 方法从响应中提取文本。结果实际上不仅仅是文本：它是另一个包含文本的\
  \ Promise 对象。在后续章节中，一旦我们弄清楚了 `json()` 方法的含义，我们也会用到它。\n\n当然，我们也可以使用箭头函数表达式：\n\n```\n\
  response => {\n    return response.text();\n}\n```\n\n如果你只是要返回一个值，箭头函数表达式还有一种更简短的形式：\n\
  \n```\nresponse => response.text();\n```\n\n现在 `fetch()` 函数可以是这样的：\n\n```\n//  仍然是一个假设示例\n\
  fetch(url)\n.then(response => response.text())\n.then(processData);\n```\n\n下一步骤将涉及实际数据。`processData`\
  \ 函数将接收一个参数，其中包含来自前一步骤的文本。同样，如果处理逻辑足够简单，我们可以使用箭头函数表达式：\n\n```\n//  仍然仍然是一个假设示例\n\
  fetch(url)\n.then(response => response.text())\n.then(text => {\n    console.log(text);\n\
  });\n```\n\n这个箭头函数所做的不仅仅是返回一个值，这就是代码放在花括号内的原因。\n\n我们可以在控制台中尝试一下：\n\n```\nfetch('https://pure-javascript.net/quote.txt')\n\
  .then(response => response.text())\n.then(text => {\n    console.log(text);\n});\n\
  ```\n\n短暂停顿后，你会看到一句来自格劳乔·马克斯的随机名言，例如：\n\n*我一直在寻找一个像你这样的女孩——不是你，而是像你这样的女孩。*\n\n这就是基本原理。现在我们将把它付诸实践。对于本项目，我们需要处理\
  \ `ajax.html` 和 `ajax.js` 这两个文件。\n\nHTML 文件包含四个区域，我们将用它们来使用 Ajax。`ajax.js` 文件包含以下代码：\n\
  \n```\ninit();\nfunction init() {\n    ajaxContent();\n    ajaxSlideshow();\n  \
  \  ajaxLightbox();\n    ajaxCountries();\n}\nfunction ajaxContent() {\n}\nfunction\
  \ ajaxSlideshow() {\n}\nfunction ajaxLightbox() {\n}\nfunction ajaxCountries() {\n\
  }\n```\n\n每个函数分别处理 HTML 中的一个区域。\n\n## 获取所选内容\n\n在本项目的第一部分，我们将使用 Ajax 来获取点击链接时所需的文本内容。如果你打开\
  \ `ajax.html` 文件，会看到一个列表内的链接集合：\n\n```\n斑点土豚\n星夜\n幸运之国\n澳大利亚\n```\n\n如果你点击其中一个链接，浏览器会加载新文本，但我们希望劫持该链接，让浏览器将内容加载到一个容器\
  \ `div` 中：\n\n> 点击链接应使用新内容填充 `div`。内容本身是一个文本文件，但实际上包含 HTML 代码。\n\n我们在 `ajaxContent()`\
  \ 函数中设置初步的 JavaScript 代码：\n\n```\nfunction ajaxContent() {\n    let links = document.querySelector('ul#links');\n\
  \    let content = document.querySelector('div#content');\n}\n```\n\n`links` 变量引用链接列表，`content`\
  \ 变量引用将被填充内容的 `div`。\n\n### 劫持链接\n\n我们之前在灯箱项目中已经经历过劫持链接的过程。在这里，我们将采用不同的方法，使用委托事件监听器——也就是说，我们将事件监听器放在容器上。\n\
  \n我们首先将事件监听器挂载到 `links` 容器的 `onclick` 属性上：\n\n```\nfunction ajaxContent() {\n  \
  \  let links = document.querySelector('ul#links');\n    let content = document.querySelector('div#content');\n\
  \    links.onclick = event => {\n        event.preventDefault();\n    }\n}\n```\n\
  \n我们还添加了 `event.preventDefault()` 来阻止链接加载新页面。\n\n### 获取内容\n\n接下来，我们可以直接使用 `fetch()`\
  \ 函数加载内容，方式与之前的 `fetch` 练习类似。由于锚点已经包含了内容的引用，我们可以在 URL 参数中使用它：\n\n```\nfunction ajaxContent()\
  \ {\n    let links = document.querySelector('ul#links');\n    let content = document.querySelector('div#content');\n\
  \    links.onclick = event => {\n        event.preventDefault();\n        fetch(event.target.href)\n\
  \        .then(response => response.text())\n        .then(text => {\n         \
  \   content.innerHTML = text;\n        });\n    }\n}\n```\n\n\n\n这里务必记住使用 `event.target`。尽管事件监听器位于包含元素的列表上，但\
  \ `event.target` 引用的却是你实际点击的元素：即锚点（anchor）。通过锚点，我们可以利用 `.href` 属性获取内容的 URL。\n\n\
  与前一个练习相同，我们首先从响应中获取文本，并在下一步对其进行处理。在这个案例中，只需使用 `innerHTML` 填充 `content` 这个 `div`\
  \ 即可。\n\n现在，我们可以通过刷新页面并点击四个链接来测试此功能。这种技术的好处之一在于，你可以修改待加载的内容，而无需改动 HTML 文件本身。\n\n\
  ## Ajax 幻灯片\n\n项目的下一部分将重新探讨幻灯片。在幻灯片项目中，待加载的图片是硬编码的：首先是一个图片文件名数组，然后是一个包含图片文件名和标题的对象数组。我们现在要做的是，使用\
  \ Ajax 从外部源加载这个集合。\n\n在 `ajax.html` 文件中，幻灯片部分的代码只有寥寥几行：\n\n`slideshow.html` 文件中的内容确实也就这么多。大部分繁重的工作都在库文件中的\
  \ `doSlides()` 函数里完成。我们在这里要做的，是使用 Ajax 获取幻灯片对象的数组。但首先，我们需要了解一种名为 JSON 的数据格式。\n\n\
  ### JSON 简介\n\n传统上，简单的数据可以以文本文件的形式存储和传输。但对于更复杂的数据结构，这种方式就行不通了。一种替代方案是使用 XML 来结构化文本文件，XML\
  \ 是一种类似于 HTML 的标记语言。这就是 Ajax 中 **X** 的由来：异步 JavaScript 和 XML（Asynchronous JavaScript\
  \ and XML）。XML 非常流行，但在 JavaScript 应用中已显得过于繁琐。因此，一种更简单、更直接的文件格式应运而生。\n\n你已经见过使用如下\
  \ JavaScript 代码创建对象的方式：\n\n```\nvar apple = {\nname: 'Granny Smith',\nshape: 'Round',\n\
  colour: 'Green'\n};\n```\n\n你也可以使用如下方式创建对象数组：\n\n```\nvar apples = [\n{ name: 'Granny\
  \ Smith', shape: 'Round', colour: 'Green' },\n{ name: 'Fuji', shape: 'Round', colour:\
  \ 'Red' },\n];\n```\n\n当然，空格和缩进是可选的，它们的存在仅仅是为了便于人类阅读。注意最后一项后面的逗号。这可能略显粗心，但 JavaScript\
  \ 会宽容地忽略它。\n\n上述代码是纯粹的 JavaScript。JSON 则将这种表示法扩展到了字符串。JSON 这个词读作“j-son”，意为 **JavaScript\
  \ 对象表示法**。字符串形式与对象字面量非常相似，但它有一些非常严格的要求。第二个例子的 JSON 版本如下：\n\n```\nvar apples = `[\n\
  {\"name\":\"Granny Smith\", \"shape\":\"Round\", \"colour\":\"Green\"},\n{\"name\"\
  :\"Fuji\", \"shape\":\"Round\", \"colour\":\"Red\"}\n]`;\n```\n\n注意，字符串被包裹在反引号中。当然，这在\
  \ JSON 中并非必需，但它允许我们将字符串写成多行。\n\n这个字符串与之前的对象数组非常相似，但请注意以下标注差异：\n\n-   每个属性名都用双引号括起来。\n\
  -   所有字符串都用双引号括起来，而不是单引号。\n-   最后一项之后不能有尾随逗号。\n\n这对于普通的 JavaScript 对象字面量来说也是有效的，但却是\
  \ JSON 的绝对要求。\n\n一旦你有了 JSON 文本，通常可以使用 `JSON.parse(...)` 将其转换为合法的 JavaScript 对象：\n\
  \n```\nvar apples = `[\n{\"name\":\"Granny Smith\", \"shape\":\"Round\", \"colour\"\
  :\"Green\"},\n{\"name\":\"Fuji\", \"shape\":\"Round\", \"colour\":\"Red\"}\n]`;\n\
  apples = JSON.parse(apples);\n```\n\n`JSON` 这个内置对象只有两个方法：`JSON.parse()` 将字符串转换为对象，`JSON.stringify()`\
  \ 则执行相反的操作。如果你想知道为什么要费心在字符串和对象数据之间进行转换，那是因为字符串是一种简单、安全的数据形式——它们易于通过互联网连接传输，也易于保存在文本文件中。通过设计一种将对象编码为字符串的方法，你可以存储或传输更复杂的数据。JSON\
  \ 已变得非常流行，以至于在那些甚至没有 JavaScript 的其他各种平台上都得到了广泛支持。例如，PHP、Python 以及一些数据库也支持 JSON 格式。\n\
  \n### 加载幻灯片文件\n\n在 `images/slides/` 目录下有一个名为 `slides.json` 的文件。我们将采用与上一节获取文本内容相同的方式来获取这个文件。以下代码最终会被添加到\
  \ `ajaxSlides()` 函数中，但我们会先在控制台中试验一下。\n\n我们可以获取数据并使用 `JSON.parse()` 函数来解析它。请记住，在尝试此操作时，确保\
  \ `ajax.html` 页面是打开的，以避免跨域错误：\n\n```\nfetch('images/slides/slides.json')\n.then(response\
  \ => response.text())\n.then(text => {\nlet data = JSON.parse(text);\nconsole.log(data);\n\
  });\n```\n\n这样能行，但响应对象还有一个名为 `.json()` 的便捷快捷方法，可以为我们完成这项工作：\n\n```\nfetch('images/slides/slides.json')\n\
  .then(response => response.json())\n.then(data => {\nconsole.log(data);\n});\n```\n\
  \n现在，我们可以将其构建到我们的代码中。\n\n用于管理幻灯片的函数叫做 `ajaxSlides()`：\n\n```\nfunction ajaxSlideshow()\
  \ {\n}\n```\n\n在函数中，我们可以获取 JSON 文件并处理它：\n\n```\nfunction ajaxSlideshow() {\nfetch('images/slides/slides.json')\n\
  .then(response => response.json())\n.then(data => {\n});\n}\n```\n\n只剩最后一步了。\n\n\
  ### 运行幻灯片\n\n实际上，所有繁重的工作都已经完成了。回想一下，我们在库文件中保存了一个名为 `doSlides()` 的函数：\n\n```\ndoSlides(images,\
  \ containerSelector, delay)\n```\n\n在这种情况下，`images` 对象将来自 `fetch()` 函数，而 `containerSelector`\
  \ 只是对 HTML 中 `div` 的引用：\n\n```\nfunction ajaxSlideshow() {\nfetch('images/slides/slides.json')\n\
  .then(response => response.json())\n.then(data => {\ndoSlides(data, 'div#slides',\
  \ 3000);\n});\n}\n```\n\n延迟设置为默认值 `3000`，但你可以根据自己的喜好更改它，特别是在测试时。\n\n### Ajax 灯箱画廊\n\
  \n对于 Ajax 幻灯片来说，唯一显著不同的是图片集合的来源。以前，集合是在 JavaScript 代码中硬编码的。使用 Ajax，你可以从加载的文件中获取集合。\n\
  \n然而，对于灯箱画廊来说，情况要稍微复杂一些。画廊最初使用的是 HTML 链接中的图片集合，然后我们劫持这些链接以用于灯箱。在当前的文档中，你只会找到以下内容：\n\
  \n```\n你肯定会同意，这并不多。我们将结合使用 Ajax 和少量 DOM 操作来填充目录，然后让我们的库函数 `doLightbox()` 完成其余工作。\n\
  ```\n\nJavaScript 代码将位于 `ajaxLightbox()` 函数中。\n\n#### 获取画廊数据\n\n灯箱画廊中的图片与幻灯片中的图片相同。这意味着我们可以采用与幻灯片相同的方式来开始：\n\
  \n```\nfunction ajaxLightbox() {\nfetch('images/slides/slides.json')\n.then(response\
  \ => response.json())\n.then(data => {\n});\n}\n```\n\n从这里开始，任务就是使用这些数据来生成画廊。\n\n\
  #### 创建画廊元素\n\n计划是将画廊元素添加到容器中。首先，我们将设置一个变量来引用容器：\n\n```\nfunction ajaxLightbox()\
  \ {\nlet catalogue = document.querySelector('div#catalogue');\n...\n}\n```\n\n请记住，`fetch()`\
  \ 函数返回的数据将是一个对象数组。我们可以遍历这个数组：\n\n\n\n```javascript\nfunction ajaxLightbox() {\n\
  let catalogue = document.querySelector('div#catalogue');\nfetch('images/slides/slides.json')\n\
  .then(response => response.json())\n.then(data => {\ndata.forEach(item => {\n//\
  \  create gallery element\n});\n});\n}\n```\n\n每个画廊元素都是一个包含在锚点中的图像：\n\n我们将创建这些元素并将它们添加到画廊中。\n\
  \n在前面的代码中，我们大多使用 `document.createElement()` 来创建元素并添加到容器中。不过，也可以使用 HTML 代码创建元素，并通过\
  \ `.insertAdjacentHTML()` 添加：\n\n```javascript\n//  Not Yet\ndata.forEach(item =>\
  \ {\ncatalogue.insertAdjacentHTML(\n'beforeend',\n``\n);\n});\n```\n\n新元素被添加在 `beforeend`\
  \ 位置，这表示它被添加到容器的末尾。我们将 HTML 字符串放在反引号中，因为稍后需要用到模板字面量。\n\n对于实际的元素，有很多值需要替换。不过，我们可以将\
  \ HTML 字符串拆分成几行：\n\n```javascript\ndata.forEach(item => {\ncatalogue.insertAdjacentHTML(\n\
  'beforeend',\n`\n\n`\n);\n});\n```\n\n当然，你也可以把它写在一行里，但在这个书中显然空间不够。\n\n一旦画廊填充完成，你就可以将其传递给\
  \ `doLightbox()` 函数：\n\n```javascript\nfunction ajaxLightbox() {\nlet catalogue\
  \ = document.querySelector('div#catalogue');\n//  fetch ...\ndoLightbox('div#catalogue');\n\
  }\n```\n\n完成后的函数应该如下所示：\n\n```javascript\nfunction ajaxLightbox() {\nlet catalogue\
  \ = document.querySelector('div#catalogue');\nfetch('images/slides/slides.json')\n\
  .then(response => response.json())\n.then(data => {\ndata.forEach(item => {\ncatalogue.insertAdjacentHTML(\n\
  'beforeend',\n`\n\n`\n);\n});\ndoLightbox('div#catalogue');\n});\n}\n```\n\n你可能会注意到，画廊中的图片比原始版本更多。这正是此技术的一个优势：画廊变得更加灵活。\n\
  \n## 访问数据库\n\nAjax 最强大的应用之一在于数据源是动态的情况。这类数据通常来自服务器端的数据库。\n\n你不能直接使用 JavaScript 访问数据库。你可以做的是通过\
  \ Web 服务器向数据库服务器发起请求。其思路是，Web 服务器应当运行着某个监听此类请求的应用程序。\n\n如果你在轻量级 Web 服务器（例如 Micro\
  \ Web Server）上运行示例网站，则无法尝试此操作。如果你碰巧通过更强大的工具（例如 XAMPP）甚至完整的 Web 服务器来运行它，那么有一个 PHP\
  \ 脚本可以完成这项工作。\n\n在本节中，我们假设你并未运行此类 Web 服务器。相反，我们将依赖在线网站上的一个应用程序。\n\n用于支持 Ajax 访问的服务通常被称为\
  \ API，这是一个非常古老的术语。它的意思是应用程序编程接口。实际上，它仅意味着该服务会接收格式正确的请求，并返回某种结果。\n\n在本示例中，我们将使用一个提供世界各国信息的\
  \ API。\n\n我们使用的服务将返回 JSON 格式的数据。但并非总是如此。另一种常见的格式是 XML，JavaScript 处理 XML 需要额外做很多工作。\n\
  \n并非所有 API 都可以免费使用。有些需要注册，有些则需要付费。\n\n无论如何，访问其他服务器上的数据并不总是被允许的。服务器需要设置为允许来自其他来源的请求。那些提供\
  \ API 的服务器自然已经完成了这样的设置。\n\n## 使用 API\n\nAPI 通常以带有查询字符串的 URL 形式存在。查询字符串是问号后面的部分，用于提供额外信息。\n\
  \n当 API 开放使用时，你通常会看到相关使用说明。在本例中：\n\n* 单独的 URL 会返回国家列表。\n* 查询字符串 `id=...` 会返回特定国家的详细信息。\n\
  \n在许多情况下，你还需要提供某种密钥来验证用户身份。\n\n\n\n在实时示例中，URL 是\n\n```\nhttps://pure-javascript.net/resources/countries.php\n\
  ```\n\n你可以在浏览器中尝试这个链接。\n\n你会发现该 URL 直接返回一个 JSON 字符串，其中包含国家 ID 和名称的列表。\n\n```\n[\n\
  { \"id\": \"af\", \"name\": \"Afghanistan\" },\n{ \"id\": \"al\", \"name\": \"Albania\"\
  \ },\n{ \"id\": \"dz\", \"name\": \"Algeria\" },\n...\n{ \"id\": \"zm\", \"name\"\
  : \"Zambia\" },\n{ \"id\": \"zw\", \"name\": \"Zimbabwe\" }\n]\n```\n\n你的浏览器可能会解析\
  \ JSON，并以更偏向数据视图的方式呈现。你可能需要查看原始数据才能看到实际的 JSON 字符串。\n\n你可以通过在 URL 后添加查询字符串来进行测试：\n\
  \n```\nhttps://pure-javascript.net/resources/countries.php?id=au\n```\n\n现在你将得到一个国家的详细信息：\n\
  \n```\n{\n\"id\":\"au\",\n\"name\":\"Australia\",\n\"local_name\":\"Australia\"\
  ,\n\"capital\":\"Canberra\",\n\"alpha3\":\"AUS\",\n\"tld\":\"au\",\n\"numeric\"\
  :\"036\",\n\"phone\":\"61\",\n\"continent\":\"Australia\",\n\"population\":\"22751014\"\
  ,\n\"area\":\"7741220\",\n\"coastline\":\"25760\",\n\"currency\":\"AUD\"\n}\n```\n\
  \n我们不会使用所有这些详细信息。\n\n## 使用 Ajax 调用 API\n\n在示例页面底部附近有一个表单，用于显示某些国家详细信息。以下是该表单的简化版本：\n\
  \n```\n\n选择国家\n\n本地名称\n\n顶级域名\n\n大洲\n\n货币\n\n```\n\n表单元素大部分是用于接收数据的输出元素。然而，表单中包含一个`select`元素，它将显示为下拉菜单。目前`select`元素是空的：我们需要用\
  \ JavaScript 来填充它。\n\n对于普通的`select`元素，其选项应为`option`元素：\n\n```\nApple\nBanana\nCherry\n\
  \n```\n\n如果提交表单，`select`项的值将是所选选项的 value。\n\n## 准备 `select` 元素\n\n我们将把所有代码放在`ajaxCountries()`函数中。\n\
  \n首先，我们可以找到这个表单：\n\n```\nfunction ajaxCountries() {\nlet countriesForm\n= document.querySelector('form#country-details');\n\
  }\n```\n\n下拉菜单的问题在于总会有一个选项被选中。通常，比较好的做法是先提供一个实际上不选任何内容的选项，类似这样：\n\n```\n选择一个国家 ...\n\
  ```\n\n你可以使用`document.createElement()`来创建`option`元素，但有一个专门的函数可以简化这个过程：\n\n```\n\
  new Option(text, value)\n```\n\n严格来说，`Option()`被称为构造函数，用于生成对象；构造函数通常与`new`关键字一起使用。在这种情况下，生成的对象将是一个`option`元素，这正是我们所需要的。\n\
  \n我们可以直接将新的`option`元素追加到`select`元素中：\n\n```\nfunction ajaxCountries() {\nlet countriesForm\n\
  = document.querySelector('form#country-details');\ncountriesForm.elements['id'].append(\n\
  new Option('选择一个国家 ...', '')\n);\n}\n```\n\n记住，`select`元素是表单的一部分，因此我们可以通过`countriesForm.elements`来引用它。这里，文本是`选择...`，值将是一个空字符串。下一步是从\
  \ API 中获取国家列表，并用其填充`select`元素的其余部分。\n\n首先，我们定义获取数据的 URL：\n\n```\nfunction ajaxCountries()\
  \ {\nlet url = 'https://pure-javascript.net/resources/countries.php';\n...\n}\n\
  ```\n\n这样，在后续使用时会简化代码。\n\n接下来，我们可以从该 URL 获取国家列表：\n\n```\nfunction ajaxCountries()\
  \ {\nlet url = 'https://pure-javascript.net/resources/countries.php';\nlet countriesForm\n\
  = document.querySelector('form#country-details');\ncountriesForm.elements['id'].append(\n\
  new Option('选择一个国家 ...', '')\n);\nfetch(url)\n.then(response => response.json())\n\
  .then(data => {\n//  添加选项\n});\n}\n```\n\n`fetch()`函数将获取一个包含国家 ID 和名称列表的 JSON 对象，我们将把它转换成`option`元素。\n\
  \n我们可以遍历数据数组，并使用`new Option()`来添加`option`元素。文本将是每个项的`name`属性，而值将是`id`属性：\n\n```\n\
  function ajaxCountries() {\n...\nfetch(url)\n.then(response => response.json())\n\
  .then(data => {\ndata.forEach(item=> {\ncountriesForm.elements['id'].append(\nnew\
  \ Option(item.name, item.id));\n});\n});\n}\n```\n\n如果你现在尝试，会看到下拉菜单中填充了国家列表。下一步，当从菜单中选择一个国家时，将填充表单的其余部分。\n\
  \n## 响应选择操作\n\n表单元素的值可能会发生变化，当发生这种变化时，会触发一个`change`事件。这也是为什么菜单应该从空值开始的原因：这样可以确保即使选择了第一个真实值，也总会触发\
  \ change 事件。\n\n你可以通过简单地赋值`.onchange`事件属性来添加事件监听器：\n\n```\nfunction ajaxCountries()\
  \ {\n...\ncountriesForm.onchange = event => {\n};\n}\n```\n\n当选项发生变化时，将使用下拉菜单的当前值再次发起\
  \ fetch 请求：\n\n```\nfunction ajaxCountries() {\n...\ncountriesForm.onchange = event\
  \ => {\nfetch(`${url}?id=${event.target.value}`)\n.then(response => response.json())\n\
  .then(data => {\n//  处理结果\n});\n};\n}\n```\n\n请注意，我们使用了模板字面量来拼接字符串，以便同时使用`url`变量和`event.target.value`。查询字符串由字符串`?id=`和所选国家项的当前值组成。\n\
  \n当我们从`fetch()`函数获得结果后，可以填充表单的其余部分：\n\n```\nfunction ajaxCountries() {\n...\ncountriesForm.onchange\
  \ = event => {\nfetch(`${url}?id=${event.target.value}`)\n.then(response => response.json())\n\
  .then(data => {\ncountriesForm.elements['local-name'].value\n= data['local_name'];\n\
  countriesForm.elements['tld'].value = data['tld'];\ncountriesForm.elements['continent'].value\n\
  = data['continent'];\ncountriesForm.elements['currency'].value\n= data['currency'];\n\
  });\n}\n}\n```\n\n我们再次使用`response.json()`将接收到的 JSON 字符串转换为对象。转换后，我们填充四个输出元素的值。要完成这项工作，还有一项任务。在某些时候，用户可能会选择第一个选项`选择...`。作为开发者，你需要意识到潜在的错误，并尽量赶在用户之前进行处理。\n\
  \n请记住，第一个选项的值是一个空字符串。当我们从服务器返回结果时，不会有任何数据。我们可以使用空值合并运算符（`??`）来检测这种情况：\n\n```\nfunction\
  \ ajaxCountries() {\n...\ncountriesForm.onchange = event => {\n...\n.then(data =>\
  \ {\ncountriesForm.elements['local-name'].value\n= data['local_name'] ?? '';\ncountriesForm.elements['tld'].value\n\
  = data['tld'] ?? '';\ncountriesForm.elements['continent'].value\n= data['continent']\
  \ ?? '';\ncountriesForm.elements['currency'].value\n= data['currency'] ?? '';\n\
  });\n}\n}\n```\n\n缺失的`data`值会是`undefined`。使用空值合并运算符，我们可以将其替换为空字符串`''`。\n\n完成后的代码如下所示：\n\
  \n```\nfunction ajaxCountries() {\nlet url = 'https://pure-javascript.net/resources/countries.php';\n\
  let countriesForm\n= document.querySelector('form#country-details');\ncountriesForm.elements['id'].append(new\
  \ Option('选择...',''));\nfetch(url)\n.then(response => response.json())\n.then(data\
  \ => {\ndata.forEach(item=> {\ncountriesForm.elements['id'].append(\nnew Option(item.name,item.id));\n\
  });\n});\ncountriesForm.onchange = event => {\nfetch(`${url}?id=${event.target.value}`)\n\
  .then(response => response.json())\n.then(data => {\ncountriesForm.elements['local-name'].value\n\
  = data['local_name'] ?? '';\ncountriesForm.elements['tld'].value\n= data['tld']\
  \ ?? '';\ncountriesForm.elements['continent'].value\n= data['continent'] ?? '';\n\
  countriesForm.elements['currency'].value\n= data['currency'] ?? '';\n});\n}\n}\n\
  ```\n\n在 Ajax 及其相关函数成为 JavaScript 标准组成部分之前，从服务器获取新数据需要重新加载整个页面，这会给用户带来糟糕的体验。\n\n\
  \n\n## 总结\n本章我们学习了如何使用 Ajax 从 web 服务器获取额外数据。在幻灯片和灯箱图库中，我们之前已经以图像形式获取过额外数据。而本章，我们着重探讨了如何获取文本以及更复杂的数据。\n\
  \n### 使用 `fetch()` 函数\n需要克服的主要问题是**时机**。由于 web 请求（包括 Ajax 请求）需要一定的时间，代码的编写必须确保对数据的处理推迟到数据到达之后。`fetch()`\
  \ 函数允许你向服务器发送 Ajax 请求，并返回一个 `Promise` 对象。该 `Promise` 对象可以附加代码，以便在数据到达后对其进行处理。一个简单的\
  \ `fetch()` 应用在请求数据后可以分两步操作：第一步是从响应中提取数据，第二步是处理提取到的数据。如果数据是简单的文本，则可以立即使用，例如用于填充其他元素的内容。\n\
  \n### 使用 JSON\nJavaScript 支持一种对象字面量格式，允许直接在代码中定义一个对象或一个对象数组。JSON 字符串格式是一种类似于对象字面量的字符串，可以使用内置的\
  \ JavaScript 函数将其转换为真实的对象或对象数组。JSON 的真正优势在于能够将复杂数据表示为单个字符串。字符串可以轻松地保存在文本文件中或通过互联网传输，而复杂数据则不那么容易管理。JSON\
  \ 数据可以来自服务器上保存的文件，也可以像 PHP 和数据库那样，通过服务器端的某些处理动态生成。JavaScript 有一个内置函数 `JSON.parse()`，用于转换\
  \ JSON 字符串。但 `fetch()` 的响应对象本身有一个 `.json()` 方法，它可以对接收到的 JSON 字符串执行相同的转换。\n\n###\
  \ 与 DOM 交互\n之前的项目通过更改或添加元素来与 DOM 交互。在这个项目中，我们对此进行了扩展：使用 `.innerHTML` 填充元素，使用 `.insertAdjacentHTML()`\
  \ 为灯箱图库创建锚点和图像，以及使用 `new Option()` 填充 `select` 元素。我们还学习了如何使用 `change` 事件响应表单，以触发另一个\
  \ `fetch()` 并填充表单的其余部分。\n\n### Ajax API\n有许多第三方以 Ajax API 的形式提供数据服务。这些服务通常返回 JSON\
  \ 字符串，尽管有些使用其他形式的数据，例如 XML。访问第三方 API 需要对方的服务器接受连接。有些服务会限制只有注册用户（可能还需要付费）才能访问。\n\n\
