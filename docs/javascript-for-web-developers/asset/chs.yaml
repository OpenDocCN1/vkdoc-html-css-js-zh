  \n## 代码编辑器\n\n除了图片，网站的大部分文件（尤其是这里的示例网站）都是文本文件。这意味着你可以使用任何旧版文本编辑器来编辑这些文件，甚至 Windows\
  \ 记事本也可以——如果你觉得这样很有趣的话。\n\n更实际的做法是，你会希望使用一款专为编写代码而设计的文本编辑器。以下是你会需要的功能：\n\n*   能够显示项目文件夹视图，方便在文件之间切换。\n\
